  // Progress also syncs to the viewer's private record when the page runs inside claude.ai with an account that allows it.
  const Sync = (function () {
    let ref = null, timer = 0, writing = false, again = false, retried = false, status = 'local';
    async function init() {
      try {
        if (!window.claude || typeof window.claude.use !== 'function') return;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) return;
        const uid = await user.id();
        if (!uid) return;
        const r = db.doc('data/users/' + uid + '/progress-v2');
        const snap = await r.get();
        ref = r;
        status = 'synced';
        const remote = snap.exists ? (snap.data() || {}).state : null;
        if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) adopt(remote);
        else if (S.updatedAt && (!remote || (remote.updatedAt || 0) < S.updatedAt)) schedule();
        document.addEventListener('visibilitychange', onVisibility);
      } catch (e) { ref = null; status = 'local'; }
      paintSyncLine();
    }
    function adopt(remote) {
      S = migrate(JSON.parse(JSON.stringify(remote)));
      writeLocal();
      if (!ui.session) renderAll();
    }
    function schedule() { if (!ref) return; clearTimeout(timer); timer = setTimeout(flush, 2500); }
    async function flush() {
      if (!ref) return;
      if (writing) { again = true; return; }
      writing = true;
      clearTimeout(timer);
      timer = 0;
      try {
        await ref.set({ state: JSON.parse(JSON.stringify(S)), savedAt: Date.now() });
        status = 'synced';
        retried = false;
      } catch (e) {
        if (e && e.code === 'unavailable' && !retried) { retried = true; setTimeout(schedule, 1200 + Math.random() * 1800); }
        else if (!(e && (e.code === 'resource_exhausted' || e.code === 'unavailable'))) { ref = null; status = 'local'; }
      } finally {
        writing = false;
        paintSyncLine();
        if (again) { again = false; schedule(); }
      }
    }
    async function onVisibility() {
      if (!ref) return;
      if (document.visibilityState === 'hidden') { if (timer) flush(); return; }
      if (ui.session) return;
      try {
        const snap = await ref.get();
        const remote = snap.exists ? (snap.data() || {}).state : null;
        if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) adopt(remote);
      } catch (e) { /* keep local copy */ }
    }
    return { init, schedule, get status() { return status; } };
  })();

  // ---------------- sound ----------------
  const Sound = (function () {
    let ctx = null;
    function ac() {
      if (!ctx) { try { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); } catch (e) { ctx = null; } }
      return ctx;
    }
    function tone(f, t0, dur, type, gain) {
      const a = ac(); if (!a) return;
      try {
        const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
        o.type = type || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain || 0.07, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
      } catch (e) { /* audio unavailable */ }
    }
    const on = () => S.settings.sound;
    return {
      unlock() { const a = on() && ac(); if (a && a.state === 'suspended') a.resume().catch(() => {}); },
      good() { if (on()) { tone(784, 0, 0.12); tone(1175, 0.08, 0.2); } },
      bad() { if (on()) tone(185, 0, 0.26, 'triangle', 0.06); },
      tick() { if (on()) tone(660, 0, 0.07, 'sine', 0.04); },
      fanfare() { if (on()) [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.24)); },
    };
  })();

      <p class="lede">Every intermediate exercise from the Lia Edit sheet, word for word, in sheet order.</p>
      <label class="search">${icon('search')}<input id="q" type="search" placeholder="Search exercises" value="${esc(ui.q)}" autocomplete="off" aria-label="Search exercises"></label>
      <div id="manual-list">${ui.q.trim() ? searchResults(ui.q) : appList()}</div>
    </div>`;
  }

  function badgeHTML(b, fresh) {
    const got = !!S.badges[b.id];
    const glyph = b.app ? `<span class="abbr">${ABBR[b.app] || '?'}</span>` : icon(b.icon || 'check');
    return `<div class="badge${got ? '' : ' locked'}${fresh ? ' fresh' : ''}"><div class="medal">${glyph}</div><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`;
  }
  function syncLine() {
    if (Sync.status === 'synced') return 'Progress saves to your Claude account and follows you to any device where you open this page signed in.';
    return STANDALONE ? 'Progress saves on this phone inside the app. To move it to another phone, copy a backup code here and restore it there.'
      : 'Progress saves in this browser on this device. To move it to another phone or browser, copy a backup code and restore it there.';
  }
  function paintSyncLine() { const el = $('#sync-line'); if (el) el.textContent = syncLine(); }
  function viewProgress() {
    const lv = E.level(S.xp), now = Date.now(), N = E.FULL.length;
    let met = 0, mastered = 0, solid = 0;
    for (const e of E.FULL) { const b = E.box(S, e.id); if (b > 0) met++; if (b >= 3) solid++; if (b >= 5) mastered++; }
    const acc = S.stats.answered ? Math.round(100 * S.stats.correct / S.stats.answered) + '%' : '–';
    const span = lv.next ? lv.next - lv.floor : 1, into = lv.next ? (S.xp - lv.floor) / span : 1;
    const earned = E.BADGES.filter(b => S.badges[b.id]).length;
    const seg = (act, vals, cur, fmtv) => `<div class="seg" role="group">${vals.map(v => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${fmtv ? fmtv(v) : v}</button>`).join('')}</div>`;
    const armed = ui.resetArm > now;
    return `<div class="wrap">${topbar()}
      <h1 class="page-title display">Progress</h1>
      <section class="panel level" style="margin-top:14px" aria-label="Level">
        <div class="label">Level</div>
        <div class="lv-name display num">${lv.n}</div>
        <div class="xpbar" role="img" aria-label="${Math.round(into * 100)}% of the way to the next level"><i style="width:${(into * 100).toFixed(1)}%"></i></div>
        <p class="lv-line"><span class="num">${S.xp.toLocaleString()} points</span> · ${lv.next ? `${(lv.next - S.xp).toLocaleString()} to level ${lv.n + 1}` : 'top level'}</p>
      </section>
      <div class="stats">
        <div class="stat"><b class="num">${met}<small>/${N}</small></b><span>Exercises studied</span></div>
        <div class="stat"><b class="num">${mastered}<small>/${N}</small></b><span>Mastered</span></div>
        <div class="stat"><b class="num">${acc}</b><span>Answers right</span></div>
        <div class="stat"><b class="num">${E.streak(S, now)}</b><span>Day streak</span></div>
      </div>
      <section class="sec">
        <div class="sec-head"><h2>Mastery map</h2><span class="label">${solid} solid</span></div>
        <p class="hint">One square per exercise, darker as you master it. Tap a square to open it.</p>
        <div class="map">${E.FULL_APPS.map(a => {
          const list = E.FULL_BY_APP.get(a), m = mastery(list);
          return `<div class="map-row"><div class="map-head"><b>${esc(a)}</b><span class="num">${m.solid} of ${list.length} solid</span></div><div class="tiles">${list.map(e => {
            const b = E.box(S, e.id);
            return `<button class="tile b${b}" data-act="open-ex" data-id="${e.id}" data-from="progress" title="${esc(e.name)} · ${E.STAGES[b]}" aria-label="${esc(e.name)}, ${E.STAGES[b]}"></button>`;
          }).join('')}</div></div>`;
        }).join('')}</div>
        <div class="legend" aria-label="Legend">${E.STAGES.map((s, i) => `<span><i class="tile b${i}"></i>${s}</span>`).join('')}</div>
      </section>
      <section class="sec">
        <div class="sec-head"><h2>Badges</h2><span class="label">${earned} of ${E.BADGES.length}</span></div>
        <div class="badges">${E.BADGES.map(b => badgeHTML(b, false)).join('')}</div>
      </section>
      <section class="sec">
        <div class="sec-head"><h2>Settings</h2></div>
        <div class="card-set">
          <label class="field"><span class="label">Your name</span><input id="name" class="input" maxlength="24" autocomplete="off" value="${esc(S.name)}" placeholder="Optional, for the greeting"></label>
          <div class="field"><span class="label">Daily goal (points)</span>${seg('goal', [50, 100, 150], S.settings.goal)}</div>
          <div class="field"><span class="label">New exercises per session</span>${seg('newper', [2, 4, 6], S.settings.newPer)}</div>
          <div class="field"><span class="label">Sound</span>${seg('sound', [1, 0], S.settings.sound ? 1 : 0, v => v ? 'On' : 'Off')}</div>
        </div>
        <div class="card-set">
          <div class="field"><span class="label">Saving</span><p class="hint" id="sync-line">${esc(syncLine())}</p></div>
          <button class="btn ghost small" data-act="backup">${icon('copy')}Copy backup code</button>
          <label class="field"><span class="label">Restore from a backup code</span><textarea id="restore" class="input" rows="3" placeholder="Paste a backup code here"></textarea></label>
          <button class="btn ghost small" data-act="restore">Restore progress</button>
          <p class="msg" id="restore-msg" role="status"></p>
        </div>
        <button class="btn danger small" data-act="reset">${armed ? 'Tap again to erase all progress' : 'Reset all progress'}</button>
        <p class="hint version">Source: ${esc(DATA.source.sheet)} tab of ${esc(DATA.source.file)} · ${E.EX.length} intermediate exercises, ${E.FULL.length} with instructions · built ${esc(DATA.source.built)}${window.POWERHOUSE_VERSION ? ' · app ' + esc(window.POWERHOUSE_VERSION) : ''}</p>
      </section>
    </div>`;
  }

  function renderTabbar() {
    const tabs = [['today', 'Today'], ['manual', 'Manual'], ['progress', 'Progress']];
    $('#tabbar').innerHTML = `<div class="tabbar-in">${tabs.map(([k, l]) => `<button class="tab" data-act="tab" data-tab="${k}"${ui.tab === k ? ' aria-current="page"' : ''}>${icon(k)}<span>${l}</span></button>`).join('')}</div>`;
  }
  function renderView() {
    $('#view').innerHTML = ui.tab === 'today' ? viewToday() : ui.tab === 'manual' ? viewManual() : viewProgress();
  }
  function renderAll() { renderTabbar(); renderView(); }

  // ---------------- session ----------------
  const cur = () => ui.session.items[ui.session.i];
  const SECTION = { setup: ['setup', 'Set up'], springs: ['springs', 'Springs'], reps: ['reps', 'Reps'], cue: ['cueing', LBL.cueing], mods: ['modifications', LBL.modifications],
    notes: ['notes', LBL.notes], missing: ['instructions', LBL.instructions], identify: ['instructions', LBL.instructions], order: ['instructions', LBL.instructions],
    famSetup: ['setup', 'Set up'], famWhich: ['instructions', LBL.instructions] };

  function startSession(mode, opt) {
    opt = opt || {};
    const now = Date.now();
    let items = [], title = 'Session';
    const timed = mode === 'challenge' || mode === 'exam';
    const exclude = opt.only ? new Set(Object.keys(E.TYPES).filter(t => !opt.only.has(t))) : (timed ? NO_RECALL : undefined);
    if (mode === 'daily') items = E.materialize(E.specsDaily(S, now), { exclude });
    else if (mode === 'drill') { items = E.materialize(E.specsDrill(S, opt.app, now), { exclude }); title = opt.app + ' drill'; }
    else if (mode === 'exercise') { items = E.materialize(E.specsExercise(S, opt.id, now), { distinct: true, exclude }); title = 'Quiz'; }
    else if (mode === 'challenge') { items = E.materialize([E.challengeSpec(S, 0, null)], { exclude }); title = 'Challenge'; }
    else if (mode === 'exam') { items = E.materialize(E.specsExam(S, opt.scope), { exclude }); title = opt.scope === 'all' ? 'Exam' : 'Exam · ' + opt.scope; }
    if (opt.only) items = items.filter(it => it.kind === 'learn' || opt.only.has(it.type));
    if (!items.length) { toast('Nothing to study here yet.'); return; }
    ui.session = { mode, title, items, i: 0, phase: 'ask', pick: null, order: [], revealed: false, fb: null, results: [],
      xp: 0, combo: 0, best: 0, lives: 3, retries: 0, startLevel: E.level(S.xp).n, changes: {}, badges: [], goalHit: false };
    Sound.unlock();
    openOverlay();
    renderSession();
  }

  function openOverlay() {
    $('#ov').hidden = false;
    document.documentElement.classList.add('locked');
    $('#ov-track').innerHTML = trackSVG();
    trackP = 0;
    drawTrack(0);
  }
  function closeOverlay() {
    const had = ui.session && ui.session.phase !== 'done' && ui.session.results.length;
    ui.session = null;
    $('#ov').hidden = true;
    document.documentElement.classList.remove('locked');
    renderAll();
    if (had) toast('Your answers so far are saved.');
  }

  function metaHTML() {
    const s = ui.session;
    if (s.mode === 'challenge') {
      const sc = s.results.filter(r => r.result === 'ok').length;
      return `<span class="lives" aria-label="${s.lives} lives left">${[0, 1, 2].map(k => icon('circle', k < s.lives ? '' : 'lost')).join('')}</span><span class="num">${sc}</span>`;
    }
    if (s.mode === 'exam') return `<span class="num">${Math.min(s.results.length + 1, 20)}/20</span>`;
    if (s.combo >= 2) return `${icon('bolt')}<span class="num">${s.combo}</span>`;
    const total = s.items.filter(x => x.kind !== 'learn').length;
    return `<span class="num">${s.results.length}/${total}</span>`;
  }
  function qHead(q) {
    const e = E.BY_ID.get(q.exId), p = q.prompt, s = ui.session;
    const answered = s.phase !== 'ask' && s.mode !== 'exam';
    let ctx = '';
    if (p.context) {
      const c = p.context, n = c.k + 1;
      const gap = answered ? `<li class="gap filled"><b>${n}</b><span>${esc(q.options[q.answer])}</span></li>` : `<li class="gap"><b>${n}</b><span>Missing step</span></li>`;
      ctx = `<ol class="ctx">${c.before ? `<li><b>${n - 1}</b><span>${esc(c.before)}</span></li>` : ''}${gap}${c.after ? `<li><b>${n + 1}</b><span>${esc(c.after)}</span></li>` : ''}</ol>`;
    }
    const quote = p.lines ? `<div class="quote">${p.lines.map(l => `<p>${esc(l)}</p>`).join('')}</div>` : '';
    return `<div class="q-meta">${(q.hideApp || p.hideApp) ? '' : `<span class="app-chip">${esc(e.apparatus)}</span>`}<span class="type">${esc(q.label)}</span>${q.retry ? '<span class="type muted">Again</span>' : ''}</div>
      <p class="q-q">${esc(p.q)}</p>
      ${p.name ? `<h2 class="q-name">${esc(p.name)}</h2>` : ''}
      ${p.context ? `<p class="q-note">Step ${p.context.k + 1} of ${p.context.n}</p>` : ''}
      ${quote}${ctx}`;
  }
  function familyHTML(f) {
    return `<div class="fam">${f.apparatus.map(a => `<div class="fam-row"><b>${esc(a)}</b><span>${f.members.map(id => E.BY_ID.get(id)).filter(x => x.apparatus === a).map(x => esc(x.name)).join(' · ')}</span></div>`).join('')}</div>`;
  }
  function explainHTML(q) {
    const e = E.BY_ID.get(q.exId), sec = SECTION[q.type];
    let inner = '';
    if (q.explainFam && E.FAM.get(q.fam)) {
      const f = E.FAM.get(q.fam);
      return `<div class="explain"><div class="label">${esc(f.name)} · ${f.apparatus.length} apparatus</div>${familyHTML(f)}</div>`;
    }
    if (sec) {
      const v = e[sec[0]];
      inner = Array.isArray(v) ? linesHTML(v) : `<p>${esc(v)}</p>`;
    }
    return `<div class="explain"><div class="label">${esc(e.name)}${sec ? ' · ' + esc(sec[1]) : ''}</div>${inner}
      <button class="link" data-act="card" data-id="${e.id}">${icon('card')}Open the full card</button></div>`;
  }
  function mcBody(q) {
    const s = ui.session, answered = s.phase !== 'ask', exam = s.mode === 'exam';
    const nameOpts = q.names || q.type === 'apparatus';
    const opts = q.options.map((o, i) => {
      let cls = 'opt' + (nameOpts ? ' name' : ''), key = 'ABCD'[i];
      if (answered && exam && i === s.pick) cls += ' locked';
      if (answered && !exam) {
        if (i === q.answer) { cls += ' right'; key = icon('check'); }
        else if (i === s.pick) { cls += ' wrong'; key = icon('close'); }
      }
      return `<button class="${cls}" data-act="opt" data-i="${i}"><span class="key">${key}</span><span class="opt-t">${esc(o)}</span></button>`;
    }).join('');
    return qHead(q) + `<div class="opts${answered ? ' answered' : ''}" role="group" aria-label="Answers">${opts}</div>` +
      (answered && !exam && s.pick !== q.answer ? explainHTML(q) : '');
  }
  function orderBody(q) {
    const s = ui.session, checked = s.phase !== 'ask', exam = s.mode === 'exam';
    const rows = q.items.map((it, i) => {
      const k = s.order.indexOf(i);
      let cls = 'opt' + (k >= 0 ? ' picked' : '');
      let note = '';
      if (checked && !exam) {
        const ok = k === it.pos;
        cls = 'opt ' + (ok ? 'right' : 'wrong');
        if (!ok) note = `<em class="should">Should be ${ordinal(it.pos + 1)}</em>`;
      }
      return `<button class="${cls}" data-act="ord" data-i="${i}"><span class="key">${k >= 0 ? k + 1 : ''}</span><span class="opt-t">${esc(it.t)}${note}</span></button>`;
    }).join('');
    const correct = checked && !exam && s.fb && s.fb.result !== 'ok'
      ? `<div class="explain"><div class="label">Correct order</div><ol class="plain">${q.items.slice().sort((a, b) => a.pos - b.pos).map(x => `<li><span>${esc(x.t)}</span></li>`).join('')}</ol><button class="link" data-act="card" data-id="${q.exId}">${icon('card')}Open the full card</button></div>` : '';
    return qHead(q) + `<p class="q-note">Tap the steps in order. Tap again to undo.</p><div class="opts${checked ? ' answered' : ''}" role="group" aria-label="Steps">${rows}</div>` + correct;
  }
  const ordinal = n => ['first', 'second', 'third', 'fourth', 'fifth'][n - 1] || n + 'th';
  function recallBody(q) {
    const s = ui.session, e = E.BY_ID.get(q.exId);
    const v = e[q.field];
    const body = Array.isArray(v) ? linesHTML(v) : `<p>${esc(v)}</p>`;
    const title = q.field === 'instructions' ? LBL.instructions : q.field === 'cueing' ? LBL.cueing : LBL.setup;
    return qHead(q) + (s.revealed ? `<div class="reveal"><div class="label">${esc(title)}</div>${body}</div>`
      : `<div class="think">Say it out loud, then tap <b>Show answer</b> and grade yourself.</div>`);
  }
  function learnBody(it) {
    return `<div class="q-meta"><span class="type">New exercise</span></div><article class="ex-card">${onePager(E.BY_ID.get(it.exId), true)}</article>`;
  }
  function fbHTML() {
    const f = ui.session.fb;
    const cls = f.result === 'ok' ? 'good' : f.result === 'partial' ? 'meh' : 'bad';
    const ic = f.result === 'ok' ? 'check' : f.result === 'partial' ? 'chev' : 'close';
    return `<div class="fb ${cls}" role="status"><span class="fb-ico">${icon(ic)}</span><div class="fb-t"><b>${esc(f.title)}</b>${f.msg ? `<p>${esc(f.msg)}</p>` : ''}</div>${f.xp ? `<span class="xp num">+${f.xp}</span>` : ''}</div>`;
  }

  function renderSession() {
    const s = ui.session;
    if (!s) return;
    $('#ov-meta').innerHTML = s.phase === 'done' ? '' : metaHTML();
    const body = $('#ov-body'), foot = $('#ov-foot');
    let b = '', f = '';
    if (s.phase === 'done') { b = summaryHTML(); f = summaryFoot(); }
    else {
      const it = cur();
      if (it.kind === 'learn') { b = learnBody(it); f = `<button class="btn" data-act="next">Quiz me on it</button>`; }
      else if (it.kind === 'mc') { b = mcBody(it); if (s.phase === 'feedback' && s.mode !== 'exam') f = fbHTML() + `<button class="btn" data-act="next">Continue</button>`; }
      else if (it.kind === 'order') {
        b = orderBody(it);
        if (s.phase === 'ask') f = `<div class="btn-row"><button class="btn ghost" data-act="ord-clear"${s.order.length ? '' : ' disabled'}>Clear</button><button class="btn" data-act="check"${s.order.length === it.items.length ? '' : ' disabled'}>Check</button></div>`;
        else if (s.mode !== 'exam') f = fbHTML() + `<button class="btn" data-act="next">Continue</button>`;
      } else if (it.kind === 'recall') {
        b = recallBody(it);
        if (s.phase === 'ask' && !s.revealed) f = `<button class="btn" data-act="reveal">Show answer</button>`;
        else if (s.phase === 'ask') f = `<div class="btn-row three"><button class="btn ghost small" data-act="self" data-g="miss">Missed it</button><button class="btn ghost small" data-act="self" data-g="partial">Partly</button><button class="btn small" data-act="self" data-g="ok">Got it</button></div>`;
        else f = fbHTML() + `<button class="btn" data-act="next">Continue</button>`;
      }
    }
    body.innerHTML = `<div class="ov-inner">${b}</div>`;
    foot.innerHTML = f ? `<div class="ov-foot-in">${f}</div>` : '';
    foot.hidden = !f;
    if (s.phase !== 'done') animateTrack(progressOf(s), false);
  }

  function onOpt(i) {
    const s = ui.session, q = cur();
    if (!s || s.phase !== 'ask' || q.kind !== 'mc') return;
    s.pick = i;
    commit(q, i === q.answer ? 'ok' : 'miss');
  }
  function onOrd(i) {
    const s = ui.session;
    if (!s || s.phase !== 'ask') return;
    const k = s.order.indexOf(i);
    if (k >= 0) s.order.splice(k, 1); else s.order.push(i);
    renderSession();
  }
  function onCheck() {
    const s = ui.session, q = cur();
    if (!s || s.phase !== 'ask' || q.kind !== 'order' || s.order.length !== q.items.length) return;
    const ok = s.order.every((itemIdx, slot) => q.items[itemIdx].pos === slot);
    commit(q, ok ? 'ok' : 'miss');
  }

  function addXP(xp, now) {
    if (!xp) return;
    const k = E.dayKey(now), before = S.days[k] || 0;
    S.days[k] = before + xp;
    S.xp += xp;
    if (before < S.settings.goal && S.days[k] >= S.settings.goal && S.lastGoal !== k) {
      S.lastGoal = k;
      S.stats.goalDays++;
      if (ui.session) ui.session.goalHit = true;
    }
  }

  function commit(q, result) {
    const s = ui.session, now = Date.now();
    let promote = q.promote;
    if (promote === null || promote === undefined) { const r = S.ex[q.exId]; promote = !r || r.b === 0 || r.d <= now; }
    if (q.retry) promote = false;
    const ch = E.grade(S, q.exId, result, { promote, now });
    if (ch.before !== ch.after) { const p = s.changes[q.exId]; s.changes[q.exId] = { from: p ? p.from : ch.before, to: ch.after }; }
    const ok = result === 'ok';
    let xp = 0;
    if (ok) {
      s.combo++;
      s.best = Math.max(s.best, s.combo);
      xp = (q.retry ? Math.ceil(q.xp / 2) : q.xp) + (s.combo >= 2 ? Math.min(10, (s.combo - 1) * 2) : 0);
    } else if (result === 'partial') xp = Math.ceil(q.xp / 2);
    else s.combo = 0;
    s.xp += xp;
    addXP(xp, now);
    const st = S.stats;
    st.answered++;
    if (ok) st.correct++;
    const bt = st.byType[q.type] || (st.byType[q.type] = [0, 0]);
    bt[0]++;
    if (ok) bt[1]++;
    st.bestCombo = Math.max(st.bestCombo, s.best);
    const e = E.BY_ID.get(q.exId);
    const correctText = q.kind === 'mc' ? q.options[q.answer] : q.kind === 'order' ? q.items.slice().sort((a, b) => a.pos - b.pos).map(x => x.t).join(' → ') : '';
    s.results.push({ exId: q.exId, label: q.label, result, xp, name: e.name, correct: correctText });
    let queued = false;
    if (result === 'miss' && LEARNING_MODES.includes(s.mode) && !q.retry && s.retries < 3) {
      const r = E.makeQuestion(e, Math.max(1, E.box(S, e.id)), { avoid: new Set([q.type]), exclude: NO_RECALL });
      if (r) { r.retry = true; r.promote = false; s.items.push(r); s.retries++; queued = true; }
    }
    if (s.mode === 'challenge' && result === 'miss') s.lives--;
    let title, msg = '';
    if (ok) {
      title = 'Correct';
      if (ch.after > ch.before && ch.before > 0) msg = `${e.name} is now ${E.STAGES[ch.after]}.`;
      else if (s.combo >= 3) msg = `${s.combo} in a row.`;
    } else if (result === 'partial') { title = 'Half credit'; msg = 'You will see it again soon.'; }
    else {
      title = q.kind === 'recall' ? 'Noted' : 'Not quite';
      msg = q.kind === 'order' ? 'The correct order is below.' : q.kind === 'recall' ? 'You will see it again soon.' : 'The right answer is marked.';
      if (queued) msg += ' It comes back before the end.';
      if (s.mode === 'challenge') msg = s.lives > 0 ? `${s.lives} ${s.lives === 1 ? 'life' : 'lives'} left.` : 'That was your last life.';
    }
    s.phase = 'feedback';
    s.fb = { result, xp, title, msg };
    save();
    if (s.mode === 'exam') {
      Sound.tick();
      renderSession();
      setTimeout(() => { if (ui.session === s && s.phase === 'feedback') next(); }, 420);
      return;
    }
    if (ok) Sound.good(); else if (result === 'miss') Sound.bad();
    renderSession();
    if (xp) floatXP(xp);
  }

  function next() {
    const s = ui.session;
    if (!s) return;
    if (s.phase === 'ask' && cur().kind !== 'learn') return;
    if (s.mode === 'challenge') {
      if (s.lives <= 0) return finish();
      if (s.i + 1 >= s.items.length) {
        const last = cur();
        const q = E.materialize([E.challengeSpec(S, s.results.length, last.exId)], { exclude: NO_RECALL, prev: last.type })[0];
        if (q) s.items.push(q);
      }
    }
    s.i++;
    s.phase = 'ask'; s.pick = null; s.order = []; s.revealed = false; s.fb = null;
    if (s.i >= s.items.length) return finish();
    renderSession();
    $('#ov-body').scrollTop = 0;
  }

  function finish() {
    const s = ui.session, now = Date.now();
    s.phase = 'done';
    const qs = s.results, okN = qs.filter(r => r.result === 'ok').length;
    if (LEARNING_MODES.includes(s.mode)) {
      S.stats.sessions++;
      if (qs.length >= 5 && qs.every(r => r.result === 'ok')) { S.stats.perfect++; s.perfect = true; }
      s.bonus = s.mode === 'daily' ? 10 : 5;
      s.xp += s.bonus;
      addXP(s.bonus, now);
    }
    if (s.mode === 'challenge') { s.score = okN; s.newBest = okN > S.stats.challengeBest; S.stats.challengeBest = Math.max(S.stats.challengeBest, okN); }
    if (s.mode === 'exam') { s.score = Math.round(100 * okN / Math.max(1, qs.length)); S.stats.examBest = Math.max(S.stats.examBest, s.score); if (s.score >= 80) S.stats.examPasses++; }
    s.badges = E.awardBadges(S, { streak: E.streak(S, now), now }).map(b => b.id);
    const lv = E.level(S.xp);
    s.levelUp = lv.n > s.startLevel ? { n: lv.n } : null;
    save();
    if (s.levelUp || s.badges.length) Sound.fanfare(); else if (okN) Sound.good();
    renderSession();
    $('#ov-body').scrollTop = 0;
    animateTrack(0, true);
  }

  function summaryHTML() {
    const s = ui.session, qs = s.results, okN = qs.filter(r => r.result === 'ok').length;
    const acc = qs.length ? Math.round(100 * okN / qs.length) : 0;
    let title, line;
    if (s.mode === 'challenge') { title = `Score ${s.score}`; line = s.newBest && s.score ? 'A new best.' : `Your best is ${S.stats.challengeBest}.`; }
    else if (s.mode === 'exam') { title = `${s.score}%`; line = s.score >= 80 ? 'Pass. 80% or more is a pass.' : 'Under 80%, so not a pass yet. Every miss is listed below with its answer.'; }
    else { title = s.perfect ? 'Perfect' : 'Session done'; line = s.perfect ? 'Every answer right.' : `${okN} of ${qs.length} right${s.bonus ? `, plus ${s.bonus} points for finishing` : ''}.`; }
    const pts = S.days[today()] || 0, goal = S.settings.goal;
    const ups = Object.entries(s.changes).filter(([, c]) => c.to > c.from);
    const badges = E.BADGES.filter(b => s.badges.includes(b.id));
    const examList = s.mode === 'exam' ? `<section class="sec"><div class="sec-head"><h2>Your answers</h2></div><div class="list">${qs.map(r => `<div class="row"><span class="mark ${r.result === 'ok' ? 'ok' : 'no'}">${icon(r.result === 'ok' ? 'check' : 'close')}</span><div class="row-main"><div class="row-title">${esc(r.name)}</div><div class="row-sub">${esc(r.label)}${r.result === 'ok' ? '' : ' · Answer: ' + esc(r.correct)}</div></div></div>`).join('')}</div></section>` : '';
    return `<div class="ov-inner">
      <section class="sum-hero"><div class="label">${esc(s.title)}</div><h2>${esc(title)}</h2><p>${esc(line)}</p>
        <div class="sum-stats"><div><b class="num">+${s.xp}</b><span>points</span></div><div><b class="num">${acc}%</b><span>right</span></div><div><b class="num">${s.best}</b><span>best run</span></div></div>
      </section>
      ${s.levelUp ? `<section class="levelup">${icon('bolt')}<div><div class="label">Level up</div><b>Level ${s.levelUp.n}</b></div></section>` : ''}
      ${s.goalHit ? `<section class="levelup">${icon('check')}<div><div class="label">Daily goal</div><b>Done for today</b></div></section>` : ''}
      ${badges.length ? `<section class="sec"><div class="sec-head"><h2>New badge${badges.length > 1 ? 's' : ''}</h2></div><div class="badges">${badges.map(b => badgeHTML(b, true)).join('')}</div></section>` : ''}
      ${ups.length ? `<section class="sec"><div class="sec-head"><h2>Moved up</h2></div><div class="list">${ups.map(([id, c]) => { const e = E.BY_ID.get(+id); return `<button class="row" data-act="card" data-id="${e.id}"><div class="row-main"><div class="row-title">${esc(e.name)}</div><div class="row-sub">${E.STAGES[c.from]} → ${E.STAGES[c.to]}</div></div>${pips(c.to)}</button>`; }).join('')}</div></section>` : ''}
      ${examList}
      ${!s.goalHit && pts < goal ? `<p class="hint">${goal - pts} more points today reaches your daily goal.</p>` : ''}
    </div>`;
  }
  function summaryFoot() {
    const s = ui.session;
    const again = s.mode === 'challenge' ? `<button class="btn ghost" data-act="start-challenge">Play again</button>` : s.mode === 'daily' ? `<button class="btn ghost" data-act="start-daily">Another</button>` : '';
    return again ? `<div class="btn-row">${again}<button class="btn" data-act="done">Done</button></div>` : `<button class="btn" data-act="done">Done</button>`;
  }

  // ---------------- carriage track ----------------
  let trackP = 0, trackRAF = 0;
  function trackSVG() {
    return `<svg viewBox="0 0 240 30" preserveAspectRatio="xMinYMid meet" aria-hidden="true">
      <line class="rail" x1="10" y1="26" x2="236" y2="26"/><rect class="post" x="3" y="3" width="5" height="25" rx="2"/>
      <path class="spring" id="tr-spring" d=""/><rect class="carriage" id="tr-car" x="20" y="8" width="34" height="13" rx="4"/></svg>`;
  }
  function drawTrack(p) {
    const minX = 20, maxX = 240 - 34 - 4, cx = minX + Math.max(-0.08, p) * (maxX - minX);
    const x1 = 8, y = 14.5, coils = 12, amp = 5.5, len = cx - x1;
    let d = `M${x1},${y}`;
    for (let i = 1; i <= coils * 2; i++) d += ` L${(x1 + len * i / (coils * 2 + 1)).toFixed(1)},${(y + (i % 2 ? -amp : amp)).toFixed(1)}`;
    d += ` L${cx.toFixed(1)},${y}`;
    const sp = document.getElementById('tr-spring'), car = document.getElementById('tr-car');
    if (sp) sp.setAttribute('d', d);
    if (car) car.setAttribute('x', cx.toFixed(1));
  }
  function animateTrack(to, home) {
    cancelAnimationFrame(trackRAF);
    const from = trackP;
    trackP = to;
    if (reduced() || Math.abs(to - from) < 0.001) { drawTrack(to); return; }
    const t0 = performance.now(), dur = home ? 1100 : 450;
    const easeBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
    const easeSpring = t => 1 - Math.exp(-5.5 * t) * Math.cos(11 * t);
    const ease = home ? easeSpring : easeBack;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      drawTrack(from + (to - from) * ease(t));
      if (t < 1) trackRAF = requestAnimationFrame(step); else drawTrack(to);
    };
    trackRAF = requestAnimationFrame(step);
  }
  function progressOf(s) {
    if (s.mode === 'challenge') { const sc = s.results.filter(r => r.result === 'ok').length; return Math.min(1, sc / Math.max(10, S.stats.challengeBest)); }
    const total = s.items.filter(x => x.kind !== 'learn').length;
    return total ? s.results.length / total : 0;
  }

  // ---------------- sheets, toast, effects ----------------
  function openSheet(kind, id) {
    ui.sheet = kind;
    let head, body;
    if (kind === 'card') {
      const e = E.BY_ID.get(id);
      head = 'Exercise card';
      body = `<article class="ex-card">${onePager(e, false)}</article>`;
    } else {
      const exam = kind === 'exam';
      head = exam ? 'Exam' : 'Drill';
      const rows = (exam ? [['all', 'Everything', `All ${E.FULL.length} exercises with instructions`]] : [])
        .concat(E.FULL_APPS.map(a => { const l = E.FULL_BY_APP.get(a), m = mastery(l); return [a, a, `${l.length} exercise${l.length === 1 ? '' : 's'} · ${m.solid} solid`]; }));
      body = `<p class="hint">${exam ? 'Twenty questions. No answers are shown until the end. 80% or more is a pass.' : 'About ten questions from one apparatus. Exercises you find hardest come first, with a few new ones mixed in.'}</p>
        <div class="list">${rows.map(([v, t, sub]) => `<button class="row" data-act="sheet-pick" data-v="${esc(v)}"><div class="row-main"><div class="row-title">${esc(t)}</div><div class="row-sub">${esc(sub)}</div></div>${icon('chev', 'chev')}</button>`).join('')}</div>`;
    }
    $('#sheet').innerHTML = `<div class="scrim" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(head)}">
      <div class="sheet-head"><h2>${esc(head)}</h2><button class="icon-btn sheet-x" data-act="sheet-close" aria-label="Close">${icon('close')}</button></div>${body}</div></div>`;
    const x = document.querySelector('.sheet-x');
    if (x) x.focus({ preventScroll: true });
  }
  function closeSheet() { ui.sheet = null; $('#sheet').innerHTML = ''; }
  let toastTimer = 0;
  function toast(msg, ms) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms || 2600);
  }
  function floatXP(xp) {
    if (reduced()) return;
    const el = document.createElement('div');
    el.className = 'xpfloat num';
    el.textContent = '+' + xp;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  // ---------------- navigation ----------------
  function setTab(t) {
    if (t === 'manual' && ui.tab === 'manual') ui.manual = { view: 'apps', app: null, id: null, from: null };
    ui.tab = t;
    renderAll();
    window.scrollTo(0, 0);
  }
  function openExercise(id, from) {
    ui.prevScroll = window.scrollY;
    const e = E.BY_ID.get(id);
    ui.manual = { view: 'ex', id, app: from === 'app' ? e.apparatus : null, from };
    ui.tab = 'manual';
    renderAll();
    window.scrollTo(0, 0);
  }
  function manualBack() {
    const L = ui.manual;
    if (L.view === 'ex' && (L.from === 'today' || L.from === 'progress')) {
      ui.tab = L.from;
      ui.manual = { view: 'apps', app: null, id: null, from: null };
    } else if (L.view === 'ex' && L.from === 'app') {
      ui.manual = { view: 'app', app: L.app, id: null, from: null };
    } else {
      ui.manual = { view: 'apps', app: null, id: null, from: null };
    }
    renderAll();
    window.scrollTo(0, ui.prevScroll || 0);
  }

  // ---------------- backup / reset ----------------
  function encode(obj) { return 'PH2.' + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
  function decode(code) {
    const m = String(code).trim().replace(/\s+/g, '');
    if (!/^PH[12]\./.test(m)) throw new Error('That does not look like a Powerhouse backup code.');
    return JSON.parse(decodeURIComponent(escape(atob(m.slice(4)))));
  }
  function doBackup() {
    const code = encode(S), box = $('#restore'), msg = $('#restore-msg');
    const fallback = () => { if (box) { box.value = code; box.focus(); box.select(); } if (msg) msg.textContent = 'Copy the code from the box above and keep it somewhere safe.'; };
    try {
      navigator.clipboard.writeText(code).then(() => { if (msg) msg.textContent = 'Backup code copied. Paste it somewhere safe, like a note to yourself.'; }, fallback);
    } catch (e) { fallback(); }
  }
  function doRestore() {
    const box = $('#restore'), msg = $('#restore-msg');
    try {
      const x = decode(box ? box.value : '');
      if (!x || typeof x.ex !== 'object' || typeof x.xp !== 'number') throw new Error('That code is incomplete.');
      S = migrate(x);
      save();
      renderAll();
      toast('Progress restored.');
    } catch (e) { if (msg) msg.textContent = (e && e.message && !/atob|JSON|URI/i.test(e.message)) ? e.message : 'That code could not be read. Check it was copied in full.'; }
  }
  function doReset() {
    if (ui.resetArm > Date.now()) {
      const keep = { name: S.name, settings: S.settings };
      S = Object.assign(freshState(), keep);
      ui.resetArm = 0;
      save();
      renderAll();
      toast('All progress erased.');
      return;
    }
    ui.resetArm = Date.now() + 5000;
    renderView();
    setTimeout(() => { if (ui.resetArm && ui.resetArm <= Date.now() && ui.tab === 'progress' && !ui.session) { ui.resetArm = 0; renderView(); } }, 5100);
  }

  // ---------------- events ----------------
  const ACT = {
    tab: el => setTab(el.dataset.tab),
    'start-daily': () => { closeSheet(); startSession('daily'); },
    'start-challenge': () => { closeSheet(); startSession('challenge'); },
    sheet: el => openSheet(el.dataset.sheet),
    'sheet-close': () => closeSheet(),
    'sheet-pick': el => { const k = ui.sheet; closeSheet(); if (k === 'exam') startSession('exam', { scope: el.dataset.v }); else startSession('drill', { app: el.dataset.v }); },
    'manual-app': el => { ui.prevScroll = window.scrollY; ui.manual = { view: 'app', app: el.dataset.app, id: null, from: null }; renderView(); window.scrollTo(0, 0); },
    'open-ex': el => openExercise(+el.dataset.id, el.dataset.from),
    'manual-back': () => manualBack(),
    'drill-app': el => startSession('drill', { app: el.dataset.app }),
    'drill-ex': el => startSession('exercise', { id: +el.dataset.id }),
    card: el => openSheet('card', +el.dataset.id),
    close: () => closeOverlay(),
    done: () => closeOverlay(),
    opt: el => onOpt(+el.dataset.i),
    ord: el => onOrd(+el.dataset.i),
    'ord-clear': () => { ui.session.order = []; renderSession(); },
    check: () => onCheck(),
    reveal: () => { ui.session.revealed = true; renderSession(); },
    self: el => { if (ui.session && ui.session.phase === 'ask' && ui.session.revealed) commit(cur(), el.dataset.g); },
    next: () => next(),
    goal: el => { S.settings.goal = +el.dataset.v; save(); renderAll(); },
    newper: el => { S.settings.newPer = +el.dataset.v; save(); renderView(); },
    sound: el => { S.settings.sound = el.dataset.v === '1'; save(); renderView(); if (S.settings.sound) { Sound.unlock(); Sound.good(); } },
    backup: () => doBackup(),
    restore: () => doRestore(),
    reset: () => doReset(),
    'hide-tip': () => { S.installTipHidden = true; save(); renderView(); },
    reload: () => location.reload(),
  };
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'sheet-close' && el.classList.contains('scrim') && ev.target !== el) return;
    if (act.startsWith('start-') && ui.session) { ui.session = null; }
    const fn = ACT[act];
    if (fn) fn(el, ev);
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'focus') { S.settings.focus = t.value; save(); renderView(); }
    else if (t.id === 'name') { S.name = t.value.trim().slice(0, 24); save(); }
  });
  document.addEventListener('input', ev => {
    if (ev.target.id === 'q') {
      ui.q = ev.target.value;
      const box = document.getElementById('manual-list');
      if (box) box.innerHTML = ui.q.trim() ? searchResults(ui.q) : appList();
    }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && ui.sheet) { closeSheet(); return; }
    const s = ui.session;
    if (!s || ui.sheet || s.phase !== 'ask') return;
    const t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (cur().kind === 'mc' && /^[1-4]$/.test(ev.key)) onOpt(+ev.key - 1);
  });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true, passive: true });
  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').slice(1);
    if (['today', 'manual', 'progress'].includes(h) && !ui.session) { ui.tab = h; if (h === 'manual') ui.manual = { view: 'apps', app: null, id: null, from: null }; renderAll(); }
  });

  // ---------------- service worker (standalone site only) ----------------
  function registerSW() {
    if (!window.POWERHOUSE_SITE || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    let refreshing = false;
    const hadController = !!navigator.serviceWorker.controller;   // first install is not an update
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing || !hadController) return;
      refreshing = true;
      if (ui.session && ui.session.phase !== 'done') { toast('Update ready. It installs the next time you open the app.', 4000); return; }
      toast('Updating…', 1500);
      setTimeout(() => location.reload(), 600);
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage({ type: 'SKIP_WAITING' });
        });
      });
      if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }).catch(() => { /* offline support unavailable */ });
  }

  // ---------------- boot ----------------
  function start(data) {
    data = data || {};
    if (data.tab) ui.tab = data.tab;
    if (data.manual) ui.manual = data.manual;
    if (typeof data.q === 'string') ui.q = data.q;
    renderAll();
    if (data.session && data.session.items && data.session.items.length) {
      ui.session = data.session;
      openOverlay();
      trackP = progressOf(ui.session);
      drawTrack(trackP);
      renderSession();
    }
    Sync.init();
    registerSW();
  }
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab, manual: ui.manual, q: ui.q, session: ui.session })); } catch (e) { /* no live reload here */ }
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});

  // Test hook: lets automated tests start a session limited to given question types and read state.
  window.__PP = { start: (mode, opt) => startSession(mode, opt), state: () => S, ui: () => ui, engine: E, resetState: () => { S = freshState(); save(); renderAll(); } };
})();

</script>
</body>
</html>
