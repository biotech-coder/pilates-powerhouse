<title>Pilates Powerhouse</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
:root {
  /* Layout: one phone-width column (max 30rem) on a cool studio-grey ground; fixed tab bar at the bottom;
     a study session takes over the whole screen. Dark upholstery panels carry the daily goal and results.
     Type: condensed athletic display for names and numbers; a hyperlegible face for everything you read. */
  --bg: #ECEEF2;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --ink: #131722;
  --muted: #596172;
  --line: #D6DAE2;
  --leather: #171A22;
  --leather-2: #2A2F3B;
  --leather-ink: #F2F3F6;
  --leather-muted: #A9AFBC;
  --accent: #2B4FE3;
  --accent-press: #2240BF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4E9FF;
  --gold: #D99A16;
  --good: #127A50;
  --good-soft: #DDF2E7;
  --bad: #B8263F;
  --bad-soft: #FAE2E7;
  --m1: #99B2F5; --m2: #7192F4; --m3: #4E71EC; --m4: #3250D8; --m5: #2237AF;
  --scrim: rgb(10 12 18 / .5);
  --shadow: 0 1px 2px rgb(19 23 34 / .06), 0 8px 24px rgb(19 23 34 / .08);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1016; --surface: #161A23; --surface-2: #1C212C; --ink: #E7EAF0; --muted: #99A2B4; --line: #2A303D;
    --leather: #1F2431; --leather-2: #333A4A; --leather-ink: #F2F3F6; --leather-muted: #A9AFBC;
    --accent: #7D96FF; --accent-press: #98ACFF; --accent-ink: #0A0F22; --accent-soft: #1E2650;
    --gold: #F2BE48; --good: #45CF91; --good-soft: #10291E; --bad: #FF7389; --bad-soft: #3A1620;
    --m1: #31478E; --m2: #405EC9; --m3: #567BF7; --m4: #7A9EFF; --m5: #AEC9FF;
    --scrim: rgb(0 0 0 / .6);
    --shadow: 0 1px 2px rgb(0 0 0 / .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #161A23; --surface-2: #1C212C; --ink: #E7EAF0; --muted: #99A2B4; --line: #2A303D;
  --leather: #1F2431; --leather-2: #333A4A; --leather-ink: #F2F3F6; --leather-muted: #A9AFBC;
  --accent: #7D96FF; --accent-press: #98ACFF; --accent-ink: #0A0F22; --accent-soft: #1E2650;
  --gold: #F2BE48; --good: #45CF91; --good-soft: #10291E; --bad: #FF7389; --bad-soft: #3A1620;
  --m1: #31478E; --m2: #405EC9; --m3: #567BF7; --m4: #7A9EFF; --m5: #AEC9FF;
  --scrim: rgb(0 0 0 / .6);
  --shadow: 0 1px 2px rgb(0 0 0 / .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; text-size-adjust: 100%; -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
html.locked, html.locked body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: inherit; }
p { margin: 0; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 800; line-height: .95; letter-spacing: .01em; }
.label {
  font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 1.2;
  letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 30rem; margin: 0 auto; padding-inline: 16px; padding-block: 6px calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 8px; padding-block: 10px 16px; }
.wordmark { min-width: 0; margin-right: auto; font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1; letter-spacing: .07em; text-transform: uppercase; }
.wordmark small { display: block; margin-top: 4px; font-weight: 700; font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.chip {
  white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding-inline: 10px 12px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .02em;
}
.chip svg { width: 17px; height: 17px; }
.chip .ico-flame { color: var(--gold); }
.chip .ico-bolt { color: var(--accent); }

/* ---------- today ---------- */
.greet { font-size: 40px; margin-bottom: 14px; }
.tip { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 12px 8px 12px 14px; background: var(--accent-soft); border-radius: var(--radius); }
.tip-t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
.tip-t b { font-weight: 700; }
.tip-t > b { display: block; font-family: var(--font-display); font-size: 17px; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 2px; }
.tip-t svg { width: 15px; height: 15px; vertical-align: -2px; }
.tip .icon-btn { width: 36px; height: 36px; margin-top: -4px; }
.panel { background: var(--leather); color: var(--leather-ink); border-radius: 20px; padding: 18px; display: grid; gap: 18px; }
.panel .label { color: var(--leather-muted); }
.goal { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { width: 112px; height: 112px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .r-track { stroke: var(--leather-2); }
.ring .r-fill { stroke: var(--accent); transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }
.ring.done .r-fill { stroke: var(--gold); }
.ring-num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-num b { font-family: var(--font-display); font-weight: 900; font-size: 42px; line-height: .85; }
.ring-num span { font-size: 12px; color: var(--leather-muted); }
.goal-txt { display: grid; gap: 8px; min-width: 0; }
.goal-line { font-size: 15px; color: var(--leather-muted); }
.goal-line b { color: var(--leather-ink); font-weight: 700; }
.week { display: flex; gap: 7px; flex-wrap: wrap; }
.wd { display: grid; justify-items: center; gap: 4px; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--leather-muted); }
.wd i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--leather-2); display: grid; place-items: center; color: var(--leather); }
.wd i svg { width: 12px; height: 12px; stroke-width: 3.2; }
.wd.on i { background: var(--accent); border-color: var(--accent); }
.wd.goal i { background: var(--gold); border-color: var(--gold); }
.wd.today i { box-shadow: 0 0 0 2px var(--leather), 0 0 0 4px var(--leather-muted); }
.wd.today span { color: var(--leather-ink); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px;
  padding: 12px 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; letter-spacing: .05em;
  text-transform: uppercase; text-align: center; transition: transform .12s ease, background-color .12s ease;
}
.btn:active { transform: scale(.98); background: var(--accent-press); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 22px; height: 22px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:active { background: var(--surface-2); }
.btn.small { min-height: 48px; font-size: 18px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.start { justify-content: space-between; text-align: left; min-height: 64px; padding-inline: 20px 18px; }
.btn.start small { display: block; margin-top: 3px; font-family: var(--font-body); font-weight: 400; font-size: 13.5px; letter-spacing: 0; text-transform: none; opacity: .9; }
.btn.start svg { width: 26px; height: 26px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.mode {
  display: grid; align-content: start; gap: 6px; padding: 14px 12px; min-height: 124px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  transition: transform .12s ease;
}
.mode:active { transform: scale(.98); }
.mode svg { width: 28px; height: 28px; color: var(--accent); }
.mode b { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }
.mode span { font-size: 12.5px; line-height: 1.35; color: var(--muted); }

.sec { display: grid; gap: 10px; margin-top: 26px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .03em; text-transform: uppercase; }
.hint { font-size: 14px; color: var(--muted); }
.hint.version { font-size: 12.5px; }
.empty { font-size: 15px; color: var(--muted); padding: 14px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.focus { display: flex; align-items: center; gap: 8px; }
.focus select { min-height: 40px; padding: 6px 30px 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; max-width: 12rem; }

/* ---------- lists ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px 14px; border-top: 1px solid var(--line); text-align: left; }
.row:first-child { border-top: 0; }
button.row:active { background: var(--surface-2); }
.row.ref .row-title { color: var(--muted); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: 13.5px; color: var(--muted); line-height: 1.35; margin-top: 1px; overflow-wrap: anywhere; }
.row .chev { width: 18px; height: 18px; color: var(--muted); }
.pill { flex: none; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

.pips { display: inline-flex; align-items: center; gap: 3px; flex: none; }
.pips i { width: 6px; height: 15px; border-radius: 2px; background: var(--line); }
.pips i.f { background: var(--accent); }
.pips.gold i.f { background: var(--gold); }
.pips em { font-style: normal; margin-left: 6px; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- manual ---------- */
.page-title { font-size: 44px; }
.lede { color: var(--muted); margin-top: 6px; margin-bottom: 14px; max-width: 60ch; }
.search { display: flex; align-items: center; gap: 10px; min-height: 50px; padding-inline: 14px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); }
.search svg { width: 20px; height: 20px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding-block: 12px; outline: none; -webkit-appearance: none; appearance: none; }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 10px; margin-block: 6px 8px; font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.back svg { width: 20px; height: 20px; }
.app-head { display: grid; gap: 6px; margin-bottom: 16px; }
.sticky-cta { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; }

.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 20px; }
.ex { display: grid; gap: 16px; }
.ex-eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ex-name { font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: .95; letter-spacing: .01em; margin-top: -6px; overflow-wrap: anywhere; }
.ex-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: -8px; }
.ex-reps { font-size: 16px; font-weight: 700; display: inline-flex; align-items: baseline; gap: 8px; }
.ex-sec { display: grid; gap: 8px; }
.ex-sec h3 { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.ex-sec h3 small { display: block; margin-top: 2px; font-family: var(--font-body); font-weight: 400; font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.ex-sec.teach { padding-top: 14px; border-top: 1px solid var(--line); gap: 12px; }
.teach-block { display: grid; gap: 6px; }
.teach-block h4 { font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lines { display: grid; gap: 7px; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.ln .mk { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.4; color: var(--muted); min-width: 24px; }
.ln.sub { display: block; margin-top: 4px; font-weight: 700; }
.ln.sub:first-child { margin-top: 0; }
.setup { display: grid; gap: 4px; }
.setup p { font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.setup b { font-weight: 700; }
.ref-note { font-size: 15px; color: var(--muted); padding: 12px 14px; background: var(--surface-2); border-radius: 12px; }
details.more { border-top: 1px solid var(--line); padding-top: 12px; }
details.more > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg { width: 18px; height: 18px; transition: transform .2s; }
details.more[open] > summary svg { transform: rotate(90deg); }
details.more > .ex-sec.teach { border-top: 0; padding-top: 4px; }

/* ---------- progress ---------- */
.level { gap: 10px; }
.lv-name { font-size: 64px; }
.xpbar { height: 10px; border-radius: 5px; background: var(--leather-2); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 5px; background: var(--gold); }
.lv-line { font-size: 14px; color: var(--leather-muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 36px; line-height: 1; }
.stat b small { font-size: 20px; color: var(--muted); font-weight: 800; }
.stat span { font-size: 13.5px; color: var(--muted); }
.map { display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.map-row { display: grid; gap: 7px; }
.map-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.map-head b { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
.map-head span { color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 4px; }

e."},{"raw":"(4) Press back out to the high diagonal.","step":true,"m":"(4)","t":"Press back out to the high diagonal."},{"raw":"Full Short Spine","step":false,"m":"","t":"Full Short Spine"},{"raw":"(5) From the high diagonal, bring the straight legs up and overhead, peeling the spine off the carriage as the carriage returns home.","step":true,"m":"(5)","t":"From the high diagonal, bring the straight legs up and overhead, peeling the spine off the carriage as the carriage returns home."},{"raw":"(6) Bend the knees toward the shoulder blocks.","step":true,"m":"(6)","t":"Bend the knees toward the shoulder blocks."},{"raw":"(7) Articulate the spine back onto the carriage, drawing the pelvis away from the heels.","step":true,"m":"(7)","t":"Articulate the spine back onto the carriage, drawing the pelvis away from the heels."},{"raw":"(8) As the tailbone lands, press the legs back out to the high diagonal.","step":true,"m":"(8)","t":"As the tailbone lands, press the legs back out to the high diagonal."}],"modifications":[{"raw":"(1) Practice Frogs in the shortened straps before adding spinal articulation.","step":true,"m":"(1)","t":"Practice Frogs in the shortened straps before adding spinal articulation."},{"raw":"(2) Progress to Pre/Half Short Spine, keeping the tailbone anchored and limiting the range to the available hamstring flexibility.","step":true,"m":"(2)","t":"Progress to Pre/Half Short Spine, keeping the tailbone anchored and limiting the range to the available hamstring flexibility."}],"cueing":[{"raw":"(1) Keep the straps above the shoulder blocks as the legs press out.","step":true,"m":"(1)","t":"Keep the straps above the shoulder blocks as the legs press out."},{"raw":"(2) In Pre/Half Short Spine, allow the hip crease to deepen without lifting the tailbone.","step":true,"m":"(2)","t":"In Pre/Half Short Spine, allow the hip crease to deepen without lifting the tailbone."},{"raw":"(3) In Full Short Spine, press up into the straps and hollow the abdominals as ","t":"During Full Short Spine, the carriage should be completely home before the knees bend."},{"raw":"(5) Another roll-down variation maintains the heel-to-seat connection throughout the articulation.","step":true,"m":"(5)","t":"Another roll-down variation maintains the heel-to-seat connection throughout the articulation."}],"full":true,"id":26,"fam":[]},{"row":97,"apparatus":"Reformer","name":"Coordination","reps":"3-5 reps","setup":"Knees bend into chest; elbows bent on carriage with handles in hand","springs":"2","instructions":[{"raw":"(0) From Short Spine, remove the feet from the straps with control, lengthen the straps, and find Coordination Prep position with knees into the chest and elbows anchored close to the body.","step":true,"m":"(0)","t":"From Short Spine, remove the feet from the straps with control, lengthen the straps, and find Coordination Prep position with knees into the chest and elbows anchored close to the body."},{"raw":"(1) Lift the head, neck, and shoulders, looking into the abdominals.","step":true,"m":"(1)","t":"Lift the head, neck, and shoulders, looking into the abdominals."},{"raw":"(2) Inhale, press the arms down and extend the legs forward.","step":true,"m":"(2)","t":"Inhale, press the arms down and extend the legs forward."},{"raw":"(3) Hold the breath as the legs open and close.","step":true,"m":"(3)","t":"Hold the breath as the legs open and close."},{"raw":"(4) Exhale, draw the knees into the powerhouse first.","step":true,"m":"(4)","t":"Exhale, draw the knees into the powerhouse first."},{"raw":"(5) Continue the exhale as the elbows bend in second, keeping the upper body lifted.","step":true,"m":"(5)","t":"Continue the exhale as the elbows bend in second, keeping the upper body lifted."}],"modifications":[{"raw":"(1) Lower the head between repetitions if needed, then reinforce a strong, high curl each time.","step":true,"m":"(1)","t":"Lower the head between repetitions if needed, then reinforce a strong, high curl each time."},{"raw":"(2) Revert to Coordination Prep before adding the open and close of the legs.","step":true,"m":"(2)","t":"Revert to Coordination Prep before adding the open and close of the legs."}],"cueing":[{"raw":"(1) Keep the elbows close to the body and anchored to the carriage in the starting position.","step":true,"m":"(1)","t":"Keep the elbows close to the body and anchored to the carriage in the starting position."},{"raw":"(2) Keep the wrists long as the arms press down.","step":true,"m":"(2)","t":"Keep the wrists long as the arms press down."},{"raw":"(3) Maintain a high upper-body curl throughout the sequence, looking into the abdominals.","step":true,"m":"(3)","t":"Maintain a high upper-body curl throughout the sequence, looking into the abdominals."},{"raw":"(4) Keep the legs connected to the powerhouse as they open and close.","step":true,"m":"(4)","t":"Keep the legs connected to the powerhouse as they open and close."},{"raw":"(5) Place your hands at the client’s ankle bones and provide light resistance as the legs open and close.","step":true,"m":"(5)","t":"Place your hands at the client’s ankle bones and provide light resistance as the legs open and close."},{"raw":"(6) Emphasize the order of the return: knees come in first, elbows bend second.","step":true,"m":"(6)","t":"Emphasize the order of the return: knees come in first, elbows bend second."}],"notes":[{"raw":"(1) Coordination builds directly from Coordination Prep by adding the open and close of the legs while maintaining the upper-body curl.","step":true,"m":"(1)","t":"Coordination builds directly from Coordination Prep by adding the open and close of the legs while maintaining the upper-body curl."},{"raw":"(2) Cary teaches Coordination as a five-count sequence: extend, open, close, knees in, elbows bend.","step":true,"m":"(2)","t":"Cary teaches Coordination as a five-count sequence: extend, open, close, knees in, elbows bend."}],"full":true,"id":27,"fam":[]},{"row":98,"apparatus":"Reformer","na  straps to create opposition and grow taller through the spine.","step":true,"m":"(2)","t":"Press into the leather straps to create opposition and grow taller through the spine."},{"raw":"(3) Keep the legs long, together, and active.","step":true,"m":"(3)","t":"Keep the legs long, together, and active."},{"raw":"(4) Avoid locking or hyperextending the elbows as the arms straighten.","step":true,"m":"(4)","t":"Avoid locking or hyperextending the elbows as the arms straighten."},{"raw":"(5) Keep the shoulders down as the arms reach forward and overhead.","step":true,"m":"(5)","t":"Keep the shoulders down as the arms reach forward and overhead."},{"raw":"(6) Control the carriage through the resistance of the arms and the lift of the powerhouse.","step":true,"m":"(6)","t":"Control the carriage through the resistance of the arms and the lift of the powerhouse."}],"notes":[{"raw":"(1) Rowing From the Chest is #3 of the six-part Rowing Series.","step":true,"m":"(1)","t":"Rowing From the Chest is #3 of the six-part Rowing Series."},{"raw":"(2) The slight forward position of the torso helps the client maintain lift through the spine rather than resting back into the shoulder blocks.","step":true,"m":"(2)","t":"The slight forward position of the torso helps the client maintain lift through the spine rather than resting back into the shoulder blocks."}],"full":true,"id":28,"fam":["Rowing"]},{"row":99,"apparatus":"Reformer","name":"Rowing From Hips","reps":"3-5 reps","setup":"Client is sitting facing outwards with butt up against the shoulder blocks. Handles in hand at hips","springs":"1","instructions":[{"raw":"(0) From Rowing From the Chest, flex the feet and bring the fists to the carriage beside the hips, maintaining a slight forward lean.","step":true,"m":"(0)","t":"From Rowing From the Chest, flex the feet and bring the fists to the carriage beside the hips, maintaining a slight forward lean."},{"raw":"(1) Bring the chin to the chest and round the spine forward, pressing essing to the straps."}],"cueing":[{"raw":"(1) Press through the leather straps as the hands reach forward and past the heels.","step":true,"m":"(1)","t":"Press through the leather straps as the hands reach forward and past the heels."},{"raw":"(2) Place a touch cue at the client’s hands to encourage them to press farther into the straps.","step":true,"m":"(2)","t":"Place a touch cue at the client’s hands to encourage them to press farther into the straps."},{"raw":"(3) Begin stacking from the base of the spine and find length as you roll up.","step":true,"m":"(3)","t":"Begin stacking from the base of the spine and find length as you roll up."},{"raw":"(4) Allow the shoulders to drop down the back as the spine stacks tall.","step":true,"m":"(4)","t":"Allow the shoulders to drop down the back as the spine stacks tall."},{"raw":"(5) Keep the legs long, together, and active with the feet flexed.","step":true,"m":"(5)","t":"Keep the legs long, together, and active with the feet flexed."},{"raw":"(6) Continue lifting up and away from the shoulder blocks as the arms reach overhead.","step":true,"m":"(6)","t":"Continue lifting up and away from the shoulder blocks as the arms reach overhead."}],"notes":[{"raw":"(1) Rowing From the Hips is #4 of the six-part Rowing Series.","step":true,"m":"(1)","t":"Rowing From the Hips is #4 of the six-part Rowing Series."},{"raw":"(2) The spinal articulation leads the movement; the arms coordinate with the roll rather than pulling the body upright.","step":true,"m":"(2)","t":"The spinal articulation leads the movement; the arms coordinate with the roll rather than pulling the body upright."}],"full":true,"id":29,"fam":["Rowing"]},{"row":102,"apparatus":"Reformer","name":"Long Box Hamstring Curls","reps":"5-10 reps each side","setup":"Client is lying on stomach with chest over springs. Feet in shortened leather straps.","springs":"2both/1single","instructions":[{"raw":"(0) Place the Long Box in front of the shoulder blocks with the footbar down. Sit facing the back with feet on the headrest, shorten and cross the straps, place them on the feet, then turn toward the top strap onto the stomach. Chest is off the box, arms wrap around the front, and legs are hip-width apart.","step":true,"m":"(0)","t":"Place the Long Box in front of the shoulder blocks with the footbar down. Sit facing the back with feet on the headrest, shorten and cross the straps, place them on the feet, then turn toward the top strap onto the stomach. Chest is off the box, arms wrap around the front, and legs are hip-width apart."},{"raw":"Double Leg Hamstring Curls","step":false,"m":"","t":"Double Leg Hamstring Curls"},{"raw":"(1) Press the pelvis into the box and draw both heels toward the seat, moving the carriage.","step":true,"m":"(1)","t":"Press the pelvis into the box and draw both heels toward the seat, moving the carriage."},{"raw":"(2) Resist the legs open with control while keeping the pelvis anchored.","step":true,"m":"(2)","t":"Resist the legs open with control while keeping the pelvis anchored."},{"raw":"Single Leg Hamstring Curls","step":false,"m":"","t":"Single Leg Hamstring Curls"},{"raw":"(3) Adjust the resistance and draw one heel toward the seat while the opposite leg remains long.","step":true,"m":"(3)","t":"Adjust the resistance and draw one heel toward the seat while the opposite leg remains long."},{"raw":"(4) Resist the working leg open, keeping the hips even and planted.","step":true,"m":"(4)","t":"Resist the working leg open, keeping the hips even and planted."},{"raw":"(5) Change sides.","step":true,"m":"(5)","t":"Change sides."}],"modifications":[{"raw":"(1) Revert to Single Leg Kick on the Mat to practice the heel-to-seat hamstring action while maintaining a stable pelvis.","step":true,"m":"(1)","t":"Revert to Single Leg Kick on the Mat to practice the heel-to-seat hamstring action while maintaining a stable pelvis."}],"cueing":[{"raw":"(1) Soften the chest while pressing the pelvis firmly into the box.","step":true,"m":"(1)","t":"Soften the chest while pressing the pelvis firmly into the box."},{"raw":"(2) Keep the breastbone just off the front edge of the box without lifting into back extension.","step":true,"m":"(2)","t":"Keep the breastbone just off the front edge of the box without lifting into back extension."},{"raw":"(3) Place a hand at the back of the client’s neck to cue a long, neutral line through the spine and neck.","step":true,"m":"(3)","t":"Place a hand at the back of the client’s neck to cue a long, neutral line through the spine and neck."},{"raw":"(4) Draw the heel toward the seat from the hamstring rather than lifting the thigh away from the box.","step":true,"m":"(4)","t":"Draw the heel toward the seat from the hamstring rather than lifting the thigh away from the box."},{"raw":"(5) During Single Leg Curls, keep both hip bones evenly connected to the box.","step":true,"m":"(5)","t":"During Single Leg Curls, keep both hip bones evenly connected to the box."},{"raw":"(6) Keep the legs parallel and hip-width apart for a direct line into the hamstrings.","step":true,"m":"(6)","t":"Keep the legs parallel and hip-width apart for a direct line into the hamstrings."}],"notes":[{"raw":"(1) The feet may be softly pointed or flexed. Cary allows either and notes that some clients feel a deeper hamstring connection with the foot flexed.","step":true,"m":"(1)","t":"The feet may be softly pointed or flexed. Cary allows either and notes that some clients feel a deeper hamstring connection with the foot flexed."},{"raw":"(2) Parallel legs create a more direct line of work through the hamstrings; the exercise can also be performed in Pilates stance.","step":true,"m":"(2)","t":"Parallel legs create a more direct line of work through the hamstrings; the exercise can also be performed in Pilates stance."},{"raw":"(3) The Single Leg variation increases the challenge of keeping the pelvis square and stable while isolating one hamstring.","step":true,"m":"(3)","t":"The Single Leg variation increases the challenge of keeping the pelvis square and stable while isolating one hamstring."}],"full":true,"id":30,"fam":[]},{"row":103,"apparatus":"Reformer","name":"Long Box Pull Straps and T","reps":"3-5 each","setup":"Client is laying on stoamch with shoulders lined up with box. Legs long. Hands walk up the leather straps.","springs":"1","instructions":[{"raw":"(0) Lie prone facing the back with the shoulders aligned to the back edge of the box, legs long and together; take the leather straps and walk the hands up until there is slight tension with the carriage home.","step":true,"m":"(0)","t":"Lie prone facing the back with the shoulders aligned to the back edge of the box, legs long and together; take the leather straps and walk the hands up until there is slight tension with the carriage home."},{"raw":"Pulling Straps","step":false,"m":"","t":"Pulling Straps"},{"raw":"(1) Reach the arms outside the frame with the palms facing outward.","step":true,"m":"(1)","t":"Reach the arms outside the frame with the palms facing outward."},{"raw":"(2) Draw the shoulder blades down and reach the straight arms back as the chest lengthens forward and up.","step":true,"m":"(2)","t":"Draw the shoulder blades down and reach the straight arms back as the chest lengthens forward and up."},{"raw":"(3) Resist the arms forward and lower the upper body with length.","step":true,"m":"(3)","t":"Resist the arms forward and lower the upper body with length."},{"raw":"T Press","step":false,"m":"","t":"T Press"},{"raw":"(4) Slide the hands along the straps to find a T position with the wrists aligned with the shoulders.","step":true,"m":"(4)","t":"Slide the hands along the straps to find a T position with the wrists aligned with the shoulders."},{"raw":"(5) From the shoulder blades, press the straight arms toward the hips, rotating the palms toward each other as the chest lifts.","step":true,"m":"(5)","t":"From the shoulder blades, press the straight arms toward t )","t":"Place a small ball between the ankles as an awareness cue to help the client connect the legs and hug the midline."}],"notes":[{"raw":"(1) For clients with greater shoulder mobility, walk the hands farther up the leather straps to create more resistance and connection.","step":true,"m":"(1)","t":"For clients with greater shoulder mobility, walk the hands farther up the leather straps to create more resistance and connection."},{"raw":"(2) The upper-body lift comes from lengthening through the upper spine; avoid creating excessive extension or compression in the lower back.","step":true,"m":"(2)","t":"The upper-body lift comes from lengthening through the upper spine; avoid creating excessive extension or compression in the lower back."},{"raw":"(3) For taller clients, the shoulders may align closer to the shoulder blocks rather than directly with the edge of the box.","step":true,"m":"(3)","t":"For taller clients, the shoulders may align closer to the shoulder blocks rather than directly with the edge of the box."}],"full":true,"id":31,"fam":[]},{"row":104,"apparatus":"Reformer","name":"Long Box Backstroke","reps":"3-5 reps","setup":"Client is lying on back. Knees bent into chest with hands above forehead","springs":"2","instructions":[{"raw":"(0) Lie supine on the Long Box with the shoulders at the back edge and about a hand’s distance behind the tailbone; knees into the chest, head and shoulders lifted, and hands in a diamond above the forehead.","step":true,"m":"(0)","t":"Lie supine on the Long Box with the shoulders at the back edge and about a hand’s distance behind the tailbone; knees into the chest, head and shoulders lifted, and hands in a diamond above the forehead."},{"raw":"(1) Inhale, reach the arms and legs straight up to the ceiling, keeping the carriage still.","step":true,"m":"(1)","t":"Inhale, reach the arms and legs straight up to the ceiling, keeping the carriage still."},{"raw":"(2) Exhale, open the arms and legs to a small V, then circle ls, and arms lift together."},{"raw":"(2) Press into the straps and roll up in one flowing movement to find Teaser.","step":true,"m":"(2)","t":"Press into the straps and roll up in one flowing movement to find Teaser."},{"raw":"(3) Maintain the Teaser position with the spine lifted and legs reaching long.","step":true,"m":"(3)","t":"Maintain the Teaser position with the spine lifted and legs reaching long."},{"raw":"(4) Articulate through the spine with control to lower the body, legs, and arms back to the starting position.","step":true,"m":"(4)","t":"Articulate through the spine with control to lower the body, legs, and arms back to the starting position."}],"modifications":[{"raw":"(1) Revert to Teaser on the Cadillac or Mat before progressing to Long Box Teaser.","step":true,"m":"(1)","t":"Revert to Teaser on the Cadillac or Mat before progressing to Long Box Teaser."}],"cueing":[{"raw":"(1) Think of the head and heels lifting at the same time to initiate the Teaser.","step":true,"m":"(1)","t":"Think of the head and heels lifting at the same time to initiate the Teaser."},{"raw":"(2) Press into the leather straps and use their resistance to assist the roll up.","step":true,"m":"(2)","t":"Press into the leather straps and use their resistance to assist the roll up."},{"raw":"(3) Keep reaching through the legs as the powerhouse draws in and up.","step":true,"m":"(3)","t":"Keep reaching through the legs as the powerhouse draws in and up."},{"raw":"(4) Lift through the chest at the top rather than collapsing into the lower back.","step":true,"m":"(4)","t":"Lift through the chest at the top rather than collapsing into the lower back."},{"raw":"(5) On the return, articulate through the spine rather than dropping back onto the box.","step":true,"m":"(5)","t":"On the return, articulate through the spine rather than dropping back onto the box."},{"raw":"(6) Maintain opposition between the reaching legs and the abdominals pulling back and up.","step":true,"m":"(6)","t":"Maintain opposition between the reaching legs and the abdominals pulling back and up."}],"notes":[{"raw":"(1) Long Box Teaser is more challenging than Cadillac Teaser because the head and feet begin below the plane of the body, placing the limbs farther from the center and increasing the demand on the powerhouse.","step":true,"m":"(1)","t":"Long Box Teaser is more challenging than Cadillac Teaser because the head and feet begin below the plane of the body, placing the limbs farther from the center and increasing the demand on the powerhouse."},{"raw":"(2) Coordinating the head and heels to lift simultaneously is an important part of finding the Teaser efficiently.","step":true,"m":"(2)","t":"Coordinating the head and heels to lift simultaneously is an important part of finding the Teaser efficiently."},{"raw":"(3) Arm pumps may be added while holding the Teaser position as a variation.","step":true,"m":"(3)","t":"Arm pumps may be added while holding the Teaser position as a variation."}],"full":true,"id":33,"fam":["Teaser"]},{"row":106,"apparatus":"Reformer","name":"Short Box Twist and Reach","reps":"3-5 each direction","setup":"Box is short ways (horizontal) on the reformer between the shoulder blocks and the pegs to secure the box from moving; both feet are under strap; silver pole is stored under the legs on the cadillac.","springs":"2","instructions":[{"raw":"(0) Find the established Short Box position with the pole overhead and feet firmly flexed underneath the strap.","step":true,"m":"(0)","t":"Find the established Short Box position with the pole overhead and feet firmly flexed underneath the strap."},{"raw":"(1) Lift up out of the waist and twist to one side, keeping the hips square.","step":true,"m":"(1)","t":"Lift up out of the waist and twist to one side, keeping the hips square."},{"raw":"(2) Maintain the twist and hinge back from the hips to a long diagonal.","step":true,"m":"(2)","t":"Maintain the twist and hinge back from the hips to a long diagonal."},{"raw":"(3) Keeping both sides of the waist long, deepen the spiral as you return over the sit bones.","step":true,"m":"(3)","t":"Keeping both sides of the waist long, deepen the spiral as you return over the sit bones."},{"raw":"(4) Return tall to center, then repeat to the other side.","step":true,"m":"(4)","t":"Return tall to center, then repeat to the other side."}],"modifications":[{"raw":"(1) Revert to Short Box Twist Without Lean, maintaining the rotation without adding the diagonal reach.","step":true,"m":"(1)","t":"Revert to Short Box Twist Without Lean, maintaining the rotation without adding the diagonal reach."}],"cueing":[{"raw":"(1) Lift before you twist, then maintain that length as you reach back.","step":true,"m":"(1)","t":"Lift before you twist, then maintain that length as you reach back."},{"raw":"(2) Keep both sides of the waist long throughout the diagonal—avoid shortening into the side of the twist.","step":true,"m":"(2)","t":"Keep both sides of the waist long throughout the diagonal—avoid shortening into the side of the twist."},{"raw":"(3) Press the ankles outward into the strap to root the legs and create a stable base for the rotation.","step":true,"m":"(3)","t":"Press the ankles outward into the strap to root the legs and create a stable base for the rotation."},{"raw":"(4) Keep the hips square and both sit bones connected to the box.","step":true,"m":"(4)","t":"Keep the hips square and both sit bones connected to the box."},{"raw":"(5) Soften the ribcage inward rather than holding tension through the ribs.","step":true,"m":"(5)","t":"Soften the ribcage inward rather than holding tension through the ribs."},{"raw":"(6) From behind the client, hold at the shoulders and elbows to guide the twist and diagonal reach; reduce the assistance as the client understands the pathway.","step":true,"m":"(6)","t":"From behind the client, hold at the shoulders and elbows to guide the twist and diagonal reach; reduce the assistance as the client understands the pathway."}],"notes":[{"raw":"(1) Twist and Reach progresses the Beginner Short Box Twist by maintaining the rotation while adding a hinge away from the center.","step":true,"m":"(1)","t":"Twist and Reach progresses the Beginner Short Box Twist by maintaining the rotation while adding a hinge away from the center."},{"raw":"(2) Cary notes that standing in the well is not traditional Classical teaching practice, but she may use this position when initially teaching the exercise because it allows efficient hands-on guidance. As the client gains control, the instructor can step away.","step":true,"m":"(2)","t":"Cary notes that standing in the well is not traditional Classical teaching practice, but she may use this position when initially teaching the exercise because it allows efficient hands-on guidance. As the client gains control, the instructor can step away."},{"raw":"(3) Think of the legs as the “roots of the tree”: the outward pressure into the foot strap provides the stable base from which the spine can lift and rotate.","step":true,"m":"(3)","t":"Think of the legs as the “roots of the tree”: the outward pressure into the foot strap provides the stable base from which the spine can lift and rotate."}],"full":true,"id":34,"fam":["Short Box"]},{"row":107,"apparatus":"Reformer","name":"Short Box Full Tree","reps":"3 reps","setup":"Box is short ways (horizontal) on the reformer between the shoulder blocks and the pegs to secure the box from moving; one foot under the strap","springs":"2","instructions":[{"raw":"(0) Find Half Tree position with one leg extended, hands at the ankle, and the opposite foot firmly flexed underneath the strap.","step":true,"m":"(0)","t":"Find Half Tree position with one leg extended, hands at the ankle, and the opposite foot firmly flexed underneath the strap."},{"raw":"(1) Draw the working leg toward you, bow the head toward the leg, and begin rolling back with square hips.","step":true,"m":"(1)","t":"Draw the working leg toward you, bow the head toward the leg, and begin rolling back with square hips."},{"raw":"(2) Continue walking the hands down the leg as the spine articulates fully into the well.","step":true,"m":"(2)","t":"Continue walking the hands down the leg as the spine articulates fully into the well."},{"raw":"(3) At the bottom, allow the head, neck, and chest to extend into the well for a full stretch.","step":true,"m":"(3)","t":"At the bottom, allow the head, neck, and chest to extend into the well for a full stretch."},{"raw":"(4) Bring the chin to the chest, scoop the lower abdominals, and walk the hands back up the leg.","step":true,"m":"(4)","t":"Bring the chin to the chest, scoop the lower abdominals, and walk the hands back up the leg."},{"raw":"(5) Return over the sit bones and press the leg forward as the spine grows tall.","step":true,"m":"(5)","t":"Return over the sit bones and press the leg forward as the spine grows tall."},{"raw":"(6) Change sides.","step":true,"m":"(6)","t":"Change sides."}],"modifications":[{"raw":"(1) Revert to Half Tree, limiting the rollback to the sacrum and lower back without extending into the well.","step":true,"m":"(1)","t":"Revert to Half Tree, limiting the rollback to the sacrum and lower back without extending into the well."}],"cueing":[{"raw":"(1) Initiate the rollback and return from the lower abdominals rather than pulling on the working leg.","step":true,"m":"(1)","t":"Initiate the rollback and return from the lower abdominals rather than pulling on the working leg."},{"raw":"(2) Keep the supporting foot firmly flexed into the strap for safety and stability.","step":true,"m":"(2)","t":"Keep the supporting foot firmly flexed into the strap for safety and stability."},{"raw":"(3) Place one hand on the strapped thigh as the client rolls back to reinforce downward energy through the supporting leg and provide security.","step":true,"m":"(3)","t":"Place one hand on the strapped thigh as the client rolls back to reinforce downward energy through the supporting leg and provide security."},{"raw":"(4) Alternatively, support the strapped ankle or heel and gently encourage the foot to remain flexed and active.","step":true,"m":"(4)","t":"Alternatively, support the strapped ankle or heel and gently encourage the foot to remain flexed and active."},{"raw":"(5) Keep the hips and shoulders square throughout the rollback and extension.","step":true,"m":"(5)","t":"Keep the hips and shoulders square throughout the rollback and extension."},{"raw":"(6) If the pelvis or shoulders begin to twist, decrease the range and return to Half Tree until the client can maintain alignment.","step":true,"m":"(6)","t":"If the pelvis or shoulders begin to twist, decrease the range and return to Half Tree until the client can maintain alignment."},{"raw":"(7) On the return, bring the chin to the chest first, then scoop the abdominals and begin walking back up the leg.","step":true,"m":"(7)","t":"On the return, bring the chin to the chest first, then scoop the abdominals and begin walking back up the leg."},{"raw":"(8) At the top, press the working leg forward as the spine lifts taller to create opposition.","step":true,"m":"(8)","t":"At the top, press the working leg forward as the spine lifts taller to create opposition."}],"notes":[{"raw":"(1) Full Tree progresses Half Tree by continuing the spinal articulation into the well and adding extension of the head, neck, and chest.","step":true,"m":"(1)","t":"Full Tree progresses Half Tree by continuing the spinal articulation into the well and adding extension of the head, neck, and chest."},{"raw":"(2) The instructor’s priority is to make sure the movement is initiated from the lower abdominals throughout the exercise.","step":true,"m":"(2)","t":"The instructor’s priority is to make sure the movement is initiated from the lower abdominals throughout the exercise."},{"raw":"(3) Do not remain hanging in the extended position for an extended period; allow the stretch, then initiate the return with control.","step":true,"m":"(3)","t":"Do not remain hanging in the extended position for an extended period; allow the stretch, then initiate the return with control."},{"raw":"(4) Square hips and shoulders are more important than reaching farther into the well. Twisting or shifting indicates that the client should return to Half Tree.","step":true,"m":"(4)","t":"Square hips and shoulders are more important than reaching farther into the well. Twisting or shifting indicates that the client should return to Half Tree."}],"full":true,"id":35,"fam":["Short Box"]},{"row":108,"apparatus":"Reformer","name":"Short Box Side Tree + ITB Stretch","reps":"","setup":"Box is short ways (horizontal) on the reformer between the shoulder blocks and the pegs to secure the box from moving; one foot under the strap","springs":"2","instructions":[{"raw":"(0) From Full Tree, remain on the first side with the working leg extended and the opposite foot firmly flexed underneath the strap.","step":true,"m":"(0)","t":"From Full Tree, remain on the first side with the working leg extended and the opposite foot firmly flexed underneath the strap."},{"raw":"Side Tree","step":false,"m":"","t":"Side Tree"},{"raw":"(1) Take the same-side hand to the inside of the working foot and the opposite hand to the handle on the side of the box.","step":true,"m":"(1)","t":"Take the same-side hand to the inside of the working foot and the opposite hand to the handle on the side of the box."},{"raw":"(2) Bow the head toward the leg and roll back, planting the working foot toward the ceiling.","step":true,"m":"(2)","t":"Bow the head toward the leg and roll back, planting the working foot toward the ceiling."},{"raw":"(3) Keeping the pelvis square, open the straight working leg out to the side.","step":true,"m":"(3)","t":"Keeping the pelvis square, open the straight working leg out to the side."},{"raw":"(4) Return the leg to the midline and roll forward with control.","step":true,"m":"(4)","t"  the working leg opens."},{"raw":"(5) Keep the working leg long and active throughout Side Tree.","step":true,"m":"(5)","t":"Keep the working leg long and active throughout Side Tree."},{"raw":"(6) For the ITB Stretch, keep the working foot flexed and lift through the spine as you rotate.","step":true,"m":"(6)","t":"For the ITB Stretch, keep the working foot flexed and lift through the spine as you rotate."},{"raw":"(7) Think of growing taller before slicing the arm open to create rotation rather than collapsing into the stretch.","step":true,"m":"(7)","t":"Think of growing taller before slicing the arm open to create rotation rather than collapsing into the stretch."}],"notes":[{"raw":"(1) Side Tree progresses Full Tree by challenging the client to maintain a square, stable pelvis while the working leg moves away from the midline.","step":true,"m":"(1)","t":"Side Tree progresses Full Tree by challenging the client to maintain a square, stable pelvis while the working leg moves away from the midline."},{"raw":"(2) The ITB Stretch adds spinal rotation while stretching the outer line of the working leg.","step":true,"m":"(2)","t":"The ITB Stretch adds spinal rotation while stretching the outer line of the working leg."},{"raw":"(3) Pelvic stability takes priority over how far the leg opens in Side Tree.","step":true,"m":"(3)","t":"Pelvic stability takes priority over how far the leg opens in Side Tree."}],"full":true,"id":36,"fam":["Short Box"]},{"row":109,"apparatus":"Reformer","name":"Short Box Side Situps","reps":"5-8 reps","setup":"Box is short ways (horizontal) on the reformer between the shoulder blocks and the pegs to secure the box from moving; one foot under the strap","springs":"2","instructions":[{"raw":"(0) Turn to face the side with the top leg long, parallel, and foot flexed underneath the strap; hook the bottom foot underneath the top leg, stack the hips and shoulders, and place the hands behind the head.","step":true,"m":"(0)","t":"Turn to face the side with the top leg long, parallel, and foot flexed underneath the strap; hook the bottom foot underneath the top leg, stack the hips and shoulders, and place the hands behind the head."},{"raw":"(1) Lower the torso a few inches into the well, maintaining the stacked position.","step":true,"m":"(1)","t":"Lower the torso a few inches into the well, maintaining the stacked position."},{"raw":"(2) Lengthen through the top side of the body to lift back up.","step":true,"m":"(2)","t":"Lengthen through the top side of the body to lift back up."},{"raw":"(3) Finish by reaching the bottom hand toward the floor or headrest and the top arm long by the ear for a side stretch.","step":true,"m":"(3)","t":"Finish by reaching the bottom hand toward the floor or headrest and the top arm long by the ear for a side stretch."},{"raw":"(4) Sit up and counter stretch in the opposite direction.","step":true,"m":"(4)","t":"Sit up and counter stretch in the opposite direction."},{"raw":"(5) Change sides.","step":true,"m":"(5)","t":"Change sides."}],"modifications":[{"raw":"(1) Hold the starting diagonal position without lowering into the well to build lateral strength and stability.","step":true,"m":"(1)","t":"Hold the starting diagonal position without lowering into the well to build lateral strength and stability."},{"raw":"(2) Use a very small range of motion, gradually increasing only as the client can maintain stacked hips and shoulders.","step":true,"m":"(2)","t":"Use a very small range of motion, gradually increasing only as the client can maintain stacked hips and shoulders."},{"raw":"(3) Side Sit Ups on the Ladder Barrel to provide more support in the torso.","step":true,"m":"(3)","t":"Side Sit Ups on the Ladder Barrel to provide more support in the torso."}],"cueing":[{"raw":"(1) Keep the top foot strongly flexed into the strap to anchor and activate the supporting leg.","step":true,"m":"(1)","t":"Keep the top foot strongly flexed into the strap to anchor and activate the supporti he toes.","step":true,"m":"(4)","t":"Keep the heels lifted high over the toes."},{"raw":"(5) Maintain one long line through the body from the crown of the head through the heels.","step":true,"m":"(5)","t":"Maintain one long line through the body from the crown of the head through the heels."},{"raw":"(6) Keep the fingers and thumbs long over the footbar for a secure hand position.","step":true,"m":"(6)","t":"Keep the fingers and thumbs long over the footbar for a secure hand position."},{"raw":"(7) Move the carriage without changing the shape of the plank.","step":true,"m":"(7)","t":"Move the carriage without changing the shape of the plank."}],"notes":[{"raw":"(1) Long Stretch is #1 of the five-part Long Stretch Series.","step":true,"m":"(1)","t":"Long Stretch is #1 of the five-part Long Stretch Series."},{"raw":"(2) The mounting sequence is called the “hand, foot, hand, foot” transition. It efficiently places the client into the plank without unnecessary adjustments once on the moving carriage.","step":true,"m":"(2)","t":"The mounting sequence is called the “hand, foot, hand, foot” transition. It efficiently places the client into the plank without unnecessary adjustments once on the moving carriage."},{"raw":"(3) When first introducing Long Stretch, establish a strong, stable plank before adding carriage movement.","step":true,"m":"(3)","t":"When first introducing Long Stretch, establish a strong, stable plank before adding carriage movement."},{"raw":"(4) The goal is not how far the carriage travels; maintaining the long plank and controlling the carriage home takes priority over range.","step":true,"m":"(4)","t":"The goal is not how far the carriage travels; maintaining the long plank and controlling the carriage home takes priority over range."}],"full":true,"id":38,"fam":[]},{"row":112,"apparatus":"Reformer","name":"Long Stretch Down","reps":"3-5 reps","setup":"Continuation of long stretch - same set up.","springs":"2","instructions":[{"raw":"(0) From Long S
