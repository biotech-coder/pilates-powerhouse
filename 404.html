ts through the arms."},{"raw":"(6) Maintain the shape of the spine as the carriage moves—the body travels as one long lifted line.","step":true,"m":"(6)","t":"Maintain the shape of the spine as the carriage moves—the body travels as one long lifted line."},{"raw":"(7) On the return, think of pulling the chest through the arms rather than simply allowing the springs to bring the carriage home.","step":true,"m":"(7)","t":"On the return, think of pulling the chest through the arms rather than simply allowing the springs to bring the carriage home."}],"notes":[{"raw":"(1) Down Stretch is #2 of the five-part Long Stretch Series.","step":true,"m":"(1)","t":"Down Stretch is #2 of the five-part Long Stretch Series."},{"raw":"(2) It is called Down Stretch because the knees are down on the carriage, even though the chest and spine are lifting upward.","step":true,"m":"(2)","t":"It is called Down Stretch because the knees are down on the carriage, even though the chest and spine are lifting upward."},{"raw":"(3) The emphasis is on length and supported extension through the entire spine rather than creating a large arch in the lower back.","step":true,"m":"(3)","t":"The emphasis is on length and supported extension through the entire spine rather than creating a large arch in the lower back."}],"full":true,"id":39,"fam":[]},{"row":113,"apparatus":"Reformer","name":"Long Stretch Up","reps":"3-5 reps","setup":"Continuation of long stretch - same set up.","springs":"2","instructions":[{"raw":"(0) From Down Stretch, pike the hips toward the ceiling, place the heels partway up the shoulder blocks, and bring the chin toward the chest.","step":true,"m":"(0)","t":"From Down Stretch, pike the hips toward the ceiling, place the heels partway up the shoulder blocks, and bring the chin toward the chest."},{"raw":"(1) Keeping the upper body stable and the pike shape, press the carriage halfway out through the legs.","step":true,"m":"(1)","t":"Keeping the upper body stable and the pike shape, press the carriage halfway out through the legs."},{"raw":"(2) Without moving the carriage, wrap the glutes and bring the pelvis underneath you to find a plank.","step":true,"m":"(2)","t":"Without moving the carriage, wrap the glutes and bring the pelvis underneath you to find a plank."},{"raw":"(3) Maintain the plank and resist the carriage home, bringing the shoulders over the wrists.","step":true,"m":"(3)","t":"Maintain the plank and resist the carriage home, bringing the shoulders over the wrists."},{"raw":"(4) Once the carriage is completely home, fold at the hips and lift back into the starting pike position.","step":true,"m":"(4)","t":"Once the carriage is completely home, fold at the hips and lift back into the starting pike position."}],"modifications":[],"cueing":[{"raw":"(1) Scoop the lower abdominals in and up as the hips lift toward the ceiling.","step":true,"m":"(1)","t":"Scoop the lower abdominals in and up as the hips lift toward the ceiling."},{"raw":"(2) Bring the nose toward the sternum and keep the head connected to the shape of the spine.","step":true,"m":"(2)","t":"Bring the nose toward the sternum and keep the head connected to the shape of the spine."},{"raw":"(3) Stabilize the upper body as the legs press the carriage out from the pike.","step":true,"m":"(3)","t":"Stabilize the upper body as the legs press the carriage out from the pike."},{"raw":"(4) Keep the carriage completely still as the pelvis moves from the pike into the plank.","step":true,"m":"(4)","t":"Keep the carriage completely still as the pelvis moves from the pike into the plank."},{"raw":"(5) “Burrito” the glutes as the pelvis comes underneath you to support the plank.","step":true,"m":"(5)","t":"“Burrito” the glutes as the pelvis comes underneath you to support the plank."},{"raw":"(6) Bring the shoulders over the wrists as the carriage closes.","step":true,"m":"(6)","t":"Bring the shoulders over the wrists as the carriage closes."},{"raw":"(7) Place the hands on either side of the client’s hip bones to guide the pathway from pike to plank and back to pike.","step":true,"m":"(7)","t":"Place the hands on either side of the client’s hip bones to guide the pathway from pike to plank and back to pike."}],"notes":[{"raw":"(1) Up Stretch is #3 of the five-part Long Stretch Series.","step":true,"m":"(1)","t":"Up Stretch is #3 of the five-part Long Stretch Series."},{"raw":"(2) The carriage moves during the press out and return, but should remain still while the body changes from the pike into the plank.","step":true,"m":"(2)","t":"The carriage moves during the press out and return, but should remain still while the body changes from the pike into the plank."},{"raw":"(3) Cary teaches the heels approximately three-quarters of the way up the shoulder blocks; other Classical teachers may cue them around halfway. The priority is finding a secure position that supports the pike and allows control of the carriage.","step":true,"m":"(3)","t":"Cary teaches the heels approximately three-quarters of the way up the shoulder blocks; other Classical teachers may cue them around halfway. The priority is finding a secure position that supports the pike and allows control of the carriage."},{"raw":"(4) After Up Stretch, the series progresses to Elephant, which was introduced in the Beginner Reformer order.","step":true,"m":"(4)","t":"After Up Stretch, the series progresses to Elephant, which was introduced in the Beginner Reformer order."}],"full":true,"id":40,"fam":[]},{"row":114,"apparatus":"Reformer","name":"Long Stretch Elephant Back + Side","reps":"3-5 reps","setup":"Continuation of long stretch - same set up.","springs":"2","instructions":[{"raw":"(0) Find Elephant position with the hips over the heels, weight in the heels, all ten toes lifted, and chin toward the chest.","step":true,"m":"(0)","t":"Find Elephant position with the hips over the heels, weight in the heels, all ten toes lifted, and chin toward the chest."},{"raw":"Back Elephant","step":false,"m":"","t":"Back Elephant"},{"raw":"(1) Reach one leg straight back through the headrest, keeping the hips and shoulders square.","step":true,"m":"(1)","t":"Reach one leg straight back through the headrest, keeping the hips and shoulders square."},{"raw":"(2) Press the carriage out through the standing heel while the upper body remains still.","step":true,"m":"(2)","t":"Press the carriage out through the standing heel while the upper body remains still."},{"raw":"(3) Scoop the abdominals to pull the carriage back underneath you.","step":true,"m":"(3)","t":"Scoop the abdominals to pull the carriage back underneath you."},{"raw":"Side Elephant","step":false,"m":"","t":"Side Elephant"},{"raw":"(4) Bring the lifted leg out to the side while maintaining the Elephant position.","step":true,"m":"(4)","t":"Bring the lifted leg out to the side while maintaining the Elephant position."},{"raw":"(5) Press the carriage out through the standing heel, keeping the pelvis and upper body stable.","step":true,"m":"(5)","t":"Press the carriage out through the standing heel, keeping the pelvis and upper body stable."},{"raw":"(6) Scoop the abdominals to pull the carriage back underneath you.","step":true,"m":"(6)","t":"Scoop the abdominals to pull the carriage back underneath you."},{"raw":"(7) Return to Elephant and change sides.","step":true,"m":"(7)","t":"Return to Elephant and change sides."}],"modifications":[{"raw":"(1) Revert to regular Elephant before progressing to the single-leg variations.","step":true,"m":"(1)","t":"Revert to regular Elephant before progressing to the single-leg variations."}],"cueing":[{"raw":"(1) Keep the weight back in the standing heel with all five toes lifted.","step":true,"m":"(1)","t":"Keep the weight back in the standing heel with all five toes lifted."},{"raw":"(2) Maintain square hips and shoulders in Back Elephant.","step":true,"m":"(2)","t":"Maintain square hips and shoulders in Back Elephant."},{"raw":"(3) Keep the weight even between both hands as the leg reaches away.","step":true,"m":"(3)","t":"Keep the weight even between both hands as the leg reaches away."},{"raw":"(4) Imagine holding onto the edge of a pool: the upper body stays connected to the “pool” while the legs move the carriage away and underneath you.","step":true,"m":"(4)","t":"Imagine holding onto the edge of a pool: the upper body stays connected to the “pool” while the legs move the carriage away and underneath you."},{"raw":"(5) Place your hands at the client’s shoulders and have them maintain contact throughout. If the shoulders move away from your hands, the movement is initiating from the upper body rather than the legs and powerhouse.","step":true,"m":"(5)","t":"Place your hands at the client’s shoulders and have them maintain contact throughout. If the shoulders move away from your hands, the movement is initiating from the upper body rather than the legs and powerhouse."},{"raw":"(6) In Side Elephant, think of the lifted-side sit bone connecting energetically to the opposite standing heel.","step":true,"m":"(6)","t":"In Side Elephant, think of the lifted-side sit bone connecting energetically to the opposite standing heel."},{"raw":"(7) Pull the carriage underneath you from the abdominals rather than allowing the springs to close it.","step":true,"m":"(7)","t":"Pull the carriage underneath you from the abdominals rather than allowing the springs to close it."}],"notes":[{"raw":"(1) Back Elephant progresses regular Elephant by decreasing the base of support while requiring the pelvis and shoulders to remain square.","step":true,"m":"(1)","t":"Back Elephant progresses regular Elephant by decreasing the base of support while requiring the pelvis and shoulders to remain square."},{"raw":"(2) Side Elephant is a more advanced progression and adds a greater challenge to lateral pelvic stability.","step":true,"m":"(2)","t":"Side Elephant is a more advanced progression and adds a greater challenge to lateral pelvic stability."},{"raw":"(3) The range of the carriage is determined by the client’s ability to keep the standing toes lifted, weight in the heel, and upper body still.","step":true,"m":"(3)","t":"The range of the carriage is determined by the client’s ability to keep the standing toes lifted, weight in the heel, and upper body still."},{"raw":"(4) Regular Elephant remains #4 of the five-part Long Stretch Series; Back and Side Elephant are variations added to that exercise rather than separate parts of the five-part series.","step":true,"m":"(4)","t":"Regular Elephant remains #4 of the five-part Long Stretch Series; Back and Side Elephant are variations added to that exercise rather than separate parts of the five-part series."}],"full":true,"id":41,"fam":[]},{"row":115,"apparatus":"Reformer","name":"Long Back Stretch Arms","reps":"3-5 each direction","setup":"Continuation of long stretch - same set up.","springs":"2","instructions":[{"raw":"(0) Step off after Elephant, turn to face the back of the Reformer, and mount hand, foot, hand, foot with the hands on the footbar, fingers facing back, and flexed feet against the shoulder blocks.","step":true,"m":"(0)","t":"Step off after Elephant, turn to face the back of the Reformer, and mount hand, foot, hand, foot with the hands on the footbar, fingers facing back, and flexed feet against the shoulder blocks."},{"raw":"First Direction","step":false,"m":"","t":"First Direction"},{"raw":"(1) With the chest lifted, bend the elbows behind you and curl the tail underneath.","step":true,"m":"(1)","t":"With the chest lifted, bend the elbows behind you and curl the tail underneath."},{"raw":"(2) Press the carriage out through the heels as the arms and pelvis work together.","step":true,"m":"(2)","t":"Press the carriage out through the heels as the arms and pelvis work together."},{"raw":"(3) Lift the hips and resist the carriage home, returning the pelvis underneath the shoulders.","step":true,"m":"(3)","t":"Lift the hips and resist the carriage home, returning the pelvis underneath the shoulders."},{"raw":"Reverse","step":false,"m":"","t":"Reverse"},{"raw":"(4) Keeping the hips lifted, press the carriage out through the heels.","step":true,"m":"(4)","t":"Keeping the hips lifted, press the carriage out through the heels."},{"raw":"(5) Bend the elbows behind you as the pelvis lowers.","step":true,"m":"(5)","t":"Bend the elbows behind you as the pelvis lowers."},{"raw":"(6) Guide the carriage home and press up through the arms to return to the starting position.","step":true,"m":"(6)","t":"Guide the carriage home and press up through the arms to return to the starting position."},{"raw":"(7) Carefully dismount the Reformer.","step":true,"m":"(7)","t":"Carefully dismount the Reformer."}],"modifications":[{"raw":"(1) Practice Tricep Dips at the front of the Reformer: face away, place the hands on the footbar with fingers toward the seat, walk the feet forward, bend the elbows back, and press the arms straight.","step":true,"m":"(1)","t":"Practice Tricep Dips at the front of the Reformer: face away, place the hands on the footbar with fingers toward the seat, walk the feet forward, bend the elbows back, and press the arms straight."},{"raw":"(2) Use Tricep Dips to build the arm strength and understand the elbow pathway before progressing to Long Back Stretch Arms.","step":true,"m":"(2)","t":"Use Tricep Dips to build the arm strength and understand the elbow pathway before progressing to Long Back Stretch Arms."}],"cueing":[{"raw":"(1) Keep the chest lifted and shoulders open rather than sinking between the arms.","step":true,"m":"(1)","t":"Keep the chest lifted and shoulders open rather than sinking between the arms."},{"raw":"(2) Bend the elbows directly behind you to engage the triceps.","step":true,"m":"(2)","t":"Bend the elbows directly behind you to engage the triceps."},{"raw":"(3) Press actively through the heels into the shoulder blocks.","step":true,"m":"(3)","t":"Press actively through the heels into the shoulder blocks."},{"raw":"(4) Coordinate the arms and pelvis so they work simultaneously and create one continuous movement.","step":true,"m":"(4)","t":"Coordinate the arms and pelvis so they work simultaneously and create one continuous movement."},{"raw":"(5) Keep the powerhouse connected as the pelvis lowers and lifts.","step":true,"m":"(5)","t":"Keep the powerhouse connected as the pelvis lowers and lifts."},{"raw":"(6) Use clear verbal cueing to maintain the flow; extensive hands-on cueing is difficult because the exercise should not be performed too slowly.","step":true,"m":"(6)","t":"Use clear verbal cueing to maintain the flow; extensive hands-on cueing is difficult because the exercise should not be performed too slowly."}],"notes":[{"raw":"(1) Long Back Stretch Arms is #5 and the final exercise of the five-part Long Stretch Series.","step":true,"m":"(1)","t":"Long Back Stretch Arms is #5 and the final exercise of the five-part Long Stretch Series."},{"raw":"(2) Cary describes this as a “go” exercise: once the client understands the sequence, the movements need to flow together. Moving excessively slowly can make the exercise more difficult and disrupt the coordination.","step":true,"m":"(2)","t":"Cary describes this as a “go” exercise: once the client understands the sequence, the movements need to flow together. Moving excessively slowly can make the exercise more difficult and disrupt the coordination."},{"raw":"(3) Tricep Dips are an important preparation because they allow the client to develop the arm strength and elbow mechanics before adding the moving carriage and pelvic action.","step":true,"m":"(3)","t":"Tricep Dips are an important preparation because they allow the client to develop the arm strength and elbow mechanics before adding the moving carriage and pelvic action."},{"raw":"(4) The reverse changes the order of the same components, increasing the coordination challenge while maintaining the same arm, powerhouse, and heel connection.","step":true,"m":"(4)","t":"The reverse changes the order of the same components, increasing the coordination challenge while maintaining the same arm, powerhouse, and heel connection."}],"full":true,"id":42,"fam":["Long Back Stretch"]},{"row":116,"apparatus":"Reformer","name":"Stomach Massage Twist","reps":"3-5 each direction","setup":"Sticky pad gets moved down to the front of the reformer for the client to sit on; foot bar is up with feet on it. Coninuation of Stomach Massage round/straight.","springs":"2","instructions":[{"raw":"(0) From Stomach Massage Reach, maintain the tall spine with both arms reaching forward.","step":true,"m":"(0)","t":"From Stomach Massage Reach, maintain the tall spine with both arms reaching forward."},{"raw":"(1) Press the carriage out to straight legs as one arm slices open and the upper body rotates toward that side.","step":true,"m":"(1)","t":"Press the carriage out to straight legs as one arm slices open and the upper body rotates toward that side."},{"raw":"(2) Return the torso and arms to center as the knees bend and the carriage resists home.","step":true,"m":"(2)","t":"Return the torso and arms to center as the knees bend and the carriage resists home."},{"raw":"(3) Repeat to the other side.","step":true,"m":"(3)","t":"Repeat to the other side."}],"modifications":[{"raw":"(1) Lower the footbar to create more space at the hips. This modification may be used throughout the entire Stomach Massage Series for clients who need additional space or reduced hip flexion.","step":true,"m":"(1)","t":"Lower the footbar to create more space at the hips. This modification may be used throughout the entire Stomach Massage Series for clients who need additional space or reduced hip flexion."}],"cueing":[{"raw":"(1) Keep the shoulders over the hips as you rotate toward the side wall; avoid leaning backward.","step":true,"m":"(1)","t":"Keep the shoulders over the hips as you rotate toward the side wall; avoid leaning backward."},{"raw":"(2) Think slightly forward and up through the spine so you remain tall over the sit bones throughout the twist.","step":true,"m":"(2)","t":"Think slightly forward and up through the spine so you remain tall over the sit bones throughout the twist."},{"raw":"(3) Initiate the rotation from the back and spine rather than simply reaching the arm behind you.","step":true,"m":"(3)","t":"Initiate the rotation from the back and spine rather than simply reaching the arm behind you."},{"raw":"(4) As in Short Box Twist and Reach, keep both sides of the waist long as you press out and rotate.","step":true,"m":"(4)","t":"As in Short Box Twist and Reach, keep both sides of the waist long as you press out and rotate."},{"raw":"(5) Place a hand at the lower back or hands on either side of the waist to cue the client to lift and lengthen before rotating.","step":true,"m":"(5)","t":"Place a hand at the lower back or hands on either side of the waist to cue the client to lift and lengthen before rotating."},{"raw":"(6) For an assisted twist, gently hold the client’s wrists and provide outward reach without pulling from the shoulders; encourage the spine to create the rotation first.","step":true,"m":"(6)","t":"For an assisted twist, gently hold the client’s wrists and provide outward reach without pulling from the shoulders; encourage the spine to create the rotation first."},{"raw":"(7) If unassisted, press the palms together and imagine a line extending from the longest finger of one hand through the longest finger of the other as the torso twists and reaches.","step":true,"m":"(7)","t":"If unassisted, press the palms together and imagine a line extending from the longest finger of one hand through the longest finger of the other as the torso twists and reaches."},{"raw":"(8) Imagine someone gently pulling both wrists away from one another to create length across the reach.","step":true,"m":"(8)","t":"Imagine someone gently pulling both wrists away from one another to create length across the reach."}],"notes":[{"raw":"(1) Stomach Massage Twist is a continuation of the previously learned Stomach Massage Reach.","step":true,"m":"(1)","t":"Stomach Massage Twist is a continuation of the previously learned Stomach Massage Reach."},{"raw":"(2) Clients commonly lean backward during the rotation. Prioritize staying tall over the sit bones with a slight forward intention rather than increasing the range of the twist.","step":true,"m":"(2)","t":"Clients commonly lean backward during the rotation. Prioritize staying tall over the sit bones with a slight forward intention rather than increasing the range of the twist."},{"raw":"(3) Cary notes that the Twist does not require hands-on assistance, but the opposition and length can feel especially clear when assisted.","step":true,"m":"(3)","t":"Cary notes that the Twist does not require hands-on assistance, but the opposition and length can feel especially clear when assisted."},{"raw":"(4) Cary also demonstrates a variation not included in the manual called Stomach Massage Swan Reach/Twist: begin with the hands on the footbar; as the legs press the carriage out, one arm reaches up, back, and around into extension and rotation, then alternate sides.","step":true,"m":"(4)","t":"Cary also demonstrates a variation not included in the manual called Stomach Massage Swan Reach/Twist: begin with the hands on the footbar; as the legs press the carriage out, one arm reaches up, back, and around into extension and rotation, then alternate sides."}],"full":true,"id":43,"fam":["Stomach Massage"]},{"row":117,"apparatus":"Reformer","name":"Semi-Circle","reps":"3 each direction","setup":"Foot bar down. Client is lyign on back. Push out with straight arms and hips over springs.","springs":"2","instructions":[{"raw":"(0) Lower the footbar flat, shorten the frame with the stopper, and position the sticky pad around the frame. Set the balls of the feet on the footbar, heels toward the frame, hands on the shoulder blocks; lift the pelvis and use the arms to slide forward until the arms are straight and the weight is supported across the back of the shoulders.","step":true,"m":"(0)","t":"Lower the footbar flat, shorten the frame with the stopper, and position the sticky pad around the frame. Set the balls of the feet on the footbar, heels toward the frame, hands on the shoulder blocks; lift the pelvis and use the arms to slide forward until the arms are straight and the weight is supported across the back of the shoulders."},{"raw":"First Direction","step":false,"m":"","t":"First Direction"},{"raw":"(1) Without moving the carriage, lower the heels to the frame.","step":true,"m":"(1)","t":"Without moving the carriage, lower the heels to the frame."},{"raw":"(2) Articulate the spine down bone by bone—sternum, ribs, navel, lower back, tailbone—until the pelvis reaches into the well and grazes the springs.","step":true,"m":"(2)","t":"Articulate the spine down bone by bone—sternum, ribs, navel, lower back, tailbone—until the pelvis reaches into the well and grazes the springs."},{"raw":"(3) Maintain the shape and press the carriage out.","step":true,"m":"(3)","t":"Maintain the shape and press the carriage out."},{"raw":"(4) Keep the carriage still and articulate the spine back up into the high bridge.","step":true,"m":"(4)","t":"Keep the carriage still and articulate the spine back up into the high bridge."},{"raw":"(5) Maintain the lifted pelvis and resist the carriage home, keeping the heels down as long as possible before they lift.","step":true,"m":"(5)","t":"Maintain the lifted pelvis and resist the carriage home, keeping the heels down as long as possible before they lift."},{"raw":"Reverse","step":false,"m":"","t":"Reverse"},{"raw":"(6) From the lifted position, press the carriage out.","step":true,"m":"(6)","t":"From the lifted position, press the carriage out."},{"raw":"(7) Articulate the spine down into the well with the carriage held still.","step":true,"m":"(7)","t":"Articulate the spine down into the well with the carriage held still."},{"raw":"(8) Bend the knees to bring the carriage home, keeping the pelvis low.","step":true,"m":"(8)","t":"Bend the knees to bring the carriage home, keeping the pelvis low."},{"raw":"(9) Once home, articulate the spine back up to the high bridge.","step":true,"m":"(9)","t":"Once home, articulate the spine back up to the high bridge."}],"modifications":[],"cueing":[{"raw":"(1) Think of a bridge that continues below the level of the carriage, creating length through the front of the hips and thighs.","step":true,"m":"(1)","t":"Think of a bridge that continues below the level of the carriage, creating length through the front of the hips and thighs."},{"raw":"(2) Keep the knees tracking in line with the second toes throughout.","step":true,"m":"(2)","t":"Keep the knees tracking in line with the second toes throughout."},{"raw":"(3) Curl the tail underneath at the top rather than arching into the lower back.","step":true,"m":"(3)","t":"Curl the tail underneath at the top rather than arching into the lower back."},{"raw":"(4) Keep the arms long and press firmly into the shoulder blocks for support.","step":true,"m":"(4)","t":"Keep the arms long and press firmly into the shoulder blocks for support."},{"raw":"(5) Articulate sequentially through the spine rather than dropping or lifting the pelvis as one piece.","step":true,"m":"(5)","t":"Articulate sequentially through the spine rather than dropping or lifting the pelvis as one piece."},{"raw":"(6) Keep the carriage as still as possible during the spinal articulation.","step":true,"m":"(6)","t":"Keep the carriage as still as possible during the spinal articulation."},{"raw":"(7) Cue: “Heels lower first and come up last.”","step":true,"m":"(7)","t":"Cue: “Heels lower first and come up last.”"},{"raw":"(8) For assisted length, support underneath the client’s pelvis with one hand and at the front of the ankle with the other, using the instructor’s body to support the knees. Gently lift the pelvis up and forward rather than pressing downward to create more space and length through the spine and front body.","step":true,"m":"(8)","t":"For assisted length, support underneath the client’s pelvis with one hand and at the front of the ankle with the other, using the instructor’s body to support the knees. Gently lift the pelvis up and forward rather than pressing downward to create more space and length through the spine and front body."}],"notes":[{"raw":"(1) Semi-Circle combines spinal articulation with a deep opening through the hips and front of the thighs—the bridge travels below the level of the carriage before returning into the lifted position.","step":true,"m":"(1)","t":"Semi-Circle combines spinal articulation with a deep opening through the hips and front of the thighs—the bridge travels below the level of the carriage before returning into the lifted position."},{"raw":"(2) The heels may lift as the carriage closes when necessary to accommodate the position, but keep them connected to the frame for as long as the movement allows.","step":true,"m":"(2)","t":"The heels may lift as the carriage closes when necessary to accommodate the position, but keep them connected to the frame for as long as the movement allows."},{"raw":"(3) Cary notes that knee issues do not automatically exclude Semi-Circle. The intended emphasis is opening the hips and quadriceps rather than loading directly into the knee joint; individual knee symptoms, range, and tolerance should still determine whether the exercise is appropriate.","step":true,"m":"(3)","t":"Cary notes that knee issues do not automatically exclude Semi-Circle. The intended emphasis is opening the hips and quadriceps rather than loading directly into the knee joint; individual knee symptoms, range, and tolerance should still determine whether the exercise is appropriate."}],"full":true,"id":44,"fam":[]},{"row":118,"apparatus":"Reformer","name":"Kneeling Chest Expansion w/ Toes Hooked","reps":"3-5 each","setup":"Foot bar down. Client is kneeling facing back with toes hooked over front of carriage. Hands walk up leather straps.","springs":"1or2","instructions":[{"raw":"(0) Progress from the Beginner Kneeling Chest Expansion by moving the knees away from the shoulder blocks and hooking the toes actively over the front edge of the carriage; face the back, hold the leather straps with handles hanging, and find a tall kneeling position.","step":true,"m":"(0)","t":"Progress from the Beginner Kneeling Chest Expansion by moving the knees away from the shoulder blocks and hooking the toes actively over the front edge of the carriage; face the back, hold the leather straps with handles hanging, and find a tall kneeling position."},{"raw":"(1) Inhale, pull the straight arms back past the hips as the chest lifts and shoulders remain over the hips.","step":true,"m":"(1)","t":"Inhale, pull the straight arms back past the hips as the chest lifts and shoulders remain over the hips."},{"raw":"(2) Hold the breath and carriage still; turn the head right, left, then center.","step":true,"m":"(2)","t":"Hold the breath and carriage still; turn the head right, left, then center."},{"raw":"(3) Exhale and resist the arms forward without losing the tall kneeling position.","step":true,"m":"(3)","t":"Exhale and resist the arms forward without losing the tall kneeling position."},{"raw":"(4) Repeat, beginning the head turn to the opposite side.","step":true,"m":"(4)","t":"Repeat, beginning the head turn to the opposite side."}],"modifications":[{"raw":"(1) Revert to the previously learned Kneeling Chest Expansion with the knees against the shoulder blocks for additional stability.","step":true,"m":"(1)","t":"Revert to the previously learned Kneeling Chest Expansion with the knees against the shoulder blocks for additional stability."}],"cueing":[{"raw":"(1) Actively curl the toes around the front edge of the carriage to connect into the backs of the legs.","step":true,"m":"(1)","t":"Actively curl the toes around the front edge of the carriage to connect into the backs of the legs."},{"raw":"(2) Draw the lower abdominals in and up to stabilize the pelvis and find greater support through the powerhouse.","step":true,"m":"(2)","t":"Draw the lower abdominals in and up to stabilize the pelvis and find greater support through the powerhouse."},{"raw":"(3) Connect through the front of the body to create openness across the chest and upper back.","step":true,"m":"(3)","t":"Connect through the front of the body to create openness across the chest and upper back."},{"raw":"(4) Keep the shoulders stacked over the hips rather than allowing the body to shift with the carriage.","step":true,"m":"(4)","t":"Keep the shoulders stacked over the hips rather than allowing the body to shift with the carriage."},{"raw":"(5) Keep the wrists long as the arms press behind the hips.","step":true,"m":"(5)","t":"Keep the wrists long as the arms press behind the hips."},{"raw":"(6) Maintain the lift of the torso and stillness of the carriage during the head turns.","step":true,"m":"(6)","t":"Maintain the lift of the torso and stillness of the carriage during the head turns."}],"notes":[{"raw":"(1) This is the Intermediate/full progression of the previously learned Kneeling Chest Expansion. The choreography remains the same; removing the support of the shoulder blocks requires greater stability through the powerhouse.","step":true,"m":"(1)","t":"This is the Intermediate/full progression of the previously learned Kneeling Chest Expansion. The choreography remains the same; removing the support of the shoulder blocks requires greater stability through the powerhouse."},{"raw":"(2) Safety: Do not create tension on the straps until the kneeling position is completely established and the client is ready.","step":true,"m":"(2)","t":"Safety: Do not create tension on the straps until the kneeling position is completely established and the client is ready."},{"raw":"(3) Resistance can be selected according to the training goal and client: lighter resistance places greater demand on stabilization through the powerhouse, while heavier resistance increases the upper-back and arm-strength challenge.","step":true,"m":"(3)","t":"Resistance can be selected according to the training goal and client: lighter resistance places greater demand on stabilization through the powerhouse, while heavier resistance increases the upper-back and arm-strength challenge."}],"full":true,"id":45,"fam":["Chest Expansion"]},{"row":119,"apparatus":"Reformer","name":"Kneeling Thigh Stretch","reps":"3-5 each","setup":"Foot bar down. Sticky pad covers springs. Client is kneeling facing back with knees up against shoulder blocks. Hands walk up leather straps.","springs":"3","instructions":[{"raw":"(0) From Kneeling Chest Expansion, increase the resistance, cover the springs completely with the sticky pad, and kneel facing the back with thighs against the shoulder blocks, knees inner-hip-width apart, toes long, and hands walked forward on the leather straps until taut.","step":true,"m":"(0)","t":"From Kneeling Chest Expansion, increase the resistance, cover the springs completely with the sticky pad, and kneel facing the back with thighs against the shoulder blocks, knees inner-hip-width apart, toes long, and hands walked forward on the leather straps until taut."},{"raw":"(1) Nod the chin toward the chest, lift through the spine, and draw the straight arms slightly behind you.","step":true,"m":"(1)","t":"Nod the chin toward the chest, lift through the spine, and draw the straight arms slightly behind you."},{"raw":"(2) Press the pelvis forward and hinge the body back in one long line, keeping the hip creases open.","step":true,"m":"(2)","t":"Press the pelvis forward and hinge the body back in one long line, keeping the hip creases open."},{"raw":"(3) Lift the arms toward shoulder height to clear the straps and return the body in one piece to tall kneeling.","step":true,"m":"(3)","t":"Lift the arms toward shoulder height to clear the straps and return the body in one piece to tall kneeling."}],"modifications":[],"cueing":[{"raw":"(1) Lift through the spine before beginning the hinge.","step":true,"m":"(1)","t":"Lift through the spine before beginning the hinge."},{"raw":"(2) Press the pelvis forward as the body hinges backward to maintain length through the front of the hips and thighs.","step":true,"m":"(2)","t":"Press the pelvis forward as the body hinges backward to maintain length through the front of the hips and thighs."},{"raw":"(3) “Burrito” the glutes to stabilize the pelvis and support the powerhouse.","step":true,"m":"(3)","t":"“Burrito” the glutes to stabilize the pelvis and support the powerhouse."},{"raw":"(4) Glide the shoulders down and back as the arms connect to the straps.","step":true,"m":"(4)","t":"Glide the shoulders down and back as the arms connect to the straps."},{"raw":"(5) Keep the knees, hips, shoulders, and head organized in one long line rather than sitting the pelvis toward the heels.","step":true,"m":"(5)","t":"Keep the knees, hips, shoulders, and head organized in one long line rather than sitting the pelvis toward the heels."},{"raw":"(6) Limit the hinge before the seat approaches the heels; prioritize the long thigh stretch and powerhouse connection over depth.","step":true,"m":"(6)","t":"Limit the hinge before the seat approaches the heels; prioritize the long thigh stretch and powerhouse connection over depth."}],"notes":[{"raw":"(1) This is a safety exercise.  The sticky pad must completely cover the exposed springs. This helps prevent long hair, clothing, or the body from contacting or becoming caught in the springs during the deep hinge or extension.","step":true,"m":"(1)","t":"This is a safety exercise.  The sticky pad must completely cover the exposed springs. This helps prevent long hair, clothing, or the body from contacting or becoming caught in the springs during the deep hinge or extension."},{"raw":"(2) Cary also teaches an optional extension: after hinging back with length, open and lift the chest into extension. To return, bring the chin toward the chest and allow the straps to assist the body back to tall kneeling. This is more advanced.","step":true,"m":"(2)","t":"Cary also teaches an optional extension: after hinging back with length, open and lift the chest into extension. To return, bring the chin toward the chest and allow the straps to assist the body back to tall kneeling. This is more advanced."},{"raw":"(3) The primary movement is a hinge rather than a backbend—the pelvis continues pressing forward as the thighs lengthen back.","step":true,"m":"(3)","t":"The primary movement is a hinge rather than a backbend—the pelvis continues pressing forward as the thighs lengthen back."},{"raw":"(4) This exercise follows Full Kneeling Chest Expansion, but the knees return to the shoulder blocks to provide a stable base for the deeper thigh stretch.","step":true,"m":"(4)","t":"This exercise follows Full Kneeling Chest Expansion, but the knees return to the shoulder blocks to provide a stable base for the deeper thigh stretch."}],"full":true,"id":46,"fam":["Thigh Stretch"]},{"row":120,"apparatus":"Reformer","name":"Kneeling Arm Circles","reps":"3-5 each direction","setup":"Foot bar down. Client is kneeling facing forward with feet up against shoulder blocks. Handles in hand.","springs":"1or2","instructions":[{"raw":"(0) From Thigh Stretch, step off with control, remove the sticky pad, reduce the resistance, and kneel facing the footbar with toes flexed under, heels anchored against the shoulder blocks, handles in hands, and chest lifted.","step":true,"m":"(0)","t":"From Thigh Stretch, step off with control, remove the sticky pad, reduce the resistance, and kneel facing the footbar with toes flexed under, heels anchored against the shoulder blocks, handles in hands, and chest lifted."},{"raw":"Forward Circles","step":false,"m":"","t":"Forward Circles"},{"raw":"(1) Scoop the lower abdominals and press into the straps, reaching the arms forward and up.","step":true,"m":"(1)","t":"Scoop the lower abdominals and press into the straps, reaching the arms forward and up."},{"raw":"(2) Open the arms toward the side walls, keeping them slightly forward of the body.","step":true,"m":"(2)","t":"Open the arms toward the side walls, keeping them slightly forward of the body."},{"raw":"(3) Circle the arms down to the outer hips.","step":true,"m":"(3)","t":"Circle the arms down to the outer hips."},{"raw":"Reverse Circles","step":false,"m":"","t":"Reverse Circles"},{"raw":"(4) Reverse the pathway: circle the arms out and up, then reach forward and lower with control.","step":true,"m":"(4)","t":"Reverse the pathway: circle the arms out and up, then reach forward and lower with control."}],"modifications":[],"cueing":[{"raw":"(1) Keep the heels firmly connected to the shoulder blocks—this is the anchor for the exercise.","step":true,"m":"(1)","t":"Keep the heels firmly connected to the shoulder blocks—this is the anchor for the exercise."},{"raw":"(2) Scoop the lower abdominals in and up to stabilize the pelvis and maintain tall kneeling.","step":true,"m":"(2)","t":"Scoop the lower abdominals in and up to stabilize the pelvis and maintain tall kneeling."},{"raw":"(3) Keep the chest and gaze lifted without allowing the ribs to flare forward.","step":true,"m":"(3)","t":"Keep the chest and gaze lifted without allowing the ribs to flare forward."},{"raw":"(4) Press into the straps throughout the circle rather than allowing the springs to move the arms.","step":true,"m":"(4)","t":"Press into the straps throughout the circle rather than allowing the springs to move the arms."},{"raw":"(5) Keep the shoulders down as the arms travel overhead.","step":true,"m":"(5)","t":"Keep the shoulders down as the arms travel overhead."},{"raw":"(6) Maintain the arms slightly forward of the torso so the hands remain visible in your peripheral vision.","step":true,"m":"(6)","t":"Maintain the arms slightly forward of the torso so the hands remain visible in your peripheral vision."}],"notes":[{"raw":"(1) If you cannot see the hands in your peripheral vision, the arm circle has likely traveled too far behind the body.","step":true,"m":"(1)","t":"If you cannot see the hands in your peripheral vision, the arm circle has likely traveled too far behind the body."},{"raw":"(2) The heels against the shoulder blocks provide the lower-body anchor while the powerhouse stabilizes the torso against the movement of the arms and carriage.","step":true,"m":"(2)","t":"The heels against the shoulder blocks provide the lower-body anchor while the powerhouse stabilizes the torso against the movement of the arms and carriage."}],"full":true,"id":47,"fam":[]},{"row":121,"apparatus":"Reformer","name":"Mermaid","reps":"3-5 reps","setup":"Foot bar up.","springs":"1-2","instructions":[{"raw":"(0) Sit facing the side wall in the established Mermaid position with the legs stacked and shins against the shoulder blocks; place the inside hand at the center of the footbar and reach the outside arm up alongside the head.","step":true,"m":"(0)","t":"Sit facing the side wall in the established Mermaid position with the legs stacked and shins against the shoulder blocks; place the inside hand at the center of the footbar and reach the outside arm up alongside the head."},{"raw":"(1) Press the carriage out as you lift up and side bend toward the springs, anchoring the hips toward the heels in opposition.","step":true,"m":"(1)","t":"Press the carriage out as you lift up and side bend toward the springs, anchoring the hips toward the heels in opposition."},{"raw":"(2) Maintain the long C-curve with the top arm alongside the head and both sides of the waist lengthened.","step":true,"m":"(2)","t":"Maintain the long C-curve with the top arm alongside the head and both sides of the waist lengthened."},{"raw":"(3) Lift through the waist and resist the carriage home.","step":true,"m":"(3)","t":"Lift through the waist and resist the carriage home."},{"raw":"(4) Once home, open both arms to the side walls and find your balance.","step":true,"m":"(4)","t":"Once home, open both arms to the side walls and find your balance."},{"raw":"(5) Reach the opposite arm alongside the head and hold the shoulder block with the other hand to counter stretch.","step":true,"m":"(5)","t":"Reach the opposite arm alongside the head and hold the shoulder block with the other hand to counter stretch."},{"raw":"(6) Turn toward the back of the Reformer and windshield/can-can the legs to transition to the other side.","step":true,"m":"(6)","t":"Turn toward the back of the Reformer and windshield/can-can the legs to transition to the other side."}],"modifications":[{"raw":"(1) If stacking the legs is restricted, slide the bottom knee slightly away from underneath the top knee to create more space at the hips.","step":true,"m":"(1)","t":"If stacking the legs is restricted, slide the bottom knee slightly away from underneath the top knee to create more space at the hips."}],"cueing":[{"raw":"(1) As in Mat Mermaid, anchor the hips down in opposition to the upward and outward reach of the spine.","step":true,"m":"(1)","t":"As in Mat Mermaid, anchor the hips down in opposition to the upward and outward reach of the spine."},{"raw":"(2) Lift up before bending sideways—create length before range.","step":true,"m":"(2)","t":"Lift up before bending sideways—create length before range."},{"raw":"(3) Keep both sides of the waist long rather than collapsing into the underside of the C-curve.","step":true,"m":"(3)","t":"Keep both sides of the waist long rather than collapsing into the underside of the C-curve."},{"raw":"(4) Press the hips toward the heels as the carriage travels out.","step":true,"m":"(4)","t":"Press the hips toward the heels as the carriage travels out."},{"raw":"(5) Keep the top arm long and connected alongside the head throughout the side bend.","step":true,"m":"(5)","t":"Keep the top arm long and connected alongside the head throughout the side bend."},{"raw":"(6) Draw the front ribs toward the back body to connect the front of the body into the back and support the powerhouse.","step":true,"m":"(6)","t":"Draw the front ribs toward the back body to connect the front of the body into the back and support the powerhouse."},{"raw":"(7) Resist the carriage home while continuing to lift through the waist rather than simply returning upright.","step":true,"m":"(7)","t":"Resist the carriage home while continuing to lift through the waist rather than simply returning upright."}],"notes":[{"raw":"(1) This exercise builds directly on the previously learned Mat Mermaid; the moving carriage adds resistance and requires greater opposition between the anchored pelvis and lengthening spine.","step":true,"m":"(1)","t":"This exercise builds directly on the previously learned Mat Mermaid; the moving carriage adds resistance and requires greater opposition between the anchored pelvis and lengthening spine."},{"raw":"(2) The classical/ideal setup may use two springs. Cary prefers Mermaid with lighter resistance because it allows more freedom through the side bend and stretch.","step":true,"m":"(2)","t":"The classical/ideal setup may use two springs. Cary prefers Mermaid with lighter resistance because it allows more freedom through the side bend and stretch."},{"raw":"(3) The counter stretch reverses the direction of the side bend before transitioning to the second side.","step":true,"m":"(3)","t":"The counter stretch reverses the direction of the side bend before transitioning to the second side."}],"full":true,"id":48,"fam":["Mermaid"]},{"row":122,"apparatus":"Reformer","name":"Tic-Toc","reps":"3-5 each","setup":"Head rest down; foot bar down. Client is lying on back","springs":"","instructions":[{"raw":"(0) Lower the footbar and headrest and lie supine, holding the back of the shoulder blocks with elbows wide and
