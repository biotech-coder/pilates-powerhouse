","t":"As the client progresses from tabletop toward straight legs, allow a slight bend in the knees if needed, keeping the knees organized in line with the navel rather than forcing the legs straight."}],"cueing":[{"raw":"(1) Keep the legs connected as one unit throughout the Tic Toc.","step":true,"m":"(1)","t":"Keep the legs connected as one unit throughout the Tic Toc."},{"raw":"(2) Initiate and control the rotation from the powerhouse rather than using momentum from the legs.","step":true,"m":"(2)","t":"Initiate and control the rotation from the powerhouse rather than using momentum from the legs."},{"raw":"(3) Keep the elbows wide and anchored to provide stability through the upper body.","step":true,"m":"(3)","t":"Keep the elbows wide and anchored to provide stability through the upper body."},{"raw":"(4) Maintain length through the waist as the legs travel from side to side.","step":true,"m":"(4)","t":"Maintain length through the waist as the legs travel from side to side."},{"raw":"(5) From behind the client’s legs, support the ankles with one hand and place the other hand just below the ribcage. Gently create opposition between the legs and ribs to deepen the stretch without forcing the range.","step":true,"m":"(5)","t":"From behind the client’s legs, support the ankles with one hand and place the other hand just below the ribcage. Gently create opposition between the legs and ribs to deepen the stretch without forcing the range."},{"raw":"(6) Use particular care with the amount of pressure during the assisted stretch.","step":true,"m":"(6)","t":"Use particular care with the amount of pressure during the assisted stretch."}],"notes":[{"raw":"(1) The tabletop and straight-leg versions follow the same movement principles; the straight-leg variation increases the lever and therefore the demand on the powerhouse.","step":true,"m":"(1)","t":"The tabletop and straight-leg versions follow the same movement principles; the straight-leg variation increases the lever and therefore the demand on the powerhouse."},{"raw":"(2) Control and organization take priority over range—the legs should not simply fall from side to side under momentum.","step":true,"m":"(2)","t":"Control and organization take priority over range—the legs should not simply fall from side to side under momentum."},{"raw":"(3) Cary emphasizes the “gray area” between Beginner and Intermediate. A client may be ready to progress beyond tabletop before having the flexibility to completely straighten the legs. A small knee bend is appropriate when it preserves alignment and control.","step":true,"m":"(3)","t":"Cary emphasizes the “gray area” between Beginner and Intermediate. A client may be ready to progress beyond tabletop before having the flexibility to completely straighten the legs. A small knee bend is appropriate when it preserves alignment and control."},{"raw":"(4) The goal is not to force an ideal-body shape, but to progressively increase the lever while maintaining powerhouse control and an organized spine.","step":true,"m":"(4)","t":"The goal is not to force an ideal-body shape, but to progressively increase the lever while maintaining powerhouse control and an organized spine."}],"full":true,"id":49,"fam":[]},{"row":123,"apparatus":"Reformer","name":"Corkscrew","reps":"5-8 reps","setup":"Head rest down; foot bar down. Client is lying on back.","springs":"2","instructions":[{"raw":"(0) Maintain the Tic Toc setup with the legs at 90° in Pilates stance, hands holding the back of the shoulder blocks, elbows wide, and gaze to the ceiling.","step":true,"m":"(0)","t":"Maintain the Tic Toc setup with the legs at 90° in Pilates stance, hands holding the back of the shoulder blocks, elbows wide, and gaze to the ceiling."},{"raw":"(1) Rotate the pelvis to the right, circle forward and around to the left, and return to center.","step":true,"m":"(1)","t":"Rotate the pelvis to the right, circle forward and around to the left, and return to center."},{"raw":"(2) Reverse: rotate the pelvis left, circle forward and around to the right, and return to center.","step":true,"m":"(2)","t":"Reverse: rotate the pelvis left, circle forward and around to the right, and return to center."},{"raw":"(3) Continue alternating directions with a smooth, continuous circle.","step":true,"m":"(3)","t":"Continue alternating directions with a smooth, continuous circle."}],"modifications":[{"raw":"(1) Keep the footbar lifted as a visual reference for the range of the leg circle; a Beginner client should not lower the legs below that level.","step":true,"m":"(1)","t":"Keep the footbar lifted as a visual reference for the range of the leg circle; a Beginner client should not lower the legs below that level."},{"raw":"(2) Reduce the size of the circle whenever the pelvis, powerhouse, or lower back cannot remain controlled.","step":true,"m":"(2)","t":"Reduce the size of the circle whenever the pelvis, powerhouse, or lower back cannot remain controlled."}],"cueing":[{"raw":"(1) As in Mat Corkscrew, the legs follow—they do not lead. Initiate the circle from the powerhouse and pelvis.","step":true,"m":"(1)","t":"As in Mat Corkscrew, the legs follow—they do not lead. Initiate the circle from the powerhouse and pelvis."},{"raw":"(2) Keep the elbows wide and anchored.","step":true,"m":"(2)","t":"Keep the elbows wide and anchored."},{"raw":"(3) Keep the shoulders stable and the upper body quiet as the pelvis moves.","step":true,"m":"(3)","t":"Keep the shoulders stable and the upper body quiet as the pelvis moves."},{"raw":"(4) Maintain the connection of the legs in Pilates stance throughout the circle.","step":true,"m":"(4)","t":"Maintain the connection of the legs in Pilates stance throughout the circle."},{"raw":"(5) Keep the spine long and supported; do not increase the range if the lower back loses organization.","step":true,"m":"(5)","t":"Keep the spine long and supported; do not increase the range if the lower back loses organization."},{"raw":"(6) Return the sacrum precisely to center at the completion of each circle.","step":true,"m":"(6)","t":"Return the sacrum precisely to center at the completion of each circle."}],"notes":[{"raw":"(1) This builds directly from Tic Toc: rather than moving side to side, the pelvis and legs travel through a continuous circular pathway.","step":true,"m":"(1)","t":"This builds directly from Tic Toc: rather than moving side to side, the pelvis and legs travel through a continuous circular pathway."},{"raw":"(2) Beginner/Advanced progression: roll overhead with the legs parallel to the floor, articulate completely down to the sacrum, then rotate and circle.","step":true,"m":"(2)","t":"Beginner/Advanced progression: roll overhead with the legs parallel to the floor, articulate completely down to the sacrum, then rotate and circle."},{"raw":"(3) Intermediate/Advanced progression: roll down only to the base of the ribs before beginning the rotation.","step":true,"m":"(3)","t":"Intermediate/Advanced progression: roll down only to the base of the ribs before beginning the rotation."},{"raw":"(4) Super Advanced progression: initiate the twist while still overhead rather than first articulating down.","step":true,"m":"(4)","t":"Super Advanced progression: initiate the twist while still overhead rather than first articulating down."},{"raw":"(5) As the overhead version progresses, the pelvis may rotate approximately 45° to one side, pass through center and rotate to the other side before returning overhead with the legs parallel to the floor.","step":true,"m":"(5)","t":"As the overhead version progresses, the pelvis may rotate approximately 45° to one side, pass through center and rotate to the other side before returning overhead with the legs parallel to the floor."},{"raw":"(6) Regardless of progression, the sacrum should return to center rather than landing shifted to either side.","step":true,"m":"(6)","t":"Regardless of progression, the sacrum should return to center rather than landing shifted to either side."}],"full":true,"id":50,"fam":["Corkscrew"]},{"row":124,"apparatus":"Reformer","name":"Long Spine Massage Prep","reps":"5-8 reps","setup":"Head rest down; foot bar down; extension straps attached. Client is lying on back.","springs":"2","instructions":[{"raw":"(0) Set up as for Leg Circles and Frogs with extension straps on the feet and the headrest completely down.","step":true,"m":"(0)","t":"Set up as for Leg Circles and Frogs with extension straps on the feet and the headrest completely down."},{"raw":"(1) Press the Frog out to a 45° diagonal.","step":true,"m":"(1)","t":"Press the Frog out to a 45° diagonal."},{"raw":"(2) Keeping the legs straight and together, lift them to 90° and pause through the tailbone.","step":true,"m":"(2)","t":"Keeping the legs straight and together, lift them to 90° and pause through the tailbone."},{"raw":"(3) Press the legs toward the ceiling and articulate the spine up until the ankles are over the head and the body is supported across the shoulders.","step":true,"m":"(3)","t":"Press the legs toward the ceiling and articulate the spine up until the ankles are over the head and the body is supported across the shoulders."},{"raw":"(4) Bend the knees into Frog with control.","step":true,"m":"(4)","t":"Bend the knees into Frog with control."},{"raw":"(5) Articulate the spine back down and return to the starting position.","step":true,"m":"(5)","t":"Articulate the spine back down and return to the starting position."}],"modifications":[],"cueing":[{"raw":"(1) Allow a distinct pause or “break” through the tailbone before initiating the roll-up so the articulation begins from the powerhouse rather than momentum.","step":true,"m":"(1)","t":"Allow a distinct pause or “break” through the tailbone before initiating the roll-up so the articulation begins from the powerhouse rather than momentum."},{"raw":"(2) Press the legs toward the ceiling rather than simply throwing them overhead.","step":true,"m":"(2)","t":"Press the legs toward the ceiling rather than simply throwing them overhead."},{"raw":"(3) At the top, organize the ankles over the head with the weight supported across the shoulders—not the neck.","step":true,"m":"(3)","t":"At the top, organize the ankles over the head with the weight supported across the shoulders—not the neck."},{"raw":"(4) Press the triceps firmly into the carriage in opposition to create upper-body stability.","step":true,"m":"(4)","t":"Press the triceps firmly into the carriage in opposition to create upper-body stability."},{"raw":"(5) Keep the shoulder blades anchored down as the spine rolls up.","step":true,"m":"(5)","t":"Keep the shoulder blades anchored down as the spine rolls up."},{"raw":"(6) Use the powerhouse to control the articulation rather than allowing the straps to pull the pelvis overhead.","step":true,"m":"(6)","t":"Use the powerhouse to control the articulation rather than allowing the straps to pull the pelvis overhead."}],"notes":[{"raw":"(1) Long Spine Massage Prep establishes the fundamental skill of rolling the spine up onto the shoulders before adding the opening, closing, and directional changes of the full Long Spine Massage.","step":true,"m":"(1)","t":"Long Spine Massage Prep establishes the fundamental skill of rolling the spine up onto the shoulders before adding the opening, closing, and directional changes of the full Long Spine Massage."},{"raw":"(2) The headrest must remain completely down for any exercise in which the pelvis and spine roll overhead.","step":true,"m":"(2)","t":"The headrest must remain completely down for any exercise in which the pelvis and spine roll overhead."},{"raw":"(3) Cary includes the Prep because it gives the client an opportunity to learn the basic pathway and shoulder-supported position before progressing to the full exercise.","step":true,"m":"(3)","t":"Cary includes the Prep because it gives the client an opportunity to learn the basic pathway and shoulder-supported position before progressing to the full exercise."},{"raw":"(4) Some Classical Pilates lineages omit this preparation. Cary notes that concerns about its appropriateness at this level are one reason it may be excluded; in her teaching progression, she prefers establishing the foundational skill before advancing.","step":true,"m":"(4)","t":"Some Classical Pilates lineages omit this preparation. Cary notes that concerns about its appropriateness at this level are one reason it may be excluded; in her teaching progression, she prefers establishing the foundational skill before advancing."},{"raw":"(5) The full Long Spine Massage progresses to opening the legs at the top, articulating down, and eventually reversing the pattern.","step":true,"m":"(5)","t":"The full Long Spine Massage progresses to opening the legs at the top, articulating down, and eventually reversing the pattern."}],"full":true,"id":51,"fam":[]},{"row":125,"apparatus":"Reformer","name":"Knee Stretch Knees Off","reps":"5-10 reps","setup":"Foot bar up. Continuation of Knee Stretch Round","springs":"2","instructions":[{"raw":"(0) Find the established Knee Stretch position with hands on the footbar, fingers and thumbs long, feet flexed against the shoulder blocks, and heels connected.","step":true,"m":"(0)","t":"Find the established Knee Stretch position with hands on the footbar, fingers and thumbs long, feet flexed against the shoulder blocks, and heels connected."},{"raw":"(1) Round the spine and shift the hips forward to just behind the line of the knees.","step":true,"m":"(1)","t":"Round the spine and shift the hips forward to just behind the line of the knees."},{"raw":"(2) Without moving the carriage, deepen the powerhouse and lift the knees to approximately ankle height.","step":true,"m":"(2)","t":"Without moving the carriage, deepen the powerhouse and lift the knees to approximately ankle height."},{"raw":"(3) Maintain the rounded shape and press the carriage halfway out through the legs.","step":true,"m":"(3)","t":"Maintain the rounded shape and press the carriage halfway out through the legs."},{"raw":"(4) Deepen the scoop to pull the carriage underneath you, keeping the knees lifted and upper body stable.","step":true,"m":"(4)","t":"Deepen the scoop to pull the carriage underneath you, keeping the knees lifted and upper body stable."},{"raw":"(5) Once finished, bring the carriage completely home and lower the knees with control before stepping off.","step":true,"m":"(5)","t":"Once finished, bring the carriage completely home and lower the knees with control before stepping off."}],"modifications":[{"raw":"(1) Revert to the previously learned Knee Stretch Knees Off Prep.","step":true,"m":"(1)","t":"Revert to the previously learned Knee Stretch Knees Off Prep."}],"cueing":[{"raw":"(1) Keep the shoulders stable over the hands as the legs move the carriage.","step":true,"m":"(1)","t":"Keep the shoulders stable over the hands as the legs move the carriage."},{"raw":"(2) Lift the knees from the lower abdominals rather than pushing up through the arms.","step":true,"m":"(2)","t":"Lift the knees from the lower abdominals rather than pushing up through the arms."},{"raw":"(3) Keep the heels connected to the shoulder blocks and press out through the heels.","step":true,"m":"(3)","t":"Keep the heels connected to the shoulder blocks and press out through the heels."},{"raw":"(4) Maintain the rounded spine and prevent the lower back from sagging as the carriage moves.","step":true,"m":"(4)","t":"Maintain the rounded spine and prevent the lower back from sagging as the carriage moves."},{"raw":"(5) Deepen the powerhouse to pull the carriage home underneath you.","step":true,"m":"(5)","t":"Deepen the powerhouse to pull the carriage home underneath you."},{"raw":"(6) Once established, find a swift, rhythmic movement without sacrificing the shape or control.","step":true,"m":"(6)","t":"Once established, find a swift, rhythmic movement without sacrificing the shape or control."},{"raw":"(7) Place the hands on either side of the client’s hips to support and reinforce the position of the pelvis.","step":true,"m":"(7)","t":"Place the hands on either side of the client’s hips to support and reinforce the position of the pelvis."},{"raw":"(8) Alternatively, place the hands lightly at the shoulders to cue relaxation and stability while the lower body moves.","step":true,"m":"(8)","t":"Alternatively, place the hands lightly at the shoulders to cue relaxation and stability while the lower body moves."}],"notes":[{"raw":"(1) The transition into Knees Off is important. From Knee Stretch Arched, initiate the change with the tailbone, then articulate through the lower abdominals, upper abdominals, and finally bring the shoulders forward before lifting the knees.","step":true,"m":"(1)","t":"The transition into Knees Off is important. From Knee Stretch Arched, initiate the change with the tailbone, then articulate through the lower abdominals, upper abdominals, and finally bring the shoulders forward before lifting the knees."},{"raw":"(2) Clients often skip this articulation and simply lift the knees. Establishing the rounded shape first helps the knees lift from the powerhouse rather than from tension in the shoulders or legs.","step":true,"m":"(2)","t":"Clients often skip this articulation and simply lift the knees. Establishing the rounded shape first helps the knees lift from the powerhouse rather than from tension in the shoulders or legs."},{"raw":"(3) The full Knees Off progresses the previously learned Prep by maintaining the hovering position while the carriage repeatedly moves out and underneath the body.","step":true,"m":"(3)","t":"The full Knees Off progresses the previously learned Prep by maintaining the hovering position while the carriage repeatedly moves out and underneath the body."},{"raw":"(4) As with the Beginner Knee Stretch Series, this is a safety exercise: when teaching a beginner or less-secure client, keep an instructor foot on the footbar to help ensure it remains secure.","step":true,"m":"(4)","t":"As with the Beginner Knee Stretch Series, this is a safety exercise: when teaching a beginner or less-secure client, keep an instructor foot on the footbar to help ensure it remains secure."}],"full":true,"id":52,"fam":[]},{"row":126,"apparatus":"Reformer","name":"Front Splits Standing + Kneeling","reps":"3-5 reps","setup":"Foot bar up. Client is either standing on floor or kneeling on carriage.","springs":"2","instructions":[{"raw":"Kneeling Front Splits","step":false,"m":"","t":"Kneeling Front Splits"},{"raw":"(0) Kneel facing the footbar with the back foot against the shoulder block and hands on the footbar; place the front foot at the center of the footbar with all five toes securely supported.","step":true,"m":"(0)","t":"Kneel facing the footbar with the back foot against the shoulder block and hands on the footbar; place the front foot at the center of the footbar with all five toes securely supported."},{"raw":"(1) Keeping the hips square, press the carriage out through the back heel as the front leg lengthens.","step":true,"m":"(1)","t":"Keeping the hips square, press the carriage out through the back heel as the front leg lengthens."},{"raw":"(2) Bend the front knee and resist the carriage home with control.","step":true,"m":"(2)","t":"Bend the front knee and resist the carriage home with control."},{"raw":"(3) With the carriage home, lift the spine tall and place the outside palm against the outside of the front knee.","step":true,"m":"(3)","t":"With the carriage home, lift the spine tall and place the outside palm against the outside of the front knee."},{"raw":"(4) Press the knee and palm into one another for stability as the opposite arm reaches up and over into a Mermaid-like side stretch.","step":true,"m":"(4)","t":"Press the knee and palm into one another for stability as the opposite arm reaches up and over into a Mermaid-like side stretch."},{"raw":"(5) Return with control and change sides.","step":true,"m":"(5)","t":"Return with control and change sides."},{"raw":"Standing Front Splits","step":false,"m":"","t":"Standing Front Splits"},{"raw":"(0) With both hands on the footbar, stand on the carriage facing forward; place the front foot securely at the center of the footbar and position the back foot against the inside seam of the shoulder block.","step":true,"m":"(0)","t":"With both hands on the footbar, stand on the carriage facing forward; place the front foot securely at the center of the footbar and position the back foot against the inside seam of the shoulder block."},{"raw":"(1) Keep the head heavy and hips low and square as you press the carriage out, lengthening the back leg.","step":true,"m":"(1)","t":"Keep the head heavy and hips low and square as you press the carriage out, lengthening the back leg."},{"raw":"(2) Resist the carriage home while maintaining the low pelvis and square hips.","step":true,"m":"(2)","t":"Resist the carriage home while maintaining the low pelvis and square hips."},{"raw":"(3) With the carriage completely home, lift the torso and arms to the ceiling, then take Genie Arms with the chest and gaze lifted.","step":true,"m":"(3)","t":"With the carriage completely home, lift the torso and arms to the ceiling, then take Genie Arms with the chest and gaze lifted."},{"raw":"(4) Keeping the hips square and back leg straight, press the carriage out from the standing position.","step":true,"m":"(4)","t":"Keeping the hips square and back leg straight, press the carriage out from the standing position."},{"raw":"(5) Resist the carriage home as the front knee bends, maintaining the lifted torso.","step":true,"m":"(5)","t":"Resist the carriage home as the front knee bends, maintaining the lifted torso."},{"raw":"(6) Return the hands to the footbar before changing sides with control.","step":true,"m":"(6)","t":"Return the hands to the footbar before changing sides with control."}],"modifications":[{"raw":"(1) Revert to the previously learned Scooter + Mermaid preparation to develop unilateral leg strength, pelvic stability, and the hip-opening pattern before progressing to Front Splits.","step":true,"m":"(1)","t":"Revert to the previously learned Scooter + Mermaid preparation to develop unilateral leg strength, pelvic stability, and the hip-opening pattern before progressing to Front Splits."},{"raw":"(2) Begin with Kneeling Front Splits before progressing to Standing Front Splits.","step":true,"m":"(2)","t":"Begin with Kneeling Front Splits before progressing to Standing Front Splits."},{"raw":"(3) In Standing Front Splits, keep both hands on the footbar rather than progressing to the upright Genie Arms variation until balance and carriage control are secure.","step":true,"m":"(3)","t":"In Standing Front Splits, keep both hands on the footbar rather than progressing to the upright Genie Arms variation until balance and carriage control are secure."},{"raw":"(4) Use a smaller carriage range if the hips begin to rotate, the back leg loses organization, or the client cannot control the springs home.","step":true,"m":"(4)","t":"Use a smaller carriage range if the hips begin to rotate, the back leg loses organization, or the client cannot control the springs home."}],"cueing":[{"raw":"(1) Keep both hip bones facing forward—range stops when the pelvis begins to rotate.","step":true,"m":"(1)","t":"Keep both hip bones facing forward—range stops when the pelvis begins to rotate."},{"raw":"(2) Reach actively through the back heel to lengthen the back leg and open the front of the hip.","step":true,"m":"(2)","t":"Reach actively through the back heel to lengthen the back leg and open the front of the hip."},{"raw":"(3) Keep all five toes of the front foot securely connected to the footbar.","step":true,"m":"(3)","t":"Keep all five toes of the front foot securely connected to the footbar."},{"raw":"(4) Think of the legs reaching away from one another while the powerhouse lifts in and up.","step":true,"m":"(4)","t":"Think of the legs reaching away from one another while the powerhouse lifts in and up."},{"raw":"(5) In Kneeling Front Splits, use the hand-to-knee connection to create opposition and stability before moving into the side stretch.","step":true,"m":"(5)","t":"In Kneeling Front Splits, use the hand-to-knee connection to create opposition and stability before moving into the side stretch."},{"raw":"(6) In Standing Front Splits, keep the hips heavy and low while the spine lengthens in opposition.","step":true,"m":"(6)","t":"In Standing Front Splits, keep the hips heavy and low while the spine lengthens in opposition."},{"raw":"(7) When progressing upright, lift from the powerhouse before removing the hands from the footbar; do not use momentum to find balance.","step":true,"m":"(7)","t":"When progressing upright, lift from the powerhouse before removing the hands from the footbar; do not use momentum to find balance."},{"raw":"(8) Keep the back leg active and straight during the standing variation rather than sinking into the back hip.","step":true,"m":"(8)","t":"Keep the back leg active and straight during the standing variation rather than sinking into the back hip."}],"notes":[{"raw":"(1) Kneeling Front Splits provides a more supported preparation for the Standing Front Splits by allowing the client to establish square hips, back-leg length, and carriage control with a lower center of gravity.","step":true,"m":"(1)","t":"Kneeling Front Splits provides a more supported preparation for the Standing Front Splits by allowing the client to establish square hips, back-leg length, and carriage control with a lower center of gravity."},{"raw":"(2) Standing Front Splits significantly increases the balance and stability demand. The hands-on-footbar version should be secure before progressing to the upright Genie Arms variation.","step":true,"m":"(2)","t":"Standing Front Splits significantly increases the balance and stability demand. The hands-on-footbar version should be secure before progressing to the upright Genie Arms variation."},{"raw":"(3) The goal is not the largest possible split. Square hips, an active back leg, secure foot placement, and control of the moving carriage take priority over range.","step":true,"m":"(3)","t":"The goal is not the largest possible split. Square hips, an active back leg, secure foot placement, and control of the moving carriage take priority over range."},{"raw":"(4) Safety: Bring the carriage completely home and establish control before lifting the hands from the footbar, changing sides, or dismounting.","step":true,"m":"(4)","t":"Safety: Bring the carriage completely home and establish control before lifting the hands from the footbar, changing sides, or dismounting."},{"raw":"(5) For the standing version, a controlled step transition is preferable when a client is not completely secure with the jumping foot change.","step":true,"m":"(5)","t":"For the standing version, a controlled step transition is preferable when a client is not completely secure with the jumping foot change."}],"full":true,"id":53,"fam":[]},{"row":127,"apparatus":"Reformer","name":"Side Splits Using Box Mod","reps":"5-10 reps","setup":"Box is placed short ways on reformer. Foot bar down.","springs":"1and2","instructions":[{"raw":"(0) Lower the footbar and place the box in Short Box position, either in front of or between the shoulder blocks according to the client’s height and available range; place one sticky pad on the carriage beside the box and another on the wooden frame.","step":true,"m":"(0)","t":"Lower the footbar and place the box in Short Box position, either in front of or between the shoulder blocks according to the client’s height and available range; place one sticky pad on the carriage beside the box and another on the wooden frame."},{"raw":"(1) Stand on the carriage, place the outside foot securely on the sticky pad on the wooden frame, then heel-toe the carriage foot outward to its sticky pad; extend the arms to the side walls.","step":true,"m":"(1)","t":"Stand on the carriage, place the outside foot securely on the sticky pad on the wooden frame, then heel-toe the carriage foot outward to its sticky pad; extend the arms to the side walls."},{"raw":"(2) Keeping the torso tall and pelvis organized, press the carriage out in one controlled motion.","step":true,"m":"(2)","t":"Keeping the torso tall and pelvis organized, press the carriage out in one controlled motion."},{"raw":"(3) Hold the position with both legs active, then engage the inner thighs and resist the carriage completely home.","step":true,"m":"(3)","t":"Hold the position with both legs active, then engage the inner thighs and resist the carriage completely home."},{"raw":"(4) To transition, heel-toe the carriage foot back toward the frame foot, carefully step down, turn to face the opposite side wall, and repeat.","step":true,"m":"(4)","t":"To transition, heel-toe the carriage foot back toward the frame foot, carefully step down, turn to face the opposite side wall, and repeat."}],"modifications":[{"raw":"(1) Position the box to limit how far the carriage can travel and choose the placement that best accommodates the client’s height, flexibility, and control.","step":true,"m":"(1)","t":"Position the box to limit how far the carriage can travel and choose the placement that best accommodates the client’s height, flexibility, and control."},{"raw":"(2) Begin with a narrower stance and smaller carriage range, gradually increasing the distance only as the client demonstrates control.","step":true,"m":"(2)","t":"Begin with a narrower stance and smaller carriage range, gradually increasing the distance only as the client demonstrates control."},{"raw":"(3) The instructor may provide a stable hand for balance during the initial setup and transition without pulling or moving the client into greater range.","step":true,"m":"(3)","t":"The instructor may provide a stable hand for balance during the initial setup and transition without pulling or moving the client into greater range."}],"cueing":[{"raw":"(1) Root evenly through both feet and maintain full contact with each sticky pad.","step":true,"m":"(1)","t":"Root evenly through both feet and maintain full contact with each sticky pad."},{"raw":"(2) Grow tall through the crown of the head as the legs reach away from one another.","step":true,"m":"(2)","t":"Grow tall through the crown of the head as the legs reach away from one another."},{"raw":"(3) Keep the pelvis level and facing forward rather than shifting or rotating toward one leg.","step":true,"m":"(3)","t":"Keep the pelvis level and facing forward rather than shifting or rotating toward one leg."},{"raw":"(4) Press the carriage out from the outer hips and legs; draw it home through the inner thighs and powerhouse.","step":true,"m":"(4)","t":"Press the carriage out from the outer hips and legs; draw it home through the inner thighs and powerhouse."},{"raw":"(5) Think of both legs working equally—the frame leg is active even though it is not moving.","step":true,"m":"(5)","t":"Think of both legs working equally—the frame leg is active even though it is not moving."},{"raw":"(6) Keep the knees tracking in line with the toes rather than allowing them to roll inward.","step":true,"m":"(6)","t":"Keep the knees tracking in line with the toes rather than allowing them to roll inward."},{"raw":"(7) Maintain lift through the powerhouse as the legs widen underneath you.","step":true,"m":"(7)","t":"Maintain lift through the powerhouse as the legs widen underneath you."},{"raw":"(8) Resist the carriage all the way home; do not allow the springs to snap the legs together.","step":true,"m":"(8)","t":"Resist the carriage all the way home; do not allow the springs to snap the legs together."}],"notes":[{"raw":"(1) The box acts as a range limiter and preparation for the full Side Splits, allowing the client to experience the standing split while controlling how far the carriage can open.","step":true,"m":"(1)","t":"The box acts as a range limiter and preparation for the full Side Splits, allowing the client to experience the standing split while controlling how far the carriage can open."},{"raw":"(2) Box placement may change according to the client’s proportions and flexibility. The goal is a useful, controllable range rather than maximizing the width of the split.","step":true,"m":"(2)","t":"Box placement may change according to the client’s proportions and flexibility. The goal is a useful, controllable range rather than maximizing the width of the split."},{"raw":"(3) Sticky pads are important for secure foot placement on both the moving carriage and stationary frame.","step":true,"m":"(3)","t":"Sticky pads are important for secure foot placement on both the moving carriage and stationary frame."},{"raw":"(4) Safety: Establish the frame foot securely before heel-toeing the carriage foot outward. When finishing, bring the carriage completely home and narrow the stance before stepping off.","step":true,"m":"(4)","t":"Safety: Establish the frame foot securely before heel-toeing the carriage foot outward. When finishing, bring the carriage completely home and narrow the stance before stepping off."},{"raw":"(5) Avoid jumping between sides. Step down, turn around, and deliberately rebuild the setup on the second side.","step":true,"m":"(5)","t":"Avoid jumping between sides. Step down, turn around, and deliberately rebuild the setup on the second side."},{"raw":"(6) The opening and closing should remain controlled throughout. If the client cannot resist the carriage home through the inner thighs, reduce the range before progressing.","step":true,"m":"(6)","t":"The opening and closing should remain controlled throughout. If the client cannot resist the carriage home through the inner thighs, reduce the range before progressing."}],"full":true,"id":54,"fam":[]},{"row":128,"apparatus":"Reformer","name":"Jumpboard - Footwork","reps":"10-20 reps","setup":"Jumpboard securly attached. Head rest up.","springs":"1and2","instructions":[{"raw":"(0) Install the Jumpboard securely and lie supine with the headrest lifted and feet on the platform in Pilates stance.","step":true,"m":"(0)","t":"Install the Jumpboard securely and lie supine with the headrest lifted and feet on the platform in Pilates stance."},{"raw":"(1) From the powerhouse, press the carriage out to straight legs.","step":true,"m":"(1)","t":"From the powerhouse, press the carriage out to straight legs."},{"raw":"(2) Keeping the legs straight, lift the heels and then roll through the balls of the feet until the feet leave the platform.","step":true,"m":"(2)","t":"Keeping the legs straight, lift the heels and then roll through the balls of the feet until the feet leave the platform."},{"raw":"(3) Reverse the articulation to land: balls of the feet first, then lower the heels with control.","step":true,"m":"(3)","t":"Reverse the articulation to land: balls of the feet first, then lower the heels with control."},{"raw":"(4) Keeping the heels connected to the platform, resist the carriage home only as far as the heels can remain down.","step":true,"m":"(4)","t":"Keeping the heels connected to the platform, resist the carriage home only as far as the heels can remain down."}],"modifications":[{"raw":"(1) Practice the movement without allowing the feet to leave the Jumpboard, working only through the heel lift and controlled lowering.","step":true,"m":"(1)","t":"Practice the movement without allowing the feet to leave the Jumpboard, working only through the heel lift and controlled lowering."},{"raw":"(2) Use a smaller carriage range if the heels cannot remain connected as the carriage returns.","step":true,"m":"(2)","t":"Use a smaller carriage range if the heels cannot remain connected as the carriage returns."}],"cueing":[{"raw":"(1) Initiate the press from the powerhouse rather than simply pushing from the feet.","step":true,"m":"(1)","t":"Initiate the press from the powerhouse rather than simply pushing from the feet."},{"raw":"(2) Keep the legs long as you articulate sequentially through the feet: heels → balls of feet → off; balls of feet → heels → in.","step":true,"m":"(2)","t":"Keep the legs long as you articulate sequentially through the feet: heels → balls of feet → off; balls of feet → heels → in."},{"raw":"(3) Maintain Pilates stance and connection through the inner thighs throughout.","step":true,"m":"(3)","t":"Maintain Pilates stance and connection through the inner thighs throughout."},{"raw":"(4) Keep the pelvis heavy and stable against the carriage as the feet articulate.","step":true,"m":"(4)","t":"Keep the pelvis heavy and stable against the carriage as the feet articulate."},{"raw":"(5) Reach evenly through both legs so one foot does not leave or return to the platform before the other.","step":true,"m":"(5)","t":"Reach evenly through both legs so one foot does not leave or return to the platform before the other."},{"raw":"(6) Think of lengthening through the crown of the head and out through the legs rather than compressing into the Jumpboard.","step":true,"m":"(6)","t":"Think of lengthening through the crown of the head and out through the legs rather than compressing into the Jumpboard."},{"raw":"(7) On the landing, articulate quietly through the feet rather than dropping the heels onto the platform.","step":true,"m":"(7)","t":"On the landing, articulate quietly through the feet rather than dropping the heels onto the platform."}],"notes":[{"raw":"(1) This exercise prepares the foot and ankle articulation needed for later Jumpboard jumping while allowing the client to establish control before adding greater flight and impact.","step":true,"m":"(1)","t":"This exercise prepares the foot and ankle articulation needed for later Jumpboard jumping while allowing the client to establish control before adding greater flight and impact."},{"raw":"(2) The sequence through the foot is important: the heels leave first and the balls of the feet leave last; on the return, the balls of the feet land first and the heels lower last.","step":true,"m":"(2)","t":"The sequence through the foot is important: the heels leave first and the balls of the feet leave last; on the return, the balls of the feet land first and the heels lower last."},{"raw":"(3) Only bring the carriage in as far as the heels can remain grounded. If the heels lift as the knees bend, the carriage has traveled too far home.","step":true,"m":"(3)","t":"Only bring the carriage in as far as the heels can remain grounded. If the heels lift as the knees bend, the carriage has traveled too far home."},{"raw":"(4) Safety: Confirm the Jumpboard is fully seated and secure before the client begins the exercise.","step":true,"m":"(4)","t":"Safety: Confirm the Jumpboard is fully seated and secure before the client begins the exercise."}],"full":true,"id":55,"fam":["Footwork"]},{"row":156,"apparatus":"Cadillac","name":"Roll Back Bar w One Arm Stretch","reps":"1 each side","setup":"","springs":"","instructions":[{"raw":"(0) From the established Roll Down setup, place one hand at the center of the Roll Back Bar with a firm grip; opposite arm wraps across the ribcage. Keep the bar level.","step":true,"m":"(0)","t":"From the established Roll Down setup, place one hand at the center of the Roll Back Bar with a firm grip; opposite arm wraps across the ribcage. Keep the bar level."},{"raw":"(1) Chin to chest and articulate down bone by bone until the head lands.","step":true,"m":"(1)","t":"Chin to chest and articulate down bone by bone until the head lands."},{"raw":"(2) Sweep the free arm overhead and across toward the opposite side of the mat, creating a long crescent through the side body.","step":true,"m":"(2)","t":"Sweep the free arm overhead and across toward the opposite side of the mat, creating a long crescent through the side body."},{"raw":"(3) Cross the same-side ankle over the opposite ankle and reach it beyond the vertical pole to deepen the stretch.","step":true,"m":"(3)","t":"Cross the same-side ankle over the opposite ankle and reach it beyond the vertical pole to deepen the stretch."},{"raw":"(4) Uncross the legs and return each foot to its vertical pole.","step":true,"m":"(4)","t":"Uncross the legs and return each foot to its vertical pole."},{"raw":"(5) Return the torso to center and wrap the free arm around the ribcage.","step":true,"m":"(5)","t":"Return the torso to center and wrap the free arm around the ribcage."},{"raw":"(6) Chin to chest and articulate back up to sitting.","step":true,"m":"(6)","t":"Chin to chest and articulate back up to sitting."},{"raw":"(7) Change sides.","step":true,"m":"(7)","t":"Change sides."}],"modifications":[{"raw":"(1) Keep both heels at their vertical poles and squeeze the legs together rather than crossing the ankle.","step":true,"m":"(1)","t":"Keep both heels at their vertical poles and squeeze the legs together rather than crossing the ankle."}],"cueing":[{"raw":"(1) Keep the Roll Back Bar level throughout.","step":true,"m":"(1)","t":"Keep the Roll Back Bar level throughout."},{"raw":"(2) Maintain a firm one-handed grip and articulate every vertebra.","step":true,"m":"(2)","t":"Maintain a firm one-handed grip and articulate every vertebra."},{"raw":"(3) Reach the arm and leg away from each other to lengthen the entire side body.","step":true,"m":"(3)","t":"Reach the arm and leg away from each other to lengthen the entire side body."},{"raw":"(4) Instructor may stabilize the bar from the front if one-handed control is challenging.","step":true,"m":"(4)","t":"Instructor may stabilize the bar from the front if one-handed control is challenging."},{"raw":"(5) From the side, guide the ribs or reaching leg to encourage length through the crescent.","step":true,"m":"(5)","t":"From the side, guide the ribs or reaching leg to encourage length through the crescent."}],"notes":[{"raw":"(1) Progresses the Beginner Roll Down by adding u "(8)","t":"Reverse the circles."},{"raw":"Tricep Press","step":false,"m":"","t":"Tricep Press"},{"raw":"(9) Adjust body position as needed. Bend elbows onto mat, hugging them toward the midline.","step":true,"m":"(9)","t":"Adjust body position as needed. Bend elbows onto mat, hugging them toward the midline."},{"raw":"(10) Inhale, press forearms down, straightening the arms.","step":true,"m":"(10)","t":"Inhale, press forearms down, straightening the arms."},{"raw":"(11) Exhale, resist back to the bent-elbow position.","step":true,"m":"(11)","t":"Exhale, resist back to the bent-elbow position."}],"modifications":[{"raw":"(1) Use lighter arm springs to decrease resistance.","step":true,"m":"(1)","t":"Use lighter arm springs to decrease resistance."},{"raw":"(2) Substitute 1–2 lb hand weights to practice the movement without spring tension.","step":true,"m":"(2)","t":"Substitute 1–2 lb hand weights to practice the movement without spring tension."}],"cueing":[{"raw":"(1) Anchor the shoulders and keep collarbones wide.","step":true,"m":"(1)","t":"Anchor the shoulders and keep collarbones wide."},{"raw":"(2) Maintain a quiet ribcage and connected powerhouse.","step":true,"m":"(2)","t":"Maintain a quiet ribcage and connected powerhouse."},{"raw":"(3) Reach long through the arms rather than forcing the springs down.","step":true,"m":"(3)","t":"Reach long through the arms rather than forcing the springs down."},{"raw":"(4) Keep equal tension through both springs.","step":true,"m":"(4)","t":"Keep equal tension through both springs."},{"raw":"(5) Tricep Press: keep elbows narrow and anchored.","step":true,"m":"(5)","t":"Tricep Press: keep elbows narrow and anchored."}],"notes":[{"raw":"(1) Adjust the client’s distance from the tower for appropriate spring tension.","step":true,"m":"(1)","t":"Adjust the client’s distance from the tower for appropriate spring tension."},{"raw":"(2) Tricep Press may require a different body position from the other exercises.","step":true,"m":"(2)","t":"Tricep Press may require a different body position from the other exercises."},{"raw":"(3) Keep the pelvis, ribcage, and spine stable throughout the series.","step":true,"m":"(3)","t":"Keep the pelvis, ribcage, and spine stable throughout the series."}],"full":true,"id":57,"fam":[]},{"row":158,"apparatus":"Cadillac","name":"Leg Spring Series (Frog, med circles, Walking, beats, wraps, scissors, bicycle (parallel or turned out))","reps":"5-10 each","setup":"","springs":"","instructions":[{"raw":"(0) Lie supine with both feet in leg springs. Hold vertical poles with hands at least above shoulder level; elbows bent for more support or arms straight for greater challenge.","step":true,"m":"(0)","t":"Lie supine with both feet in leg springs. Hold vertical poles with hands at least above shoulder level; elbows bent for more support or arms straight for greater challenge."},{"raw":"Frog","step":false,"m":"","t":"Frog"},{"raw":"(1) Bend knees toward chest in Pilates stance, heels together, toes apart, knees no wider than shoulders.","step":true,"m":"(1)","t":"Bend knees toward chest in Pilates stance, heels together, toes apart, knees no wider than shoulders."},{"raw":"(2) Press legs out to a 45° diagonal.","step":true,"m":"(2)","t":"Press legs out to a 45° diagonal."},{"raw":"(3) Resist the springs and bend back into Frog.","step":true,"m":"(3)","t":"Resist the springs and bend back into Frog."},{"raw":"Little Walking","step":false,"m":"","t":"Little Walking"},{"raw":"(4) Extend both legs to ceiling.","step":true,"m":"(4)","t":"Extend both legs to ceiling."},{"raw":"(5) Walk one foot past the other down toward a low hover.","step":true,"m":"(5)","t":"Walk one foot past the other down toward a low hover."},{"raw":"(6) Walk the legs back up to ceiling.","step":true,"m":"(6)","t":"Walk the legs back up to ceiling."},{"raw":"Big Scissors","step":false,"m":"","t":"Big Scissors"},{"raw":"(7) Begin with both legs to ceiling.","step":true,"m":"(7)","t":"Begin with both legs to ceiling."},{"raw":"(8) Press one leg down toward the mat as the opposite leg stays lifted.","step":true,"m":"(8)","t":"Press one leg down toward the mat as the opposite leg stays lifted."},{"raw":"(9) Scissor-switch the legs, maintaining tension on both springs.","step":true,"m":"(9)","t":"Scissor-switch the legs, maintaining tension on both springs."},{"raw":"Stabilization","step":false,"m":"","t":"Stabilization"},{"raw":"(10) Extend both legs long to a low diagonal and hold.","step":true,"m":"(10)","t":"Extend both legs long to a low diagonal and hold."},{"raw":"(11) Lower one leg toward the mat and return; alternate legs while maintaining the position of the opposite leg.","step":true,"m":"(11)","t":"Lower one leg toward the mat and return; alternate legs while maintaining the position of the opposite leg."},{"raw":"Beats","step":false,"m":"","t":"Beats"},{"raw":"(12) Extend from Frog to a 45° diagonal or higher as needed.","step":true,"m":"(12)","t":"Extend from Frog to a 45° diagonal or higher as needed."},{"raw":"(13) Beat the heels together with quick, controlled movements.","step":true,"m":"(13)","t":"Beat the heels together with quick, controlled movements."},{"raw":"(14) Bend the knees and resist back into Frog.","step":true,"m":"(14)","t":"Bend the knees and resist back into Frog."},{"raw":"Criss Cross Wraps","step":false,"m":"","t":"Criss Cross Wraps"},{"raw":"(15) Extend from Frog to a diagonal with slight external rotation.","step":true,"m":"(15)","t":"Extend from Frog to a diagonal with slight external rotation."},{"raw":"(16) Cross one inner thigh over the other, alternating the cross.","step":true,"m":"(16)","t":"Cross one inner thigh over the other, alternating the cross."},{"raw":"(17) Bend the knees and resist back into Frog.","step":true,"m":"(17)","t":"Bend the knees and resist back into Frog."},{"raw":"(18) Finish with a Prayer Frog Stretch.","step":true,"m":"(18)","t":"Finish with a Prayer Frog Stretch."},{"raw":"Circles","step":false,"m":"","t":"Circles"},{"raw":"(19) Extend both legs to ceiling.","step":true,"m":"(19)","t":"Extend both legs to ceiling."},{"raw":"(20) Open legs approximately mat-width, press down, bring legs together, and circle back up.","step":true,"m":"(20)","t":"Open legs approximately mat-width, press down, bring legs together, and circle back up."},{"raw":"(21) Reverse the circles.","step":true,"m":"(21)","t":"Reverse the circles."},{"raw":"One Leg Bicycle","step":false,"m":"","t":"One Leg Bicycle"},{"raw":"(22) Remove one foot from its spring and place that foot on the mat.","step":true,"m":"(22)","t":"Remove one foot from its spring and place that foot on the mat."},{"raw":"(23) Reach the spring leg out to a 45° diagonal, lower it toward the mat, drag the heel toward the seat, then draw the knee into the chest.","step":true,"m":"(23)","t":"Reach the spring leg out to a 45° diagonal, lower it toward the mat, drag the heel toward the seat, then draw the knee into the chest."},{"raw":"(24) Continue the bicycle and change sides.","step":true,"m":"(24)","t":"Continue the bicycle and change sides."},{"raw":"Bicycle","step":false,"m":"","t":"Bicycle"},{"raw":"(25) Begin with both legs to ceiling, parallel or slightly turned out.","step":true,"m":"(25)","t":"Begin with both legs to ceiling, parallel or slightly turned out."},{"raw":"(26) Lower one straight leg as the opposite knee bends into the chest and extends toward the ceiling.","step":true,"m":"(26)","t":"Lower one straight leg as the opposite knee bends into the chest and extends toward the ceiling."},{"raw":"(27) Continue alternating in a bicycle motion.","step":true,"m":"(27)","t":"Continue alternating in a bicycle motion."},{"raw":"(28) Reverse direction.","step":true,"m":"(28)","t":"Reverse direction."}],"modifications":[{"raw":"(1) Use lighter leg springs.","step":true,"m":"(1)","t":"Use lighter leg springs."},{"raw":"(2) For significant knee hyperextension, position the straps just above the knees as appropriate.","ste .","step":true,"m":"(4)","t":"Maintain tension on the springs throughout—avoid letting them go slack."}],"full":true,"id":58,"fam":["Scissors","Bicycle","Beats","Walking"]},{"row":159,"apparatus":"Cadillac","name":"Side Leg Spring Series :","reps":"5-10 each","setup":"","springs":"","instructions":[{"raw":"(0) Set up as in the Mat Side Kick Series. Bottom hand holds the vertical pole; opposite hand presses into the mat in front of the chest. Place the front leg spring on the top foot.","step":true,"m":"(0)","t":"Set up as in the Mat Side Kick Series. Bottom hand holds the vertical pole; opposite hand presses into the mat in front of the chest. Place the front leg spring on the top foot."},{"raw":"Front / Back","step":false,"m":"","t":"Front / Back"},{"raw":"(1) With legs straight and parallel, lengthen the top leg to hip height.","step":true,"m":"(1)","t":"With legs straight and parallel, lengthen the top leg to hip height."},{"raw":"(2) Kick forward twice, reaching closer toward the chest with each kick.","step":true,"m":"(2)","t":"Kick forward twice, reaching closer toward the chest with each kick."},{"raw":"(3) Sweep and lengthen the leg behind you.","step":true,"m":"(3)","t":"Sweep and lengthen the leg behind you."},{"raw":"Lower / Lift","step":false,"m":"","t":"Lower / Lift"},{"raw":"(4) With legs straight and parallel, lengthen the top leg to hip height.","step":true,"m":"(4)","t":"With legs straight and parallel, lengthen the top leg to hip height."},{"raw":"(5) Lower the leg with control, then lift back to hip height.","step":true,"m":"(5)","t":"Lower the leg with control, then lift back to hip height."},{"raw":"(6) Repeat with the top leg turned out.","step":true,"m":"(6)","t":"Repeat with the top leg turned out."},{"raw":"Small Circles","step":false,"m":"","t":"Small Circles"},{"raw":"(7) Externally rotate the top leg and lengthen it long.","step":true,"m":"(7)","t":"Externally rotate the top leg and lengthen it long."},{"raw":"(8) Draw small circles, brushing the heels together each time like striking a match.","step":true,"m":"(8)","t":"Draw small circles, brushing the heels together each time like striking a match."},{"raw":"(9) Reverse direction.","step":true,"m":"(9)","t":"Reverse direction."},{"raw":"Fish Tail","step":false,"m":"","t":"Fish Tail"},{"raw":"(10) Bring straight legs together, squeezing the heels.","step":true,"m":"(10)","t":"Bring straight legs together, squeezing the heels."},{"raw":"(11) Lift both legs together, hold for two counts, then lower with control.","step":true,"m":"(11)","t":"Lift both legs together, hold for two counts, then lower with control."},{"raw":"(12) Repeat the series on the other side.","step":true,"m":"(12)","t":"Repeat the series on the other side."}],"modifications":[{"raw":"(1) Revert to Side Kick Series without springs.","step":true,"m":"(1)","t":"Revert to Side Kick Series without springs."}],"cueing":[{"raw":"(1) Use the same alignment and powerhouse connection established in Mat Side Kick Series.","step":true,"m":"(1)","t":"Use the same alignment and powerhouse connection established in Mat Side Kick Series."},{"raw":"(2) Reach the spring leg long out of the hip rather than letting the spring pull the pelvis.","step":true,"m":"(2)","t":"Reach the spring leg long out of the hip rather than letting the spring pull the pelvis."},{"raw":"(3) Keep the trunk quiet as the leg moves against resistance.","step":true,"m":"(3)","t":"Keep the trunk quiet as the leg moves against resistance."},{"raw":"(4) Front / Back: maintain length through the waist as the leg reaches behind.","step":true,"m":"(4)","t":"Front / Back: maintain length through the waist as the leg reaches behind."},{"raw":"(5) Fish Tail: squeeze inner thighs and lift both legs as one unit.","step":true,"m":"(5)","t":"Fish Tail: squeeze inner thighs and lift both legs as one unit."}],"notes":[{"raw":"(1) Progression of the familiar Mat Side Kick Series with added spring resistance.","step":true,"m":"(1)","t":"Prog <script>
window.POWERHOUSE_VERSION = "2026.11.03-1afc2d";
window.POWERHOUSE_SITE = true;
const DATA = JSON.parse(document.getElementById('pp-data').textContent);
/* Powerhouse engine: pure functions over DATA and a progress-state object. No DOM access here.
   Every question is built only from text that is in the sheet. */
const Engine = (function () {
  'use strict';
  const APPS = DATA.apparatus.map(a => a.name);
  const APP_INFO = Object.fromEntries(DATA.apparatus.map(a => [a.name, a]));
  const EX = DATA.exercises;
  const FULL = EX.filter(e => e.full);                       // exercises with instructions: the ones sessions use
  const BY_ID = new Map(EX.map(e => [e.id, e]));
  const BY_APP = new Map(APPS.map(a => [a, EX.filter(e => e.apparatus === a)]));
  const FULL_BY_APP = new Map(APPS.map(a => [a, FULL.filter(e => e.apparatus === a)]));
  const FAMILIES = DATA.families || [];
  const FAM = new Map(FAMILIES.map(f => [f.name, f]));
  const famsOf = e => (e.fam || []).map(n => FAM.get(n)).filter(Boolean);
  const steps = e => e.instructions.filter(l => l.step);
  const T = k => k.map(l => l.t);

  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const baseName = e => e.name.replace(/\(.*?\)/g, '').split(/ - |:|\//)[0].trim();
  const NAME_APPS = new Map();
  for (const e of EX) {
    const k = norm(e.name);
    if (!NAME_APPS.has(k)) NAME_APPS.set(k, new Set());
    NAME_APPS.get(k).add(e.apparatus);
  }

  // ---------- text similarity (keeps distractors from being plausible answers) ----------
  const STOP = new Set(('a an the and or of to in on at for with by from as is are be it its into onto over under up ' +
    'down out off your you this that these those than then there their them they not no nor so if while each both one ' +
    'two three per keep stays stay before after through toward towards away all any more less only just also can will ' +
    'should must does let use using client clients the').split(' '));
  const words = s => norm(s).split(' ').filter(w => w.length > 2 && !STOP.has(w));
  const textOf = e => [e.name, e.setup, e.springs, ...T(e.instructions), ...T(e.cueing), ...T(e.modifications), ...T(e.notes)];
  const BAG = new Map(EX.map(e => [e.id, new Set(textOf(e).flatMap(words))]));
  const DF = new Map();
  for (const b of BAG.values()) for (const w of b) DF.set(w, (DF.get(w) || 0) + 1);
  const idf = w => Math.log((EX.length + 1) / ((DF.get(w) || 0) + 1));
  /** IDF-weighted share of the distinctive words in `s` that also occur in `bag` (0..1). */
  function overlap(s, bag) {
    let tot = 0, hit = 0;
    for (const w of new Set(words(s))) { const v = idf(w); tot += v; if (bag.has(w)) hit += v; }
    return tot ? hit / tot : 1;
  }

  // ---------- randomness ----------
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /** n distinct strings, from `primary` first then `secondary`; skips anything equal to, containing,
   *  or contained in an excluded string, and anything failing ok(). */
  function choose(primary, secondary, n, exclude, ok) {
    const seen = exclude.map(norm);
    const clash = k => seen.some(s => s === k || (s.length > 10 && k.length > 10 && (s.includes(k) || k.includes(s))));
    const out = [];
    for (const list of [primary, secondary]) {
      for (const c of shuffle(list.slice())) {
        if (out.length === n) return out;
        const k = norm(c);
        if (!k || clash(k) || (ok && !ok(c))) continue;
        seen.push(k);
        out.push(c);
      }
    }
    return out;
  }

  const others = e => FULL_BY_APP.get(e.apparatus).filter(x => x.id !== e.id);
  const elsewhere = e => FULL.filter(x => x.apparatus !== e.apparatus);
  const nontrivial = s => s.length >= 20 && !/^repeat\b/i.test(s);

  function mc(type, e, prompt, correct, wrong, extra) {
    if (wrong.length < 3) return null;
    const options = shuffle([correct, ...wrong.slice(0, 3)]);
    return Object.assign({ kind: 'mc', type, exId: e.id, prompt, options, answer: options.indexOf(correct) }, extra || {});
  }

  function linePick(e, type, field, q) {
    if (!e[field].length) return null;
    const c = pick(e[field]).t;
    const ok = d => overlap(d, BAG.get(e.id)) < 0.5;
    const wrong = choose(others(e).flatMap(x => T(x[field])), elsewhere(e).flatMap(x => T(x[field])), 3, T(e[field]), ok);
    return mc(type, e, { q, name: e.name }, c, wrong, { long: true });
  }

  /** Two or three consecutive instruction steps that do not give the exercise's name away. */
  function excerpt(e) {
    const all = steps(e);
    const st = all.filter(l => nontrivial(l.t)).length >= 2 ? all.filter(l => nontrivial(l.t)) : all;
    const key = baseName(e).toLowerCase();
    const wins = [];
    for (let n = 3; n >= 2; n--) for (let i = 0; i + n <= st.length; i++) wins.push(st.slice(i, i + n));
    const clean = wins.filter(w => !w.some(l => key.length > 3 && l.t.toLowerCase().includes(key)));
    const w = clean.length ? pick(clean) : null;
    if (w) return w.map(l => l.t);
    if (!st.length) return null;
    const re = new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
    return st.slice(0, 2).map(l => l.t.replace(re, '____'));
  }

  // ---------- question generators (text comes only from the sheet) ----------
  const GEN = {
    apparatus(e) {
      if (NAME_APPS.get(norm(e.name)).size > 1) return null;
      const wrong = choose(APPS.filter(a => a !== e.apparatus), [], 3, [e.apparatus]);
      return mc('apparatus', e, { q: 'Which apparatus is this exercise on?', name: e.name }, e.apparatus, wrong, { hideApp: true });
    },
    reps(e) {
      if (!e.reps) return null;
      const wrong = choose(others(e).map(x => x.reps), EX.map(x => x.reps), 3, [e.reps], Boolean);
      return mc('reps', e, { q: 'How many reps?', name: e.name }, e.reps, wrong);
    },
    setup(e) {
      if (!e.setup) return null;
      const wrong = choose(others(e).map(x => x.setup), EX.filter(x => x.apparatus === e.apparatus || x.full).map(x => x.setup), 3, [e.setup],
        d => d && overlap(d, BAG.get(e.id)) < 0.6);
      return mc('setup', e, { q: 'What is the set up?', name: e.name }, e.setup, wrong, { long: true });
    },
    springs(e) {
      if (!e.springs) return null;
      const wrong = choose(BY_APP.get(e.apparatus).map(x => x.springs), EX.map(x => x.springs), 3, [e.springs], Boolean);
      return mc('springs', e, { q: 'What are the springs?', name: e.name }, e.springs, wrong);
    },
    cue(e) { return linePick(e, 'cue', 'cueing', 'Which cue is from this exercise?'); },
    mods(e) { return linePick(e, 'mods', 'modifications', 'Which modification is from this exercise?'); },
    notes(e) { return linePick(e, 'notes', 'notes', 'Which note is from this exercise?'); },
    identify(e) {
      const ex = excerpt(e);
      if (!ex) return null;
      const pool = others(e).filter(x => overlap(ex.join(' '), BAG.get(x.id)) < 0.6).map(x => x.name);
      const wrong = choose(pool, elsewhere(e).map(x => x.name), 3, [e.name]);
      return mc('identify', e, { q: 'Which exercise are these instructions from?', lines: ex, hideApp: NAME_APPS.get(norm(e.name)).size > 1 ? false : true }, e.name, wrong, { names: true });
    },
    missing(e) {
      const st = steps(e);
      const idx = st.map((l, i) => i).filter(i => nontrivial(st[i].t));
      if (st.length < 3 || !idx.length) return null;
      const k = pick(idx);
      const c = st[k].t;
      const ok = d => nontrivial(d) && overlap(d, BAG.get(e.id)) < 0.6 && d.length > c.length * 0.4 && d.length < c.length * 2.5;
      const wrong = choose(others(e).flatMap(x => T(steps(x))), elsewhere(e).flatMap(x => T(steps(x))), 3, T(st), ok);
      return mc('missing', e, {
        q: 'Which step is missing?', name: e.name,
        context: { before: k > 0 ? st[k - 1].t : null, after: k < st.length - 1 ? st[k + 1].t : null, k, n: st.length },
      }, c, wrong, { long: true });
    },
    order(e) {
      const st = steps(e).filter(l => nontrivial(l.t));
      if (st.length < 3) return null;
      if (new Set(st.map(l => norm(l.t))).size !== st.length) return null;
      const n = Math.min(4, st.length);
      const start = rand(st.length - n + 1);
      const win = st.slice(start, start + n);
      const items = win.map((l, pos) => ({ t: l.t, pos }));
      let guard = 0;
      do { shuffle(items); } while (items.every((it, i) => it.pos === i) && guard++ < 12);
      return { kind: 'order', type: 'order', exId: e.id, items, prompt: { q: 'Put these steps in order.', name: e.name } };
    },
    recall(e) {
      const v = [{ q: 'Say the instructions out loud, step by step.', field: 'instructions' }];
      if (e.cueing.length) v.push({ q: 'Say two or three cues out loud.', field: 'cueing' });
      if (e.setup) v.push({ q: 'Say the set up out loud.', field: 'setup' });
      const x = pick(v);
      return { kind: 'recall', type: 'recall', exId: e.id, prompt: { q: x.q, name: e.name }, field: x.field };
    },
  };

  // ---------- cross-apparatus questions (the same exercise on different apparatus) ----------
  const famMembers = (f, notId) => f.members.map(id => BY_ID.get(id)).filter(x => x.id !== notId);
  const GENF = {
    famCount(e) {
      const fams = famsOf(e);
      if (!fams.length) return null;
      const f = pick(fams), c = String(f.apparatus.length);
      const wrong = choose(['1', '2', '3', '4', '5', '6'].filter(n => n !== c), [], 3, [c]);
      return mc('famCount', e, { q: `Across the intermediate exercises, how many apparatus have ${f.name}?`, name: f.name, hideApp: true },
        c, wrong, { hideApp: true, fam: f.name, explainFam: true });
    },
    famWhere(e) {
      const fams = famsOf(e);
      if (!fams.length) return null;
      const f = pick(fams);
      const c = pick(f.apparatus);
      const wrong = choose(APPS.filter(a => !f.apparatus.includes(a)), [], 3, [c]);
      return mc('famWhere', e, { q: `Which of these apparatus has ${f.name}?`, name: f.name, hideApp: true }, c, wrong, { hideApp: true, fam: f.name, explainFam: true });
    },
    famSetup(e) {
      const fams = famsOf(e);
      if (!fams.length) return null;
      const useSetup = !!e.setup, val = e.setup || e.springs;
      if (!val) return null;
      const f = pick(fams);
      const pool = famMembers(f, e.id).filter(x => x.apparatus !== e.apparatus).map(x => useSetup ? x.setup : x.springs).filter(Boolean);
      const more = EX.filter(x => x.id !== e.id).map(x => useSetup ? x.setup : x.springs).filter(Boolean);
      const wrong = choose(pool, more, 3, [val], d => !useSetup || overlap(d, BAG.get(e.id)) < 0.6);
      return mc('famSetup', e, { q: `On the ${e.apparatus}, ${useSetup ? 'what is the set up' : 'what are the springs'} for this ${f.name}?`, name: e.name }, val, wrong, { long: useSetup });
    },
    famWhich(e) {
      const fams = famsOf(e).filter(f => f.apparatus.length >= 2);
      if (!fams.length || !e.full) return null;
      const f = pick(fams);
      const st = steps(e).filter(l => nontrivial(l.t));
      if (st.length < 2) return null;
      const appWord = e.apparatus.toLowerCase();
      const clean = st.filter(l => !l.t.toLowerCase().includes(appWord));
      const src = clean.length >= 2 ? clean : st;
      const i = rand(Math.max(1, src.length - 1));
      const lines = src.slice(i, i + 2).map(l => l.t);
      const wrong = choose(f.apparatus.filter(a => a !== e.apparatus), APPS.filter(a => a !== e.apparatus), 3, [e.apparatus]);
      return mc('famWhich', e, { q: `These instructions are for ${f.name}. Which apparatus?`, lines, hideApp: true }, e.apparatus, wrong, { hideApp: true, names: true, fam: f.name });
    },
  };
  Object.assign(GEN, GENF);

  const TYPES = {
    apparatus: { label: 'Apparatus', xp: 8 },
    reps: { label: 'Reps', xp: 10 },
    setup: { label: 'Set up', xp: 12 },
    springs: { label: 'Springs', xp: 12 },
    identify: { label: 'Name it', xp: 10 },
    cue: { label: 'Cueing', xp: 12 },
    mods: { label: 'Modifications', xp: 14 },
    notes: { label: 'Notes', xp: 14 },
    missing: { label: 'Missing step', xp: 15 },
    order: { label: 'Step order', xp: 20 },
    recall: { label: 'Say it', xp: 15 },
    famCount: { label: 'How many apparatus', xp: 12 },
    famWhere: { label: 'Which apparatus', xp: 12 },
    famSetup: { label: 'Set up by apparatus', xp: 15 },
    famWhich: { label: 'Which apparatus', xp: 15 },
  };
  // Question mix by mastery stage: recognition first; sequencing and recall once an exercise is familiar.
  const TIERS = [
    ['identify', 'reps', 'setup', 'springs'],
    ['apparatus', 'identify', 'reps', 'setup', 'springs', 'cue', 'famWhere'],
    ['cue', 'mods', 'setup', 'springs', 'missing', 'identify', 'famCount', 'famSetup'],
    ['missing', 'order', 'cue', 'mods', 'notes', 'famWhich', 'famSetup'],
    ['order', 'recall', 'mods', 'notes', 'missing', 'famWhich', 'famCount'],
    ['order', 'recall', 'notes', 'cue', 'missing', 'famSetup', 'famWhere'],
  ];

  function makeQuestion(e, tier, opt) {
    opt = opt || {};
    const avoid = opt.avoid || new Set(), exclude = opt.exclude || new Set();
    const list = TIERS[Math.max(0, Math.min(5, tier))].filter(t => !exclude.has(t));
    const first = [...shuffle(list.filter(t => !avoid.has(t))), ...shuffle(list.filter(t => avoid.has(t)))];
    const rest = shuffle(Object.keys(GEN).filter(t => !exclude.has(t) && !list.includes(t)));
    for (const t of [...first, ...rest]) {
      const q = GEN[t](e);
      if (q) {
        q.label = TYPES[t].label;
        q.xp = TYPES[t].xp;
        q.id = Math.random().toString(36).slice(2, 10);
        return q;
      }
    }
    return null;
  }

  // ---------- mastery (Leitner-style spaced repetition) ----------
  const HOUR = 3600e3, DAY = 24 * HOUR;
  const INTERVAL = [0, 2 * HOUR, 20 * HOUR, 3 * DAY, 7 * DAY, 18 * DAY];
  const STAGES = ['New', 'Learning', 'Familiar', 'Solid', 'Strong', 'Mastered'];
  const box = (S, id) => (S.ex[id] ? S.ex[id].b : 0);
  const isDue = (S, id, now) => { const r = S.ex[id]; return !!r && r.b > 0 && r.d <= now; };

  /** result: 'ok' | 'partial' | 'miss'. Returns the stage before and after. */
  function grade(S, id, result, opt) {
    opt = opt || {};
    const now = opt.now || Date.now();
    const r = S.ex[id] || (S.ex[id] = { b: 0, d: 0, s: 0, c: 0, l: 0 });
    const before = r.b;
    r.s += 1;
    r.l = now;
    if (result === 'ok') {
      r.c += 1;
      if (opt.promote) r.b = Math.min(5, r.b + 1);
      else if (r.b === 0) r.b = 1;
      if (opt.promote || before === 0) r.d = now + INTERVAL[r.b];
    } else if (result === 'partial') {
      if (r.b === 0) r.b = 1;
      r.d = now + Math.max(HOUR, INTERVAL[r.b] / 2);
    } else {
      r.b = Math.max(1, r.b - 2);
      r.d = now + 10 * 60e3;
    }
    return { before, after: r.b };
  }

  // ---------- sessions ----------
  /** Interleave reviews with new exercises; each new one gets a learn card, an immediate question,
   *  and a consolidation question a little later. */
  function assemble(S, reviews, news) {
    const base = [];
    let ri = 0, ni = 0;
    while (ri < reviews.length || ni < news.length) {
      if (ri < reviews.length) { const r = reviews[ri++]; base.push({ kind: 'q', exId: r.e.id, tier: box(S, r.e.id), promote: r.promote }); }
      if (ni < news.length) { const e = news[ni++]; base.push({ kind: 'learn', exId: e.id }, { kind: 'q', exId: e.id, tier: 0, promote: true, fresh: true }); }
    }
    const out = [], waiting = [];
    for (const sp of base) {
      out.push(sp);
      if (sp.kind !== 'q') continue;
      if (sp.fresh) waiting.push({ id: sp.exId, wait: 3 });
      for (const w of waiting) w.wait--;
      while (waiting.length && waiting[0].wait <= 0) out.push({ kind: 'q', exId: waiting.shift().id, tier: 1, promote: false });
    }
    for (const w of waiting) out.push({ kind: 'q', exId: w.id, tier: 1, promote: false });
    return out;
  }

  const DAILY = { throttleAt: 24, throttleNew: 2, base: 12, surgeAt: 10, surge: 4 };
  function specsDaily(S, now, cfg) {
    cfg = Object.assign({}, DAILY, cfg || {});
    const focus = S.settings.focus;
    const scope = focus !== 'all' && FULL_BY_APP.has(focus) ? FULL_BY_APP.get(focus) : FULL;
    const due = FULL.filter(e => isDue(S, e.id, now)).sort((a, b) => S.ex[a.id].d - S.ex[b.id].d);
    const fresh = scope.filter(e => box(S, e.id) === 0);
    let nNew = Math.min(S.settings.newPer, fresh.length);
    if (due.length > cfg.throttleAt) nNew = Math.min(nNew, cfg.throttleNew);
    const nRev = Math.max(4, cfg.base - 2 * nNew) + (due.length > cfg.surgeAt ? cfg.surge : 0);
    const reviews = due.slice(0, nRev).map(e => ({ e, promote: true }));
    if (reviews.length + 2 * nNew < 8) {
      const have = new Set(reviews.map(r => r.e.id));
      const extra = FULL.filter(e => box(S, e.id) > 0 && !have.has(e.id))
        .sort((a, b) => box(S, a.id) - box(S, b.id) || S.ex[a.id].l - S.ex[b.id].l);
      for (const e of extra.slice(0, 8 - reviews.length - 2 * nNew)) reviews.push({ e, promote: false });
    }
    return assemble(S, reviews, fresh.slice(0, nNew));
  }

  function specsDrill(S, app, now) {
    const list = FULL_BY_APP.get(app) || [];
    const seen = list.filter(e => box(S, e.id) > 0)
      .sort((a, b) => (isDue(S, b.id, now) - isDue(S, a.id, now)) || box(S, a.id) - box(S, b.id));
    const fresh = list.filter(e => box(S, e.id) === 0);
    const nNew = Math.min(fresh.length, seen.length >= 8 ? 1 : 3);
    const reviews = seen.slice(0, Math.max(4, 10 - 2 * nNew)).map(e => ({ e, promote: isDue(S, e.id, now) }));
    return assemble(S, reviews, fresh.slice(0, nNew));
  }

  function specsExercise(S, id, now) {
    const b = box(S, id);
    const specs = b === 0
      ? [{ kind: 'learn', exId: id }, { kind: 'q', exId: id, tier: 0, promote: true, fresh: true }]
      : [{ kind: 'q', exId: id, tier: b, promote: isDue(S, id, now) }];
    for (const t of [2, 3, 4, 3]) specs.push({ kind: 'q', exId: id, tier: t, promote: false });
    return specs;
  }

  function challengeSpec(S, n, avoidId) {
    const seen = FULL.filter(e => box(S, e.id) > 0 && e.id !== avoidId);
    let e;
    if (seen.length >= 8 && Math.random() < 0.7) {
      const w = seen.map(x => 6 - box(S, x.id));
      let r = Math.random() * w.reduce((a, b) => a + b, 0);
      e = seen[w.findIndex(v => (r -= v) < 0)] || pick(seen);
    } else {
      do { e = pick(FULL); } while (e.id === avoidId && FULL.length > 1);
    }
    return { kind: 'q', exId: e.id, tier: Math.min(5, 1 + Math.floor(n / 4)), promote: null };
  }

  function specsExam(S, scope) {
    const list = scope === 'all' ? FULL : (FULL_BY_APP.get(scope) || FULL);
    const picks = [];
    let pool = shuffle(list.slice());
    while (picks.length < 20) {
      if (!pool.length) pool = shuffle(list.slice());
      picks.push(pool.pop());
    }
    return picks.map(e => ({ kind: 'q', exId: e.id, tier: 2 + rand(3), promote: null }));
  }

  /** Turn specs into concrete questions. Never repeats a question type for the same exercise in a session. */
  function materialize(specs, opt) {
    opt = opt || {};
    const out = [], usedBy = new Map(), used = new Set();
    let prev = opt.prev || null;
    for (const sp of specs) {
      if (sp.kind === 'learn') { out.push({ kind: 'learn', exId: sp.exId, id: 'L' + sp.exId }); continue; }
      const e = BY_ID.get(sp.exId);
      const mine = usedBy.get(e.id) || new Set();
      const avoid = new Set([...(opt.distinct ? used : []), ...mine, ...(prev ? [prev] : [])]);
      const q = makeQuestion(e, sp.tier, { avoid, exclude: opt.exclude });
      if (!q) continue;
      q.promote = sp.promote;
      q.fresh = !!sp.fresh;
      prev = q.type;
      used.add(q.type);
      mine.add(q.type);
      usedBy.set(e.id, mine);
      out.push(q);
    }
    return out;
  }

  // ---------- levels, days, streaks ----------
  const LV = [0, 150, 400, 800, 1400, 2200, 3300, 4800, 6800, 9500, 13000];
  function level(xp) {
    let i = 0;
    while (i + 1 < LV.length && xp >= LV[i + 1]) i++;
    return { n: i + 1, floor: LV[i], next: i + 1 < LV.length ? LV[i + 1] : null };
  }
  function dayKey(t) {
    const d = new Date(t);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function streak(S, now) {
    const d = new Date(now);
    const has = () => (S.days[dayKey(d.getTime())] || 0) > 0;
    if (!has()) d.setDate(d.getDate() - 1);
    let n = 0;
    while (has()) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function week(S, now) {
    const out = [], d = new Date(now);
    d.setDate(d.getDate() - 6);
    for (let i = 0; i < 7; i++) {
      const k = dayKey(d.getTime());
      out.push({ k, dow: d.getDay(), xp: S.days[k] || 0, today: i === 6 });
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  // ---------- badges ----------
  const typeOk = (S, t) => (S.stats.byType[t] || [0, 0])[1];
  const FULL_APPS = APPS.filter(a => FULL_BY_APP.get(a).length);
  const BADGES = [
    { id: 'first', icon: 'arrow', name: 'First session', desc: 'Finish your first session.', test: S => S.stats.sessions >= 1 },
    { id: 'goal', icon: 'bolt', name: 'Daily goal', desc: 'Reach your daily goal.', test: S => S.stats.goalDays >= 1 },
    { id: 'streak3', icon: 'flame', name: '3-day streak', desc: 'Study three days in a row.', test: (S, c) => c.streak >= 3 },
    { id: 'streak7', icon: 'flame', name: '7-day streak', desc: 'Study seven days in a row.', test: (S, c) => c.streak >= 7 },
    { id: 'streak30', icon: 'flame', name: '30-day streak', desc: 'Study thirty days in a row.', test: (S, c) => c.streak >= 30 },
    { id: 'combo10', icon: 'bolt', name: '10 in a row', desc: 'Ten right answers in a row.', test: S => S.stats.bestCombo >= 10 },
    { id: 'perfect', icon: 'check', name: 'Perfect session', desc: 'Finish a session with every answer right.', test: S => S.stats.perfect >= 1 },
    { id: 'order25', icon: 'list', name: '25 step orders', desc: 'Put the steps in order 25 times.', test: S => typeOk(S, 'order') >= 25 },
    { id: 'cue25', icon: 'shield', name: '25 cues', desc: 'Get 25 cueing questions right.', test: S => typeOk(S, 'cue') >= 25 },
    { id: 'ch15', icon: 'circle', name: 'Challenge 15', desc: 'Score 15 in a challenge.', test: S => S.stats.challengeBest >= 15 },
    { id: 'ch40', icon: 'circle', name: 'Challenge 40', desc: 'Score 40 in a challenge.', test: S => S.stats.challengeBest >= 40 },
    { id: 'exam', icon: 'exam', name: 'Exam pass', desc: 'Score 80% or more on an exam.', test: S => S.stats.examPasses >= 1 },
    { id: 'met', icon: 'learn', name: 'Met them all', desc: `Study all ${FULL.length} exercises with instructions.`, test: S => FULL.every(e => box(S, e.id) > 0) },
    ...FULL_APPS.map(a => ({ id: 'app:' + a, app: a, name: `${a} solid`, desc: `Every ${a} exercise at Solid or better.`, test: S => FULL_BY_APP.get(a).every(e => box(S, e.id) >= 3) })),
    { id: 'master', icon: 'crown', name: 'Mastered all', desc: `Master all ${FULL.length} exercises.`, test: S => FULL.every(e => box(S, e.id) >= 5) },
  ];
  function awardBadges(S, ctx) {
    const got = [];
    for (const b of BADGES) if (!S.badges[b.id] && b.test(S, ctx)) { S.badges[b.id] = ctx.now; got.push(b); }
    return got;
  }

  function weakSpots(S, n) {
    const acc = e => S.ex[e.id].c / S.ex[e.id].s;
    return FULL.filter(e => { const r = S.ex[e.id]; return r && r.s >= 2 && r.c / r.s < 0.75; })
      .sort((a, b) => acc(a) - acc(b) || S.ex[b.id].s - S.ex[a.id].s).slice(0, n);
  }

  return {
    APPS, APP_INFO, EX, FULL, BY_ID, BY_APP, FULL_BY_APP, FULL_APPS, FAMILIES, FAM, famsOf, TYPES, TIERS, STAGES, INTERVAL, GEN, norm, shuffle, steps,
    makeQuestion, materialize, specsDaily, specsDrill, specsExercise, specsExam, challengeSpec,
    grade, box, isDue, level, LV, dayKey, streak, week, BADGES, awardBadges, weakSpots,
  };
})();

  // ---------------- progress state ----------------
  function freshState() {
    return { v: 2, updatedAt: 0, name: '', xp: 0, ex: {}, days: {}, badges: {}, lastGoal: '', installTipHidden: false,
      stats: { answered: 0, correct: 0, sessions: 0, perfect: 0, bestCombo: 0, challengeBest: 0, examBest: 0, examPasses: 0, goalDays: 0, byType: {} },
      settings: { goal: 100, newPer: 4, focus: 'all', sound: true } };
  }
  function migrate(x) {
    const d = freshState();
    if (!x || typeof x !== 'object' || typeof x.ex !== 'object') return d;
    const out = Object.assign(d, x);
    if (x.v !== 2) {   // progress from the earlier app refers to a different exercise list; keep only name and settings
      Object.assign(out, { xp: 0, ex: {}, days: {}, badges: {}, lastGoal: '', stats: freshState().stats });

    out.stats = Object.assign(freshState().stats, x.stats || {});
    out.stats.byType = Object.assign({}, (x.stats && x.stats.byType) || {});
    out.settings = Object.assign(freshState().settings, x.settings || {});
    out.ex = Object.assign({}, x.ex);

    if (![50, 100, 150].includes(out.settings.goal)) out.settings.goal = 100;
    if (![2, 4, 6].includes(out.settings.newPer)) out.settings.newPer = 4;
    for (const k of Object.keys(out.ex)) {
      const r = out.ex[k];
      if (!E.BY_ID.has(+k) || !r || typeof r !== 'object') { delete out.ex[k]; continue; }
      r.b = Math.max(0, Math.min(5, +r.b || 0)); r.d = +r.d || 0; r.s = +r.s || 0; r.c = +r.c || 0; r.l = +r.l || 0;
    }
    out.v = 2;
    return out;
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }

  function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
